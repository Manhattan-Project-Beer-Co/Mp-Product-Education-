<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP LAUNCH PAD | Manhattan Project Beer Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  :root {
    /* MP LAUNCH PAD — public-site B/W + warm earth accents (no green) */
    --void: #000000;
    --bg: #ffffff;
    --surface: #f3f1ee;
    --surface-2: #ebe7e1;
    --ink: #181818;
    --gold: #9c6b4a;
    --gold-bright: #b8835c;
    --gold-dim: #7a5338;
    --gold-glow: rgba(156, 107, 74, 0.18);
    --sidebar-w: 248px;
    --content-max: 1200px;
    --chrome-offset: 0px;
    --page-pad: 24px;

    --black: #181818;
    --charcoal: #2a2622;
    --cream: #f7f5f2;
    --paper: #ffffff;
    --muted: #7a736b;
    --line: #e4dfd8;
    --line-strong: #cfc7bc;
    --green: rgba(156, 107, 74, 0.14);
    --green-text: #7a5338;
    --accent: #9c6b4a;
    --accent-light: rgba(156, 107, 74, 0.08);
    --accent-glow: rgba(156, 107, 74, 0.16);
    --sand: #c4a574;
    --stone: #6e6358;
    --shadow-sm: 0 1px 2px rgba(24, 24, 24, 0.06);
    --shadow-md: 0 10px 28px rgba(24, 24, 24, 0.08);
    --shadow-lg: 0 20px 48px rgba(24, 24, 24, 0.12);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 18px;
    --font: "Crimson Text", Georgia, "Times New Roman", serif;
    --font-display: "Josefin Sans", "Helvetica Neue", Arial, sans-serif;
    --font-script: "Dancing Script", "Brush Script MT", cursive;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);

    /* Phase 1 design system */
    --btn-height: 42px;
    --btn-height-sm: 34px;
    --btn-pad-x: 16px;
    --btn-radius: 10px;
    --card-pad: 18px;
    --card-radius: 14px;
    --section-gap: 28px;
    --title-size: 1.35rem;
    --sub-size: 0.95rem;
  }

  html {
    scroll-behavior: smooth;
    overflow-x: clip;
  }

  body {
    font-family: var(--font);
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 70% 45% at 0% 0%, rgba(196, 165, 116, 0.12), transparent 55%),
      radial-gradient(ellipse 55% 40% at 100% 0%, rgba(156, 107, 74, 0.07), transparent 50%);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.65;
    font-size: 17px;
    min-height: 100vh;
    overflow-x: clip;
  }

  h1, h2, h3, h4,
  .tab, .filter-btn, .auth-btn, .coffee-subtab,
  .stage-title, .brand-text h1, .brand-text p,
  .sidebar-brand-text, .login-card h1, .login-card .login-sub,
  .name, .coffee-section-num, .btn, button {
    font-family: var(--font-display);
  }

  /* ── Top bar ── */
  .site-header {
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 30;
  }

  .header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    max-width: 1080px;
    margin: 0 auto;
    padding: 14px 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
    font: inherit;
    color: inherit;
    text-align: left;
  }

  .brand-mark {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.04) 100%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }

  .brand-mark img {
    display: block;
    width: 86%;
    height: 86%;
    object-fit: contain;
  }

  .brand-text h1 {
    font-size: 12px;
    font-weight: 700;
    margin: 0;
    color: #181818;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .brand-text p {
    font-size: 10px;
    font-weight: 600;
    margin: 3px 0 0;
    color: var(--muted);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  /* ── Sticky toolbar ── */
  .toolbar {
    position: sticky;
    top: var(--chrome-offset, 0px);
    z-index: 25;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 4px 20px rgba(9, 9, 11, 0.03);
  }

  .toolbar-inner {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: 12px var(--page-pad);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .tabs {
    display: flex;
    gap: 3px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px;
    background: #eef0f4;
    border-radius: var(--radius-md);
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    padding: 9px 15px;
    border-radius: 10px;
    border: none;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    color: var(--muted);
    background: transparent;
    transition: color 0.2s var(--ease), background 0.2s var(--ease), box-shadow 0.2s var(--ease), transform 0.15s var(--ease);
  }

  .tab:hover { color: var(--black); }

  .tab.active {
    background: var(--paper);
    color: var(--black);
    box-shadow: var(--shadow-sm);
  }

  .tab:active { transform: scale(0.97); }

  .search-wrap {
    position: relative;
    width: 100%;
    max-width: 280px;
    flex-shrink: 0;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.45;
    pointer-events: none;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 11px 14px 11px 42px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-md);
    font-family: var(--font);
    font-size: 14px;
    background: var(--paper);
    color: var(--black);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: var(--shadow-sm);
  }

  .auth-panel input {
    padding: 12px 14px;
    margin-bottom: 14px;
  }

  input::placeholder { color: #a1a1aa; }

  input:focus {
    border-color: rgba(9, 9, 11, 0.22);
    box-shadow: 0 0 0 4px rgba(9, 9, 11, 0.06);
  }

  .auth-panel input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }

  .filter-wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 12px;
  }

  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .filters::-webkit-scrollbar { display: none; }

  .filter-btn {
    border: 1px solid var(--line-strong);
    background: var(--paper);
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s var(--ease);
  }

  .filter-btn:hover {
    color: var(--black);
    border-color: rgba(9, 9, 11, 0.18);
    transform: translateY(-1px);
  }

  .filter-btn.active {
    background: var(--black);
    border-color: var(--black);
    color: #fff;
    box-shadow: 0 4px 12px rgba(9, 9, 11, 0.18);
  }

  /* ── Auth ── */
  .auth-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .auth-btn {
    border: 1px solid var(--line-strong);
    background: #fff;
    color: #181818;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.15s, color 0.2s;
  }

  .auth-btn:hover {
    background: var(--surface);
    border-color: var(--gold);
    color: #181818;
  }

  .auth-btn:active { transform: scale(0.97); }

  .auth-btn.primary {
    background: linear-gradient(135deg, var(--gold-bright), var(--gold-dim));
    color: #fff;
    border-color: var(--gold);
  }

  .auth-btn.primary:hover { filter: brightness(1.05); }

  .auth-btn.microsoft {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid #8c8c8c;
    padding: 11px 14px;
    font-size: 13px;
    font-weight: 600;
  }

  .auth-btn.microsoft:hover {
    background: #f3f3f3;
    border-color: #8c8c8c;
  }

  .auth-btn.microsoft svg { flex-shrink: 0; }

  .auth-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0;
    color: var(--muted, #71717a);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .auth-divider::before,
  .auth-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(0, 0, 0, 0.08);
  }

  .auth-user {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    line-height: 1.4;
  }

  .auth-user strong {
    display: block;
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
  }

  /* ── Layout ── */
  .app-main {
    min-height: calc(100vh - 180px);
    padding-bottom: 40px;
  }

  #content.is-entering {
    animation: contentEnter 0.45s var(--ease) both;
  }

  @keyframes contentEnter {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .status {
    text-align: center;
    padding: 80px 24px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
  }

  .status strong {
    display: block;
    color: var(--black);
    margin-bottom: 8px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* ── Cards ── */
  .list {
    padding: 20px var(--page-pad);
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: var(--content-max);
    margin: 0 auto;
    width: 100%;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    cursor: pointer;
    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s;
    box-shadow: var(--shadow-sm);
    min-width: 0;
    /* Do not clip — tap Save / beer selects must stay fully visible. */
    overflow: visible;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--line-strong);
    box-shadow: var(--shadow-md);
  }

  .tap-layout {
    display: grid;
    grid-template-columns: 56px minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }

  .tap-number {
    width: 56px;
    min-height: 56px;
    border-radius: var(--radius-md);
    background: linear-gradient(145deg, #18181b 0%, #09090b 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    box-shadow: 0 4px 12px rgba(9, 9, 11, 0.2);
    flex-shrink: 0;
  }

  .tap-number small {
    font-size: 8px;
    letter-spacing: 0.14em;
    color: rgba(255, 255, 255, 0.45);
    font-weight: 600;
    margin-bottom: 3px;
    text-transform: uppercase;
  }

  .tap-number strong {
    font-size: 22px;
    font-weight: 700;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    min-width: 0;
  }

  .card-top > div {
    min-width: 0;
    flex: 1;
  }

  .name {
    font-weight: 700;
    font-size: 16px;
    margin: 0 0 5px;
    letter-spacing: -0.02em;
    color: var(--black);
    overflow-wrap: anywhere;
  }

  .desc {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
    line-height: 1.6;
    overflow-wrap: anywhere;
  }

  .abv {
    font-size: 11px;
    font-weight: 700;
    background: var(--black);
    color: #fff !important;
    padding: 6px 10px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .tags {
    display: flex;
    gap: 6px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 10.5px;
    font-weight: 600;
    background: var(--accent-light);
    color: var(--accent);
    padding: 5px 10px;
    border-radius: 999px;
  }

  .tag.gf { background: var(--green); color: var(--green-text); }
  .tag.dairy { background: #eff6ff; color: #1d4ed8; }
  .tag.nuts { background: #fef3c7; color: #b45309; }
  .tag.gluten { background: #fef2f2; color: #b91c1c; }
  .tag.new { background: var(--black); color: #fff; }

  .details-hint {
    font-size: 11px;
    color: #a1a1aa;
    margin-top: 12px;
    font-weight: 500;
  }

  .new-banner {
    margin: 20px auto 0;
    max-width: min(var(--content-max), calc(100% - (2 * var(--page-pad))));
    width: 100%;
    background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    color: #fff;
    box-shadow: var(--shadow-md);
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-sizing: border-box;
  }

  .new-banner-main {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px 24px;
  }

  .new-banner-copy {
    flex: 1;
    min-width: 0;
  }

  .new-banner-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: rgba(255, 255, 255, 0.45);
    margin: 0 0 8px;
    text-transform: uppercase;
  }

  .new-banner-name {
    font-size: clamp(18px, 2.4vw, 24px);
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
  }

  .new-banner-desc {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.58);
    margin: 0;
    line-height: 1.55;
    max-width: 48rem;
  }

  .new-banner-meta {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    text-align: right;
  }

  .new-banner-tap,
  .new-banner-abv {
    display: inline-block;
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: rgba(255, 255, 255, 0.85);
    white-space: nowrap;
  }

  .new-banner-abv {
    background: rgba(255, 255, 255, 0.08);
  }

  .new-banner-dots {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .new-banner-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: none;
    padding: 0;
    background: rgba(255, 255, 255, 0.22);
    transition: background 0.2s, transform 0.2s;
    cursor: pointer;
  }

  .new-banner-dot.active {
    background: #fff;
    transform: scale(1.15);
  }

  @media (max-width: 720px) {
    .new-banner-main {
      flex-direction: column;
      gap: 12px;
    }
    .new-banner-meta {
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
    }
  }

  /* ── Games ── */
  .game-card, .flash-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-xl);
    padding: 36px 28px;
    margin: 20px 24px;
    max-width: 1032px;
    margin-left: auto;
    margin-right: auto;
    text-align: center;
    box-shadow: var(--shadow-md);
  }

  .game-question {
    font-size: 16px;
    color: var(--black);
    margin-bottom: 28px;
    line-height: 1.65;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .game-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .game-option {
    padding: 15px 18px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-md);
    background: var(--paper);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }

  .game-option:hover:not(.correct):not(.wrong):not(.disabled) {
    border-color: rgba(9, 9, 11, 0.18);
    background: var(--surface-2);
    transform: translateX(4px);
  }

  .game-option.correct { background: var(--green); border-color: var(--green-text); color: var(--green-text); }
  .game-option.wrong { background: #fef2f2; border-color: #ef4444; color: #dc2626; }

  .game-next,
  .auth-panel .game-next {
    margin-top: 24px;
    padding: 13px 26px;
    border: none;
    border-radius: var(--btn-radius, var(--radius-md));
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  }

  .game-next:active { transform: scale(0.98); }

  .game-score, .flash-count {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin: 14px 24px 0;
    font-weight: 600;
  }

  .answer-review {
    max-width: 1032px;
    margin: 14px auto 0;
    padding: 0 24px;
    text-align: left;
  }
  .answer-review h3 {
    margin: 0 0 10px;
    font-family: var(--font-display);
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .answer-review-list {
    display: grid;
    gap: 10px;
  }
  .answer-review-item {
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-left: 3px solid #c65c52;
    border-radius: var(--radius-md);
    background: var(--paper);
  }
  .answer-review-question {
    margin: 0 0 9px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--ink);
  }
  .answer-review-row {
    margin: 3px 0;
    font-size: 0.9rem;
    line-height: 1.4;
    color: var(--muted);
  }
  .answer-review-row strong { color: var(--ink); }
  .answer-review-correct strong { color: #3f6b4a; }
  .answer-review-note {
    margin: 9px 0 0;
    font-size: 0.86rem;
    line-height: 1.45;
    color: var(--muted);
  }

  .flash-card {
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
  }

  .flash-nav {
    display: flex;
    justify-content: space-between;
    padding: 0 24px;
    margin-top: 14px;
    max-width: 1080px;
    margin-left: auto;
    margin-right: auto;
  }

  .flash-nav button,
  .game-back {
    padding: 10px 16px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--paper);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.2s var(--ease);
    box-shadow: var(--shadow-sm);
  }

  .flash-nav button:hover,
  .game-back:hover {
    color: var(--black);
    border-color: rgba(9, 9, 11, 0.18);
    transform: translateY(-1px);
  }

  .game-back {
    display: inline-flex;
    align-items: center;
    margin: 20px 24px 0;
    max-width: 1080px;
  }

  .game-hub {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 20px 24px;
    max-width: 1080px;
    margin: 0 auto;
  }

  .game-tile {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 20px 18px;
    cursor: pointer;
    text-align: left;
    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }

  .game-tile::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent-glow) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.25s;
  }

  .game-tile:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
  }

  .game-tile:hover::before { opacity: 1; }

  .game-tile-icon {
    font-size: 22px;
    margin-bottom: 12px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f4f4f5 0%, #e4e4e7 100%);
    border-radius: var(--radius-sm);
    position: relative;
    z-index: 1;
  }

  .game-tile-title {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 5px;
    color: var(--black);
    position: relative;
    z-index: 1;
    letter-spacing: -0.01em;
  }

  .game-tile-desc {
    font-size: 12px;
    color: var(--muted);
    margin: 0;
    line-height: 1.5;
    position: relative;
    z-index: 1;
  }

  .game-leaderboard {
    max-width: 1080px;
    margin: 0 auto 8px;
    padding: 0 24px;
  }

  .game-leaderboard-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
  }

  .game-leaderboard-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .game-leaderboard-head h3 {
    margin: 0;
    font-size: 16px;
    letter-spacing: -0.02em;
  }

  .game-leaderboard-tabs {
    display: flex;
    gap: 6px;
  }

  .game-leaderboard-tabs button {
    border: 1px solid var(--line);
    background: #fafafa;
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .game-leaderboard-tabs button.active {
    background: var(--black);
    color: #fff;
    border-color: var(--black);
  }

  .game-leaderboard-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .game-leaderboard-table th,
  .game-leaderboard-table td {
    padding: 8px 6px;
    text-align: left;
    border-bottom: 1px solid var(--line);
  }

  .game-leaderboard-table th {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .game-leaderboard-table tr:last-child td {
    border-bottom: none;
  }

  .game-leaderboard-table tr.me-row td {
    background: rgba(201, 162, 39, 0.12);
    font-weight: 600;
  }

  .lb-name-cell {
    min-width: 140px;
  }

  .lb-name {
    display: block;
    font-weight: 600;
  }

  .lb-fav-beer {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
  }

  .favorite-beer-panel {
    margin: 0 0 18px;
    padding: 16px 18px;
    border: 1px solid rgba(201, 162, 39, 0.28);
    border-radius: 12px;
    background: rgba(201, 162, 39, 0.06);
  }

  .favorite-beer-panel h3 {
    margin: 0 0 6px;
    font-size: 16px;
  }

  .favorite-beer-panel p {
    margin: 0 0 12px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.45;
  }

  .favorite-beer-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .favorite-beer-row input,
  .favorite-beer-row select {
    flex: 1;
    min-width: 180px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
  }
  .favorite-beer-row button {
    min-height: var(--btn-height, 42px);
    margin-top: 0;
    margin-bottom: 0;
  }

  .favorite-beer-row select option {
    background: var(--surface);
    color: var(--ink);
  }

  .favorite-beer-legacy {
    margin: 10px 0 0;
    font-size: 0.85rem;
    opacity: 0.75;
  }

  .tap-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }

  .tap-row .tap-number {
    flex: 0 0 42px;
    font-size: 1.2rem;
    font-weight: 700;
    text-align: center;
    opacity: 0.8;
    width: auto;
    min-height: 0;
    background: transparent;
    color: var(--ink);
    box-shadow: none;
    border-radius: 0;
  }

  .tap-beer { flex: 1; min-width: 0; }

  .tap-beer select {
    width: 100%;
    max-width: 420px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
  }

  .tap-inline-editor {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: stretch;
    margin-top: 12px;
    min-width: 0;
    width: 100%;
  }

  .tap-inline-editor select {
    flex: 1 1 140px;
    min-width: 0;
    width: auto;
    max-width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
  }

  .tap-inline-save {
    flex: 0 0 auto;
    margin: 0 !important;
    padding: 8px 14px !important;
    font-size: 12px !important;
    white-space: nowrap;
  }

  .tap-empty-card .details-hint { display: none; }

  .ontap-export-bar {
    max-width: var(--content-max);
    width: 100%;
    margin: 8px auto 28px;
    padding: 18px var(--page-pad);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 18px;
    border-top: 1px solid var(--line);
  }

  .ontap-export-bar .game-next {
    margin: 0;
  }

  .ontap-export-bar p {
    margin: 0;
    flex: 1;
    min-width: 200px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.45;
  }

  .tap-beer select option { background: var(--surface); color: var(--ink); }

  .tap-meta { font-size: 0.82rem; opacity: 0.7; margin-top: 4px; }

  .favorite-beer-row .game-next {
    margin: 0;
  }

  .favorite-beer-error {
    margin-top: 8px;
    font-size: 13px;
    color: #e07070;
  }

  .game-points-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(201, 162, 39, 0.2);
    color: #c9a227;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
  }

  /* ── Launch Pad combat ── */
  .rocket-shell {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 12px 24px;
  }

  .galaga-cabinet {
    border: 1px solid rgba(201, 162, 39, 0.35);
    border-radius: 14px;
    background: #0a0a0a;
    box-shadow:
      0 0 0 1px rgba(201, 162, 39, 0.12),
      0 16px 48px rgba(0, 0, 0, 0.55);
    overflow: hidden;
  }

  .galaga-cabinet.shake {
    animation: cabinetShake 0.42s ease;
  }

  @keyframes cabinetShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .galaga-bezel {
    background: linear-gradient(180deg, #121212, #0a0a0a);
    border-bottom: 1px solid rgba(201, 162, 39, 0.22);
    padding: 12px 14px 10px;
    font-family: var(--font);
  }

  .galaga-hud {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    color: #bdbdbd;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .galaga-hud span { color: var(--gold-bright, #e0b93a); }

  .galaga-hud .combo-hot span { color: #fff; text-shadow: 0 0 12px rgba(201,162,39,0.8); }

  .galaga-lives {
    display: inline-flex;
    gap: 5px;
    align-items: center;
    vertical-align: middle;
  }

  .galaga-life {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid var(--gold, #c9a227);
    background: radial-gradient(circle at 35% 35%, #e0b93a, #8b6b3c);
    box-shadow: 0 0 8px rgba(201,162,39,0.45);
  }

  .galaga-life.empty {
    background: transparent;
    opacity: 0.35;
    box-shadow: none;
  }

  .galaga-mission {
    color: var(--gold-bright, #e0b93a);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.45;
    min-height: 2.4em;
    text-shadow: 0 0 14px rgba(201, 162, 39, 0.28);
  }

  .rocket-arena {
    position: relative;
    height: min(62vh, 520px);
    min-height: 380px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 45% at 50% 0%, rgba(201,162,39,0.1), transparent 55%),
      radial-gradient(ellipse 50% 40% at 80% 90%, rgba(201,162,39,0.05), transparent 50%),
      #050505;
    touch-action: none;
    cursor: crosshair;
  }

  .rocket-star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #e8d48a;
    opacity: 0.75;
    border-radius: 50%;
    animation: rocketTwinkle 2.4s ease-in-out infinite;
  }

  @keyframes rocketTwinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .rocket-enemy {
    position: absolute;
    width: 84px;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: auto;
    cursor: crosshair;
    user-select: none;
    z-index: 2;
    transition: filter 0.15s;
  }

  .rocket-enemy.diving {
    z-index: 3;
    filter: drop-shadow(0 0 10px rgba(201,162,39,0.55));
  }

  .rocket-junk {
    position: absolute;
    width: 34px;
    height: 34px;
    transform: translate(-50%, -50%);
    z-index: 3;
    pointer-events: auto;
    cursor: crosshair;
    user-select: none;
  }

  .rocket-junk svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 0 5px rgba(201,162,39,0.35));
  }

  .rocket-junk.kind-hop { width: 30px; height: 30px; }
  .rocket-junk.kind-scrap { width: 28px; height: 28px; }
  .rocket-junk.kind-ore { width: 26px; height: 26px; }
  .rocket-junk.kind-spark { width: 22px; height: 22px; }

  .rocket-junk.destroyed {
    animation: rocketBoom 0.28s ease forwards;
    pointer-events: none;
  }

  .rocket-shell.is-locked .rocket-junk {
    pointer-events: none;
  }

  .galaga-sprite {
    width: 48px;
    height: 48px;
    margin: 0 auto 6px;
    position: relative;
  }

  .galaga-sprite svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 0 6px rgba(201,162,39,0.35));
  }

  .galaga-sprite-spin {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    transform-origin: 50% 50%;
    animation: atomSpin 6s linear infinite;
    will-change: transform;
  }

  .rocket-enemy.kind-1 .galaga-sprite-spin { animation-duration: 4.5s; animation-direction: reverse; }
  .rocket-enemy.kind-2 .galaga-sprite-spin { animation-duration: 7s; }
  .rocket-enemy.kind-3 .galaga-sprite-spin { animation-duration: 5s; animation-direction: reverse; }
  .rocket-enemy.diving .galaga-sprite-spin { animation-duration: 1.2s; }

  @keyframes atomSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }


  .rocket-enemy-label {
    display: block;
    font-family: var(--font);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.25;
    color: #f2f2f2;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    max-width: 78px;
    margin: 0 auto;
    word-break: break-word;
  }

  .rocket-enemy.correct .rocket-enemy-label { color: #e0b93a; }
  .rocket-enemy.wrong .rocket-enemy-label { color: #f0a8a8; }

  .rocket-enemy.destroyed {
    animation: rocketBoom 0.4s ease forwards;
    pointer-events: none;
  }

  .rocket-shell.is-locked .rocket-enemy {
    pointer-events: none;
  }

  @keyframes rocketBoom {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; filter: none; }
    40% { transform: translate(-50%, -50%) scale(1.35); opacity: 1; filter: brightness(1.6); }
    100% { transform: translate(-50%, -50%) scale(1.7); opacity: 0; }
  }

  .rocket-ship {
    position: absolute;
    left: 50%;
    bottom: 8px;
    width: 48px;
    height: 56px;
    transform: translateX(-50%);
    z-index: 4;
    pointer-events: none;
    filter: drop-shadow(0 0 10px rgba(201,162,39,0.55));
  }

  .rocket-ship-body {
    width: 48px;
    height: 56px;
    margin: 0 auto;
    position: relative;
    background: none;
  }

  .rocket-ship-body svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .rocket-ship-flame {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 10px;
    height: 16px;
    margin-left: -5px;
    background: linear-gradient(180deg, #fff6c8, #e0b93a 40%, transparent);
    border-radius: 40%;
    animation: rocketFlame 0.25s ease-in-out infinite alternate;
    opacity: 0.95;
    z-index: -1;
  }

  @keyframes rocketFlame {
    from { transform: scaleY(0.75); opacity: 0.65; }
    to { transform: scaleY(1.2); opacity: 1; }
  }

  .rocket-bullet {
    position: absolute;
    width: 4px;
    height: 14px;
    margin-left: -2px;
    border-radius: 99px;
    background: linear-gradient(180deg, #fff6c8, #c9a227);
    box-shadow: 0 0 10px rgba(201,162,39,0.9);
    z-index: 3;
    pointer-events: none;
  }

  .rocket-burst {
    position: absolute;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    z-index: 5;
    background:
      radial-gradient(circle, #fff 0 18%, transparent 19%),
      radial-gradient(circle, #e0b93a 0 40%, transparent 41%),
      radial-gradient(circle, rgba(201,162,39,0.5) 0 60%, transparent 61%);
  }

  .rocket-burst.show {
    animation: rocketBurst 0.4s ease forwards;
  }

  @keyframes rocketBurst {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(3.2); opacity: 0; }
  }

  .rocket-controls {
    display: grid;
    grid-template-columns: 1fr 1.15fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }

  .rocket-controls button {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    line-height: 1.4;
    border: 1px solid rgba(201,162,39,0.32);
    background: #111;
    color: #fff;
    border-radius: 10px;
    padding: 14px 8px;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    text-transform: uppercase;
  }

  .rocket-controls button:active {
    background: #1a1a1a;
    transform: translateY(1px);
  }

  .rocket-controls .rocket-fire-btn {
    background: linear-gradient(135deg, #e0b93a, #8b6b3c);
    border-color: #c9a227;
    color: #0a0a0a;
  }

  .rocket-hint {
    margin: 10px 0 0;
    text-align: center;
    font-size: 11px;
    line-height: 1.5;
    color: #888;
    letter-spacing: 0.04em;
  }

  .galaga-result {
    position: absolute;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    z-index: 6;
    font-family: var(--font);
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: #e0b93a;
    text-shadow: 0 0 18px rgba(201,162,39,0.55);
    pointer-events: none;
    white-space: nowrap;
    text-transform: uppercase;
  }

  .galaga-result.miss { color: #f0a8a8; text-shadow: 0 0 16px rgba(180,70,70,0.45); }

  .galaga-debrief {
    position: absolute;
    left: 50%;
    top: 62%;
    transform: translate(-50%, 0);
    z-index: 6;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #ddd;
    background: rgba(10,10,10,0.75);
    border: 1px solid rgba(201,162,39,0.3);
    border-radius: 8px;
    padding: 8px 12px;
    pointer-events: none;
    text-align: center;
    max-width: 86%;
  }

  .galaga-debrief strong { color: #e0b93a; }

  @media (max-width: 640px) {
    .rocket-arena { min-height: 340px; }
    .rocket-enemy { width: 70px; }
    .rocket-enemy-label { font-size: 10px; max-width: 70px; }
    .galaga-mission { font-size: 12px; }
    .galaga-result { font-size: 15px; }
  }

  .speed-header {
    margin: 20px 24px 0;
    max-width: 1032px;
    margin-left: auto;
    margin-right: auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
  }

  .speed-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .speed-bar-track {
    height: 6px;
    background: #e4e4e7;
    border-radius: 999px;
    overflow: hidden;
  }

  .speed-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #27272a, #09090b);
    border-radius: 999px;
    transition: width 0.3s linear;
  }

  .speed-bar-fill.urgent { background: linear-gradient(90deg, #ef4444, #dc2626); }

  .game-option.disabled {
    pointer-events: none;
    opacity: 0.65;
  }

  .streak-badge {
    display: inline-block;
    background: var(--green);
    color: var(--green-text);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    margin-left: 6px;
  }

  /* ── Sections ── */
  .coffee-intro {
    margin: 0 auto;
    padding: 32px 24px 24px;
    max-width: 1080px;
    border-bottom: none;
  }

  .coffee-intro h2 {
    margin: 0 0 8px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--black);
    line-height: 1.2;
  }

  .coffee-intro p {
    margin: 0;
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 540px;
  }

  .coffee-subtabs,
  .coffee-filters {
    display: flex;
    gap: 8px;
    padding: 0 24px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 1080px;
    margin: 0 auto;
  }

  .coffee-subtabs::-webkit-scrollbar,
  .coffee-filters::-webkit-scrollbar { display: none; }

  .coffee-subtab {
    padding: 8px 15px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--paper);
    font-family: var(--font);
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.2s var(--ease);
  }

  .coffee-subtab.active {
    background: var(--black);
    border-color: var(--black);
    color: #fff;
    box-shadow: 0 4px 12px rgba(9, 9, 11, 0.15);
  }

  .coffee-list {
    padding: 0 24px 20px;
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .coffee-section-num {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin: 0 0 6px;
    text-transform: uppercase;
  }

  .coffee-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--accent-light);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .manual-body {
    font-size: 15px;
    line-height: 1.75;
    color: #3f3f46;
  }

  .manual-body p { margin: 0 0 16px; }

    line-height: 1.45;
  }
  .page-header-actions {

  /* ── Phase 1: nav groups ── */

    color: var(--muted);
    font-family: var(--font-display);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.14em;

  .nav-group-chevron {

  .home-shift-action {

  .away-item-kicker {
    font-family: var(--font-display);
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;

    font-size: 0.98rem;
    font-weight: 650;

  .today-strip {

  .weekly-edit-stack {

  /* ── Phase 5: On Tap table + print ── */
  .ontap-table-wrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--card-radius);
    background: #fff;
  }
  .ontap-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }
  .ontap-table th {
    text-align: left;
    padding: 10px 12px;
    font-family: var(--font-display);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--line-strong);
    background: var(--surface);
    white-space: nowrap;
  }
  .ontap-table td {
    padding: 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  .ontap-table tr:last-child td { border-bottom: 0; }
  .ontap-table tbody tr {
    cursor: pointer;
    transition: background 0.12s;
  }
  .ontap-table tbody tr:hover { background: rgba(156, 107, 74, 0.06); }
  .ontap-table .tap-col {
    width: 52px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--ink);
  }
  .ontap-table .name-col { font-weight: 650; color: var(--ink); }
  .ontap-table .flavor-col { color: var(--muted); max-width: 280px; }
  .ontap-table .meta-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .ontap-mobile-list { display: none; }
  .ontap-row-edit {
    margin-top: 8px;
  }
  .ontap-meta-edit {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }
  .ontap-meta-edit label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .ontap-meta-edit input,
  .ontap-meta-edit select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    font: inherit;
  }
  .print-chooser {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0 16px;
  }
  .ontap-print-root {
    display: none;
  }
  @media (max-width: 860px) {
    .ontap-table-wrap { display: none; }
    .ontap-mobile-list { display: block; }
  }
  @media print {
    @page { margin: 0.45in; }
    body.printing-ontap {
      background: #fff !important;
      background-image: none !important;
    }
    body.printing-ontap .app-shell,
    body.printing-ontap .modal-backdrop,
    body.printing-ontap .site-header,
    body.printing-ontap #loginGate {
      display: none !important;
    }
    body.printing-ontap .ontap-print-root {
      display: block !important;
      color: #111;
    }
    body.printing-ontap.printing-draft:not(.printing-bar) .print-bar-sheet { display: none !important; }
    body.printing-ontap.printing-bar:not(.printing-draft) .print-draft-sheet { display: none !important; }
    .print-sheet + .print-sheet {
      break-before: page;
      margin-top: 0;
    }
    .print-draft-sheet {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      max-width: 3.6in;
      margin: 0 auto;
    }
    .print-draft-brand {
      text-align: center;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .print-draft-cat {
      margin: 16px 0 8px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
      border-bottom: 1px solid #111;
      padding-bottom: 3px;
    }
    .print-draft-item { margin: 0 0 10px; }
    .print-draft-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .print-draft-meta {
      font-size: 11px;
      color: #333;
      margin-top: 1px;
    }
    .print-bar-sheet {
      font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11px;
    }
    .print-bar-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0 0 10px;
    }
    .print-bar-table {
      width: 100%;
      border-collapse: collapse;
    }
    .print-bar-table th,
    .print-bar-table td {
      border-bottom: 1px solid #ccc;
      padding: 8px 6px;
      text-align: left;
      vertical-align: top;
    }
    .print-bar-table th {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-bottom: 1.5px solid #111;
    }
    .print-bar-table tr:nth-child(even) td { background: #f4f4f4; }
    .print-bar-table .tap { width: 36px; font-weight: 700; }
    .print-bar-table .pour { width: 64px; white-space: nowrap; }
    .print-bar-table .gr { width: 28px; }
    .print-bar-table .abv { width: 48px; white-space: nowrap; }
  }

  @media (max-width: 640px) {
    .away-item { flex-direction: column; }
    .away-item-ack { margin: 0 12px 12px; align-self: flex-start; }
    .today-cards { grid-template-columns: 1fr; }
  }

  /* Training dashboard (UX Phase 6) */

    width: 100%;

  }
  .training-hero {
    position: relative;
    padding: 18px 20px 22px;
    margin-bottom: 28px;
    border: 1px solid var(--line-strong);

    background:
      linear-gradient(145deg, rgba(196, 165, 116, 0.14), transparent 55%),
      #fff;
    overflow: hidden;
  }
  .training-kicker {
    margin: 0 0 8px;
    font-family: var(--font-display);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold-dim);
  }
  .training-welcome {
    margin: 0 0 6px;
    font-family: var(--font-display);
    font-size: clamp(1.55rem, 4vw, 1.9rem);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #181818;
    line-height: 1.15;
  }
  .training-shift-line {
    margin: 0 0 10px;
    font-family: var(--font-display);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .training-focus-title {
    margin: 0 0 18px;
    font-family: var(--font-display);

    font-weight: 700;

  .training-progress-meta {

  .training-progress-track {

    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line);

  }
  .training-progress-fill {

  }
  .training-progress-note {

    font-size: 0.88rem;

  }
  .training-meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 18px 0 18px;
  }
  .training-meta-label {
    display: block;
    margin-bottom: 3px;
    font-family: var(--font-display);
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .training-meta-grid strong {
    font-size: 0.95rem;
    color: var(--ink);
    font-weight: 650;
  }
  .training-continue {
    width: 100%;

    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-height: 52px;
    padding: 14px 20px;

  .training-continue small {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;

  }
  .training-section {
    margin: 0 0 28px;
  }
  .training-section-title {
    margin: 0 0 8px;
    font-family: var(--font-display);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .training-section-lead {
    margin: 0 0 14px;
    font-size: 0.92rem;
    color: var(--muted);
    line-height: 1.45;
  }
  .training-empty {
    margin: 0;
    padding: 14px 16px;
    border: 1px dashed var(--line-strong);
    border-radius: var(--card-radius);
    color: var(--muted);
  }
  .training-roadmap {
    display: flex;

    overflow-x: auto;
    padding: 4px 2px 8px;
    scrollbar-width: thin;
  }
  .training-road-step {
    flex: 1 0 118px;
    min-width: 118px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 12px 14px;

  .training-road-step.is-current {

  .training-road-step.is-done {

  .training-road-marker {
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }
  .training-road-step.is-current .training-road-marker,
  .training-road-step.is-done .training-road-marker {
    border-color: var(--gold);
    color: var(--gold-dim);
    background: rgba(156, 107, 74, 0.12);
  }
  .training-road-shift {
    display: block;
    font-family: var(--font-display);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .training-road-copy strong {
    display: block;
    margin: 2px 0 4px;
    font-size: 0.88rem;
    line-height: 1.25;
    color: var(--ink);
  }
  .training-road-copy small {
    color: var(--muted);
    font-size: 0.78rem;
  }
  .training-focus-blurb {
    margin: 0 0 16px;
    font-size: 1rem;
    line-height: 1.45;
    color: #3a3530;
  }
  .training-skill-group { margin-bottom: 16px; }
  .training-skill-group-title {
    margin: 0 0 8px;
    font-family: var(--font-display);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .training-skill-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
  }
  .training-skill-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    width: 100%;
    text-align: left;
    padding: 14px;
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.12s, background 0.15s;
  }
  .training-skill-card:hover {
    border-color: var(--gold);
    transform: translateY(-1px);
    background: rgba(156, 107, 74, 0.04);
  }
  .training-skill-card.status-verified {
    opacity: 0.78;
    border-color: rgba(156, 107, 74, 0.4);
  }
  .training-skill-kind {
    font-family: var(--font-display);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-dim);
  }
  .training-skill-label {
    font-size: 0.95rem;
    font-weight: 650;
    color: var(--ink);
    line-height: 1.3;
  }
  .training-status {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 999px;
    font-family: var(--font-display);
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid transparent;
  }
  .training-status-verified {
    color: #3f6b4a;
    background: rgba(63, 107, 74, 0.1);
    border-color: rgba(63, 107, 74, 0.25);
  }
  .training-status-learning {
    color: var(--gold-dim);
    background: rgba(156, 107, 74, 0.1);
    border-color: rgba(156, 107, 74, 0.28);
  }
  .training-status-ready {
    color: #5a4a2e;
    background: rgba(196, 165, 116, 0.2);
    border-color: rgba(156, 107, 74, 0.35);
  }
  .training-status-not-started,
  .training-status-practice {
    color: var(--muted);
    background: var(--surface);
    border-color: var(--line);
  }
  .training-tools-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }
  .training-tool-chip {
    border: 1px solid var(--line-strong);
    background: #fff;
    border-radius: 999px;
    padding: 8px 12px;
    font-family: var(--font-display);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
  }
  .training-tool-chip:hover {
    border-color: var(--gold);
    background: rgba(156, 107, 74, 0.06);
  }
  .training-loop {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 4px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: var(--card-radius);
    background: var(--surface);

  .training-loop-step {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
  }
  .training-loop-num {
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--line-strong);
    font-family: var(--font-display);
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--gold-dim);
  }
  .training-loop-step strong {
    font-family: var(--font-display);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .training-loop-arrow {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 0 2px;
  }
  .training-loop-reset { color: var(--gold-dim); }
  .training-quick-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
  }
  .training-quick {
    border: 1px solid var(--line-strong);
    background: #fff;
    color: #181818;
    border-radius: 10px;
    padding: 14px 12px;
    font-family: var(--font-display);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.12s;
  }
  .training-quick:hover {
    border-color: var(--gold);
    background: rgba(156, 107, 74, 0.05);
    transform: translateY(-1px);
  }
  @media (max-width: 720px) {
    .training-roadmap {
      flex-direction: column;
    }
    .training-road-step {
      flex: 1 1 auto;
      min-width: 0;

      align-items: center;

      display: none;
    }

  @media (max-width: 640px) {

  /* Mobile tabs / chips readable on light header */
  #mobileTabs .tab {
    background: var(--paper) !important;
    color: #3a3530 !important;
    border: 1px solid var(--line-strong) !important;
  }
  #mobileTabs .tab.active {
    background: rgba(156,107,74,0.14) !important;
    color: var(--ink) !important;
    border-color: var(--gold) !important;
  }
  .coffee-subtab {
    background: var(--paper) !important;
    color: #3a3530 !important;
    border: 1px solid var(--line) !important;
  }
  .coffee-subtab.active {
    background: rgba(156,107,74,0.14) !important;
    color: var(--ink) !important;
    border-color: var(--gold) !important;
  }
  .galaga-hud span, .galaga-mission { color: var(--gold-bright); }

  /* Mid tablets: keep sidebar but slim it so content isn’t crushed */
  @media (min-width: 1025px) and (max-width: 1280px) {
    :root { --sidebar-w: 200px; --page-pad: 20px; }
    .sidebar-nav .tab { padding: 9px 10px; font-size: 12px; }
    .sidebar-brand-text strong { font-size: 13px; }
  }

  /* UX Phase 7 — mobile drawer + consistency */
  .mobile-nav-toggle {
    display: none;
    width: 44px;
    height: 44px;
    flex: 0 0 auto;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 0;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
  }
  .mobile-nav-toggle span {
    display: block;
    width: 18px;
    height: 2px;
    border-radius: 1px;
    background: #181818;
    transition: transform 0.2s var(--ease), opacity 0.2s var(--ease);
  }
  body.mobile-nav-open .mobile-nav-toggle span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }
  body.mobile-nav-open .mobile-nav-toggle span:nth-child(2) { opacity: 0; }
  body.mobile-nav-open .mobile-nav-toggle span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }
  .mobile-nav-scrim {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 55;
    border: 0;
    padding: 0;
    margin: 0;
    background: rgba(9, 9, 11, 0.42);
    cursor: pointer;
  }

  @media (max-width: 1024px) {
    .app-sidebar {
      display: flex !important;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      height: 100%;
      height: 100dvh;
      width: min(300px, 88vw);
      max-width: 320px;
      transform: translateX(-105%);
      transition: transform 0.28s var(--ease);
      box-shadow: none;
      z-index: 60;
      padding-top: max(16px, env(safe-area-inset-top, 0px));
      padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));

      transform: translateX(0);
      box-shadow: 12px 0 40px rgba(9, 9, 11, 0.16);
    }
    body.mobile-nav-open .mobile-nav-scrim { display: block; }
    body.mobile-nav-open { overflow: hidden; }

    .site-header {
      display: block;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .mobile-nav-toggle { display: inline-flex; }
    #mobileTabs { display: none !important; }
    .mobile-account-links { display: none !important; }

      flex: 1;
      min-width: 0;

      letter-spacing: 0.14em;

    .site-header .auth-btn {

      padding: 8px 12px;
      font-size: 12px;
    }
    .page-header {
      flex-direction: column;
      align-items: stretch;
    }
    .page-header-actions {
      width: 100%;
    }
    .page-header-actions .btn {
      flex: 1 1 auto;
      justify-content: center;
      min-height: 44px;
    }
    .filter-btn,
    .coffee-subtab,
    .inventory-filter-btn,
    .btn,
    .auth-btn,
    .briefing-back,
    .training-tool-chip,
    .training-quick,
    .quick-access-card {
      min-height: 44px;
    }
    .sidebar-nav .tab {
      min-height: 44px;

    }
    .ontap-export-bar {

      min-height: 44px;
    }

      max-height: min(92dvh, calc(100dvh - env(safe-area-inset-top, 0px) - 8px));

  }

  .game-tile-icon {

  /* Sign-in — light + earth, comfortable for staff */

  .login-card {

    max-width: 400px;
    text-align: center;

    box-shadow: var(--shadow-lg);

  .login-card .login-atom {
    width: 128px;

function consumeAuthCallbackParams() {
  const params = new URLSearchParams(window.location.search);
  const authError = params.get("auth_error");
  if (!authError) return null;

  params.delete("auth_error");
  const clean = params.toString();
  const nextUrl = clean ? `${window.location.pathname}?${clean}` : window.location.pathname;
  window.history.replaceState({}, "", nextUrl);

  return { authError };
}

function contentType() {
  if (activeType === "menu") return menuSubView;
  if (activeType === "floor") {
    if (floorHubView === "sops") return "sops";
    if (floorHubView === "checklists") return "checklists";
    if (floorHubView === "today") return "today-floor";
    return "floor";
  }
  return activeType;
}

/** Leaf tab id that should appear active in the sidebar / mobile strip. */
function navLeafId() {
  return contentType();
}

function highlightNavLeaf(leaf = navLeafId()) {
  document.querySelectorAll("#mainTabs .tab[data-type], #mobileTabs .tab[data-type]").forEach((t) => {
    t.classList.toggle("active", t.dataset.type === leaf);
  });
  document.querySelectorAll("#mainTabs .nav-group").forEach((navGroup) => {
    navGroup.classList.remove("is-open");
    navGroup.querySelector(".nav-group-toggle")?.setAttribute("aria-expanded", "false");
  });
  const active = document.querySelector(`#mainTabs .tab[data-type="${leaf}"]`);
  if (!active) return;
  const group = active.closest(".nav-group");
  if (!group) return;
  group.classList.add("is-open");
  const toggle = group.querySelector(".nav-group-toggle");
  if (toggle) toggle.setAttribute("aria-expanded", "true");
}

function syncNavGroupVisibility() {
  document.querySelectorAll("#mainTabs .nav-group").forEach((group) => {
    const tabs = [...group.querySelectorAll(".tab[data-type]")];
    if (!tabs.length) {
      group.style.display = "";
      return;
    }
    const anyShown = tabs.some((t) => t.style.display !== "none");
    group.style.display = anyShown ? "" : "none";
  });
}

function persistHubViews() {
  try {
    sessionStorage.setItem("mpMenuSubView", menuSubView);
    sessionStorage.setItem("mpFloorHubView", floorHubView);
  } catch (_) {}
}

function setMenuSubView(id) {
  if (!MENU_SUBVIEW_IDS.has(id)) return;
  menuSubView = id;
  persistHubViews();
  if (id !== "coffee") {
    coffeeSection = "menu";
    coffeeMode = "guide";
  }
  if (id !== "food") foodCategory = "all";
  if (id !== "merch") merchSection = "stock";
  if (id !== "bar") barSection = "all";
  updateHubChips();
  updateSearchPlaceholder();
  updateStageTitle();
  highlightNavLeaf(id);
  render();
}

function setFloorHubView(id) {
  if (!FLOOR_HUB_VIEWS.some((v) => v.id === id)) return;
  floorHubView = id;
  persistHubViews();
  if (id !== "sops") {
    sopCategory = "all";
    if (sopEditId) resetSopForm();
  }
  if (id !== "checklists") {
    checklistId = null;
    checklistDetail = null;
  }
  updateHubChips();
  updateSearchPlaceholder();
  updateStageTitle();
  const leaf = id === "tools" ? "floor" : id === "today" ? "today-floor" : id;
  highlightNavLeaf(leaf);
  render();
}

function updateHubChips() {
  // Phase 1: leaf nav in the sidebar replaces Menu / Floor hub chips.
  const wrap = document.getElementById("hubChipsWrap");
  const chips = document.getElementById("hubChips");
  if (!wrap || !chips) return;
  wrap.hidden = true;
  chips.innerHTML = "";
}

}

function viewfinderBeanDetailHtml(item) {
  const rows = [
    item.process && ["Process", item.process],
    item.elevation && ["Elevation", item.elevation],
    item.varietals && ["Varietals", item.varietals],
    item.brewTemp && ["Brew temp", item.brewTemp],
    item.producer && ["Producer", item.producer],
    item.importer && ["Importer", item.importer],
    item.espressoRecipe && ["Espresso recipe", item.espressoRecipe]
  ].filter(Boolean);

  return `
    ${item.description ? `<p class="desc" style="margin-top:10px;">${escapeHTML(item.description)}</p>` : ""}
    ${item.tastingNotes ? `<p class="desc" style="margin-top:8px;"><strong>Tasting notes:</strong> ${escapeHTML(item.tastingNotes)}</p>` : ""}
    ${rows.length ? `
      <div class="desc" style="margin-top:10px;font-size:13px;line-height:1.55;">
        ${rows.map(([label, value]) => `<div><strong>${escapeHTML(label)}:</strong> ${escapeHTML(value)}</div>`).join("")}
      </div>
    ` : ""}
    ${item.guestTalk ? `<p class="desc manual-callout" style="margin-top:12px;"><strong>Guest line:</strong> ${escapeHTML(item.guestTalk)}</p>` : ""}
    ${item.url ? `<p class="desc" style="margin-top:8px;"><a href="${escapeForAttribute(item.url)}" target="_blank" rel="noopener noreferrer">Viewfinder page →</a></p>` : ""}
  `;
}

function seasonalLatteRecipeHtml(item) {
  const recipe = item.recipe;
  if (!recipe) {
    return `
      ${item.build ? `<div class="detail-section">
        <p class="detail-label">Build</p>
        <p class="detail-text">${escapeHTML(item.build)}</p>
      </div>` : ""}
      ${item.training ? `<div class="detail-section manual-callout"><p class="detail-label">Staff talking points</p><p class="detail-text">${escapeHTML(item.training)}</p></div>` : ""}
    `;
  }

  const list = items => `<ul>${items.map(line => `<li>${escapeHTML(line)}</li>`).join("")}</ul>`;
  return `
    <div class="detail-section">
      <p class="detail-label">Syrup (brown sugar base)</p>
      <div class="detail-text">${list(recipe.syrup || [])}</div>
    </div>
    <div class="detail-section">
      <p class="detail-label">Cold foam</p>
      <div class="detail-text">${list(recipe.coldFoam || [])}</div>
    </div>
    <div class="detail-section">
      <p class="detail-label">Build</p>
      <div class="detail-text">${list(recipe.buildSteps || [])}</div>
    </div>
    <div class="detail-section">
      <p class="detail-label">Hot presentation</p>
      <div class="detail-text">${list(recipe.hotPresentation || [])}</div>

    ${item.training ? `<div class="detail-section manual-callout"><p class="detail-label">Staff talking points</p><p class="detail-text">${escapeHTML(item.training)}</p></div>` : ""}
  `;
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];

    if (inQuotes) {
      if (c === '"' && next === '"') {
        field += '"';
        i++;
      } else if (c === '"') {
        inQuotes = false;
      } else {
        field += c;
      }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") {
        row.push(field);
        field = "";
      } else if (c === "\n" || c === "\r") {
        if (field !== "" || row.length) {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        }
      } else {
        field += c;
      }
    }
  }

  if (field !== "" || row.length) {
    row.push(field);
    rows.push(row);
  }

  if (!rows.length) return [];

  const headers = rows[0].map(h => h.trim());

  return rows.slice(1).filter(r => r.length > 1).map(r => {
    const obj = {};
    headers.forEach((h, i) => {
      obj[h] = (r[i] || "").trim();
    });
    return obj;
  });
}

async function loadData(options = {}) {
  const skipRender = Boolean(options.skipRender);
  const content = document.getElementById("content");

  try {
    // Beers come from Nucleus, through this app's server — the API key must not
    // reach the browser, and Nucleus's CORS would refuse a direct call anyway.
    // The rows arrive in the shape this page already reads, so everything below
    // — filters, search, games, cards — is untouched by the move off the sheet.
    const beerResponse = await fetch("/api/beers", { cache: "no-store" });

    if (!beerResponse.ok) {
      const body = await beerResponse.json().catch(() => ({}));
      throw new Error(body.error || "Beer list returned " + beerResponse.status);
    }

    beers = (await beerResponse.json()).beers.filter(b =>
      b.Name &&
      b.Name.trim() !== "" &&
      b.Name.trim() !== "?"
    );

    if (FOOD_CSV_URL !== "PASTE_YOUR_FOOD_CSV_LINK_HERE") {
      try {
        const foodResponse = await fetch(FOOD_CSV_URL, { cache: "no-store" });
        if (foodResponse.ok) {
          foods = parseCSV(await foodResponse.text());
        }
      } catch (foodError) {
        console.warn("Food data could not be loaded:", foodError);
      }
    } else {
      foods = FOOD_MENU.map(item => ({
        Name: item.name,
        "Description / ingredients": item.description,
        Special: item.isSpecial ? "Yes" : "",
        "New Special": item.isNew ? "Yes" : ""
      }));
    }

    if (!skipRender) render();
    startNewTapRotation();
    updateSearchPlaceholder();
    if (typeof ensureWeeklySpecials === "function") {
      ensureWeeklySpecials().catch((err) => console.warn("Weekly specials:", err.message));
    }
    if (typeof ensureTapDisplayMeta === "function") {
      ensureTapDisplayMeta().catch((err) => console.warn("Tap display meta:", err.message));
    }
  } catch (error) {
    console.error(error);
    content.innerHTML = `
      <div class="status">
        <strong>The beer list could not be loaded.</strong>
        ${escapeHTML(error.message || "Nucleus could not be reached.")}
      </div>
    `;
  }
}

function col(item, field) {
  return (item[field] || "").trim();
}

function beerNameMatches(beer, targetName) {
  return col(beer, "Name").toLowerCase() === targetName.trim().toLowerCase();
}

function getFlavorProfile(item) {
  return col(item, "Flavor Profile");
}

function getDescription(item) {
  return col(item, "Description / ingredients") || col(item, "Marketing Description");
}

function getStyle(item) {
  return col(item, "Style");
}

function getIBU(item) {
  return col(item, "IBU");
}

function getABVText(item) {
  const value = col(item, "abv") || col(item, "ABV");
  if (!value) return "";
  return value.includes("%") ? value : value + "%";
}

function isYes(val) {
  return (val || "").toLowerCase().trim().startsWith("yes");
}

function isFoodSpecial(item) {
  return (
    isYes(item["New"]) ||
    isYes(item["Special"]) ||
    isYes(item["New Special"]) ||
    isYes(item["Food Special"])
  );
}

// `Staff Notes` used to hold Nucleus's `sensory_profile` with the history note
// appended, hence the two-source merge that lived here. `sensory_profile` is
// QC's tasting record and is no longer served to this app at all, so the note is
// the whole of it. `Training Notes` stays for the food items, which come from
// elsewhere and use that key.
function getStaffNotes(item) {
  return col(item, "Staff Notes") || col(item, "Training Notes");
}

function isOnTap(item) {
  return isYes(item["On Tap"]);
}

function onTapGameBeer(extra = () => true) {
  return b => col(b, "Name") && isOnTap(b) && extra(b);
}

function getTapNumber(item) {
  const match = (item["On Tap"] || "").match(/\d+/);
  return match ? match[0] : "";
}

function getABVNumber(item) {
  const value = String(item.abv || item.ABV || "").replace("%", "");
  const number = parseFloat(value);
  return Number.isNaN(number) ? 0 : number;
}

function getSearchText(item) {
  return [
    col(item, "Name"),
    getStyle(item),
    getFlavorProfile(item),
    getDescription(item),
    getStaffNotes(item),
    getIBU(item) ? `IBU ${getIBU(item)}` : ""
  ].join(" ").toLowerCase();
}

function matchesFilter(item) {
  if (activeFilter === "all") return true;
  if (activeFilter === "highabv") return getABVNumber(item) >= 8;
  if (activeFilter === "gf") return isYes(item["Gluten-Reduced"]);
  if (activeFilter === "new") return isYes(item["New Tap"]);
  if (activeFilter === "untried") {
    if (!currentUser || !beerCheckinsLoaded) return true;
    return !getBeerCheckin(col(item, "Name"));
  }
  if (activeFilter === "tried") {
    if (!currentUser || !beerCheckinsLoaded) return false;
    return Boolean(getBeerCheckin(col(item, "Name")));
  }
  return true;
}

function shuffle(arr) {
  const a = arr.slice();

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}

async function searchAskMp(query) {
  askMpQuery = String(query || "").trim();
  if (!askMpQuery) {
    askMpResults = [];
    askMpError = "";
    render();
    return;
  }
  askMpLoading = true;
  askMpError = "";
  render();
  try {
    const data = await apiFetch(`/api/search?q=${encodeURIComponent(askMpQuery)}`);
    const terms = askMpQuery.toLowerCase().split(/\s+/).filter(Boolean);
    const foodMatches = (typeof FOOD_MENU !== "undefined" ? FOOD_MENU : [])
      .filter((item) => {
        const text = `${item.name || ""} ${item.description || ""} ${item.section || ""}`.toLowerCase();
        return terms.every((term) => text.includes(term));
      })
      .slice(0, 5)
      .map((item) => ({
        type: "food",
        title: item.name,
        summary: item.description || item.section || "",
        tab: "food",
        score: 20
      }));
    askMpResults = [...(data.results || []), ...foodMatches]
      .sort((a, b) => Number(b.score || 0) - Number(a.score || 0))
      .slice(0, 12);
  } catch (err) {
    askMpError = err.message || "Search is unavailable right now.";
    askMpResults = [];
  } finally {
    askMpLoading = false;
    if (contentType() === "askmp") render();
  }
}

async function apiFetch(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };

  const response = await fetch(`${API_BASE}${path}`, { ...options, headers });
  const data = await response.json().catch(() => ({}));

  // A 401 while we believed we were signed in means the session ended: the
  // cookie expired, or the account was removed or its role changed such that
  // the server no longer recognises it. Send the user back to sign in rather
  // than leaving them in a shell where every request quietly fails.
  if (response.status === 401 && currentUser) handleSessionEnded();

  if (!response.ok) throw new Error(data.error || "Request failed.");
  return data;
}

function syncChromeOffset() {
  const root = document.documentElement;
  const header = document.querySelector(".site-header");
  const useMobileChrome = window.matchMedia("(max-width: 1024px)").matches;
  let offset = 0;
  if (useMobileChrome && header) {
    const shown = getComputedStyle(header).display !== "none";
    if (shown) offset = Math.ceil(header.getBoundingClientRect().height);
  }
  root.style.setProperty("--chrome-offset", `${offset}px`);
  if (!useMobileChrome) closeMobileNav();
}

let chromeOffsetObserver = null;
function watchChromeOffset() {
  syncChromeOffset();
  const header = document.querySelector(".site-header");
  if (!header || typeof ResizeObserver === "undefined") return;
  if (chromeOffsetObserver) chromeOffsetObserver.disconnect();
  chromeOffsetObserver = new ResizeObserver(() => syncChromeOffset());
  chromeOffsetObserver.observe(header);
  window.addEventListener("resize", syncChromeOffset, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncChromeOffset, { passive: true });
  }
}

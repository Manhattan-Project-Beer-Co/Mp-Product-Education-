function formatShiftClock(iso) {
  if (!iso) return "";
  const ms = Date.parse(iso);
  if (!Number.isFinite(ms)) return "";
  return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function formatMinutesLeft(mins) {
  if (mins == null || !Number.isFinite(mins)) return "";
  if (mins > 0) return `ends in ~${mins} min`;
  if (mins === 0) return "ending now";
  return `ended ${Math.abs(mins)} min ago`;
}

function describeShiftStatus(shift) {
  if (!currentUser) {
    return { state: "off", label: "", detail: "", visible: false };
  }
  if (!shift) {
    return {
      state: "off",
      label: "Schedule",
      detail: "Shift status unavailable",
      visible: true
    };
  }
  if (!shift.synced || shift.source === "none") {
    return {
      state: "off",
      label: "Off schedule sync",
      detail: "7shifts is not linked yet",
      visible: true
    };
  }

  const current = shift.currentShift;
  const roleBits = [current?.roleName, current?.stationName].filter(Boolean).join(" · ");
  const windowText = current
    ? `${formatShiftClock(current.startAt)}–${formatShiftClock(current.endAt)}`
    : "";
  const minsText = formatMinutesLeft(shift.minutesToEnd);

  if (shift.onShift || shift.isShiftLeadNow) {
    const lead = shift.isShiftLeadNow || currentUser.on_shift_lead_duty;
    return {
      state: lead ? "lead" : "on",
      label: lead ? "On shift · Lead" : "On shift",
      detail: [roleBits || "Taproom", windowText, minsText].filter(Boolean).join(" · "),
      visible: true
    };
  }

  if (shift.todayShifts?.length) {
    const next = shift.todayShifts.find(s => Date.parse(s.startAt) > Date.now()) || shift.todayShifts[0];
    const nextBits = [next.roleName, next.stationName].filter(Boolean).join(" · ");
    const nextWindow = `${formatShiftClock(next.startAt)}–${formatShiftClock(next.endAt)}`;
    const upcoming = Date.parse(next.startAt) > Date.now();
    return {
      state: upcoming ? "soon" : "off",
      label: upcoming ? "Scheduled today" : "Shift done",
      detail: [nextBits, nextWindow].filter(Boolean).join(" · "),
      visible: true
    };
  }

  return {
    state: "off",
    label: "Off shift",
    detail: "No 7shifts block mapped to you today",
    visible: true
  };
}

function renderShiftStatusUI() {
  const targets = [
    document.getElementById("sidebarShiftStatus"),
    document.getElementById("mobileShiftStatus")
  ].filter(Boolean);
  const desc = describeShiftStatus(getShiftContext());

  for (const el of targets) {
    if (!desc.visible) {
      el.hidden = true;
      el.classList.remove("is-visible", "is-clickable");
      el.innerHTML = "";
      el.removeAttribute("data-state");
      el.onclick = null;
      el.removeAttribute("role");
      el.removeAttribute("tabindex");
      continue;
    }
    el.hidden = false;
    el.classList.add("is-visible", "is-clickable");
    el.dataset.state = desc.state;
    el.setAttribute("role", "button");
    el.tabIndex = 0;
    el.innerHTML = `
      <div class="shift-status__label">${escapeHTML(desc.label)}</div>
      <div class="shift-status__detail">${escapeHTML(desc.detail)}</div>
      <div class="shift-status__action">Open today’s floor →</div>
    `;
    el.onclick = () => activateAppTab("today-floor");
    el.onkeydown = (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        activateAppTab("today-floor");
      }
    };
  }

  const cue = Boolean(getShiftContext()?.promptEndOfShift) && canSubmitShiftSurvey();
  document.querySelectorAll('[data-type="shift-survey"]').forEach(el => {
    el.classList.toggle("shift-cue", cue);
    if (cue && !el.dataset.shiftCueLabel) {
      el.dataset.shiftCueLabel = el.textContent;
      el.textContent = "End of Shift · due";
    } else if (!cue && el.dataset.shiftCueLabel) {
      el.textContent = el.dataset.shiftCueLabel;
      delete el.dataset.shiftCueLabel;
    }
  });
}

async function initAuth() {
  try {
    const providers = await fetch(`${API_BASE}/api/auth/providers`).then((r) => r.json());
    microsoftAuthAvailable = Boolean(providers.microsoft);
    devAuthAvailable = Boolean(providers.dev);
  } catch {
    // Fail closed. If we cannot tell what the server offers, offer nothing —
    // guessing "dev sign-in is probably on" would put a sign-in form in front
    // of a production outage.
    microsoftAuthAvailable = false;
    devAuthAvailable = false;
  }

  const callback = consumeAuthCallbackParams();

  // The session cookie is invisible to JavaScript, so the only way to know
  // whether we are signed in is to ask the server.
  try {
    const data = await apiFetch("/api/auth/me");
    currentUser = data.user;
  } catch {
    currentUser = null;
  }

  if (currentUser) {
    document.body.classList.remove("auth-pending", "signed-out");
    updateAuthUI();
    await loadBeerCheckins();
    return;
  }

  showLoginGate(callback?.authError);
}

// Signed out: the app shell stays hidden and this is the whole page. Nothing
// behind it is reachable anyway — every /api route except the sign-in
// handshake requires a session — but there is no reason to render a shell
// someone cannot use.
function showLoginGate(authError) {
  document.body.classList.remove("auth-pending");
  document.body.classList.add("signed-out");

  const message = document.getElementById("loginMessage");
  const actions = document.getElementById("loginActions");
  const error = document.getElementById("loginError");

  if (error) error.innerHTML = authError ? `<div class="auth-error">${escapeHTML(authError)}</div>` : "";

  if (microsoftAuthAvailable) {
    if (message) {
      message.textContent =
        "Sign in with your Manhattan Project work account. Your training profile is created automatically the first time.";
    }
    // Shares the branded button with the Microsoft logo used elsewhere, rather
    // than a second look-alike that would drift out of step with it.
    if (actions) actions.innerHTML = microsoftSignInButton();
  } else if (devAuthAvailable) {
    if (message) {
      message.textContent =
        "Local development server. Pick a seeded account to sign in as — this is not available on any deployed host.";
    }
    if (actions) actions.innerHTML = `<div id="devUserPicker" class="hint">Loading local accounts…</div>`;
  } else {
    if (message) {
      message.textContent =
        "Microsoft sign-in is not configured on this server yet, so there is no way to sign in. Ask an admin to set AZURE_CLIENT_ID and AZURE_CLIENT_SECRET.";
    }
    if (actions) actions.innerHTML = "";
  }

  // Both branches above are synchronous so the gate paints immediately; the
  // account list arrives after.
  if (devAuthAvailable && !microsoftAuthAvailable) renderDevUserPicker();
}

async function renderDevUserPicker() {
  const mount = document.getElementById("devUserPicker");
  if (!mount) return;

  let users = [];
  try {
    const data = await fetch(`${API_BASE}/api/auth/dev-users`).then((r) => r.json());
    users = Array.isArray(data.users) ? data.users : [];
  } catch {
    mount.textContent = "Could not load local accounts. Is the server still running?";
    return;
  }

  if (!users.length) {
    mount.innerHTML = `No accounts in the local database yet. Run <code>npm run seed</code> and reload.`;
    return;
  }

  mount.innerHTML = `
    <div class="auth-panel" style="margin:0;text-align:left;">
      <label for="devUserSelect">Sign in as</label>
      <select id="devUserSelect">
        ${users.map((u) => `<option value="${u.id}">${escapeHTML(u.name)} — ${escapeHTML(roleLabel(u.role))}</option>`).join("")}
      </select>
      <button class="game-next" type="button" style="margin-top:12px;width:100%;" onclick="submitDevLogin()">Sign in</button>
      <p class="hint" style="margin-top:10px;">Development only — no password, localhost only, refuses to boot in production.</p>
    </div>
  `;
}

async function submitDevLogin() {
  const error = document.getElementById("loginError");
  const select = document.getElementById("devUserSelect");
  if (!select) return;
  try {
    await apiFetch("/api/auth/dev-login", {
      method: "POST",
      body: JSON.stringify({ userId: Number(select.value) })
    });
    window.location.reload();
  } catch (err) {
    if (error) error.innerHTML = `<div class="auth-error">${escapeHTML(err.message)}</div>`;
  }
}

function startMicrosoftSignIn() {

}

async function logout() {
  try {
    await apiFetch("/api/auth/logout", { method: "POST" });
  } catch {
    // Clearing local state matters more than the round trip succeeding.
  }
  clearSessionState();
  // Back to the sign-in screen. Returning to a browsable shell would be
  // misleading now that every endpoint behind it requires a session.
  menuSubView = "ontap";
  floorHubView = "today";
  persistHubViews();
  activeType = "home";
  highlightNavLeaf("home");
  syncAccountLinkActive();
  showLoginGate();
}

function collectNewAnnouncements() {
  const items = [];

  beers
    .filter(b => col(b, "Name") && isOnTap(b) && isYes(b["New Tap"]))
    .forEach(b => {
      const summary = [getStyle(b), getFlavorProfile(b) || getDescription(b)].filter(Boolean).join(" — ");
      items.push({
        key: `beer:${col(b, "Name")}`,
        type: "beer",
        label: "New on tap",
        title: col(b, "Name"),
        summary: summary || "New beer on the tap list."
      });
    });

  foods
    .filter(f => col(f, "Name") && isFoodSpecial(f))
    .forEach(f => {
      items.push({
        key: `food:${col(f, "Name")}`,
        type: "food",
        label: "Food special",
        title: col(f, "Name"),
        summary: getDescription(f) || getFlavorProfile(f) || "New food special on the menu."
      });
    });

  FOOD_MENU
    .filter(item => item.isNew || item.isSpecial)
    .forEach(item => {
      if (items.some(entry => entry.key === `food:${item.name}`)) return;
      items.push({
        key: `food:${item.name}`,
        type: "food",
        label: "Food special",
        title: item.name,
        summary: item.description || "New or featured item on the food menu."
      });
    });

  COFFEE_SPECIALS
    .filter(l => l.available && l.isNew)
    .forEach(l => {
      items.push({
        key: `coffee-special:${l.id || l.name}`,
        type: "latte",
        label: l.kind === "matcha" ? "Seasonal matcha" : "Seasonal latte",
        title: l.name,
        summary: l.description || l.season
      });
    });

  const todayWeekly = getTodayWeeklySpecial();
  if (todayWeekly && todayWeekly.active) {
    items.push({
      key: getWeeklySpecialViewKey(todayWeekly),
      type: "weekly",
      specialId: todayWeekly.id,
      label: `${todayWeekly.dayLabel} special`,
      title: todayWeekly.name,
      summary: todayWeekly.description
    });
  }

  return items;
}

  try {

function buildAnnouncementTrainingHtml(item) {
  if (item.type === "beer") {
    const beer = beers.find(b => col(b, "Name") === item.title);
    if (!beer) {
      return `<p class="detail-text">This beer is no longer on the list. Check the On Tap tab for current taps.</p>`;
    }

    const flavor = getFlavorProfile(beer);
    const description = getDescription(beer);
    const tapNumber = getTapNumber(beer);
    const abv = getABVText(beer);
    const ibu = getIBU(beer);
    const style = getStyle(beer);
    const gf = isYes(beer["Gluten-Reduced"]);

    return `
      <p class="coffee-section-num">${escapeHTML(item.label)}</p>
      <h2 class="modal-title">${escapeHTML(item.title)}</h2>
      <p class="modal-style">${[style, abv ? abv + " ABV" : "", ibu ? "IBU " + ibu : "", tapNumber ? "Tap " + tapNumber : ""].filter(Boolean).map(v => escapeHTML(v)).join(" · ")}</p>
      <div class="tags">${gf ? `<span class="tag gf">Gluten-reduced</span>` : ""}</div>
      ${flavor ? `<div class="detail-section"><p class="detail-label">Flavor profile</p><p class="detail-text">${escapeHTML(flavor)}</p></div>` : ""}
      ${description ? `<div class="detail-section"><p class="detail-label">Description</p><p class="detail-text">${escapeHTML(description)}</p></div>` : ""}
      ${getStaffNotes(beer) ? `<div class="detail-section"><p class="detail-label">Staff notes</p><p class="detail-text">${escapeHTML(getStaffNotes(beer))}</p></div>` : ""}
    `;
  }

  if (item.type === "food") {
    const food = FOOD_MENU.find(entry => entry.name === item.title) ||
      foods.find(f => col(f, "Name") === item.title);
    if (!food) {
      return `<p class="detail-text">This food item is no longer on the list. Check the Food tab for current specials.</p>`;
    }

    if (food.id) {
      return buildFoodDetailHtml(food);
    }

    const description = getDescription(food);
    const flavor = getFlavorProfile(food);
    const staffNotes = getStaffNotes(food);

    return `
      <p class="coffee-section-num">${escapeHTML(item.label)}</p>
      <h2 class="modal-title">${escapeHTML(item.title)}</h2>
      ${description ? `<div class="detail-section"><p class="detail-label">Description / ingredients</p><p class="detail-text">${escapeHTML(description)}</p></div>` : ""}
      ${flavor ? `<div class="detail-section"><p class="detail-label">Flavor profile</p><p class="detail-text">${escapeHTML(flavor)}</p></div>` : ""}
      ${staffNotes ? `<div class="detail-section"><p class="detail-label">Staff notes</p><p class="detail-text">${escapeHTML(staffNotes)}</p></div>` : ""}
    `;
  }

  if (item.type === "latte") {
    const latte = COFFEE_SPECIALS.find(entry => entry.name === item.title);
    if (!latte) {
      return `<p class="detail-text">This seasonal drink is no longer listed. Check Coffee → Seasonal Lattes.</p>`;
    }

    return `
      <p class="coffee-section-num">${escapeHTML(item.label)} · ${escapeHTML(latte.season)}</p>
      <h2 class="modal-title">${escapeHTML(latte.name)}</h2>
      <p class="modal-style">${escapeHTML(latte.description)}</p>
      ${seasonalLatteRecipeHtml(latte)}
    `;
  }

  if (item.type === "weekly") {
    const special = WEEKLY_SPECIALS.find(entry => entry.id === item.specialId) || getTodayWeeklySpecial();
    if (!special) {
      return `<p class="detail-text">No weekly special configured. Check Food → Weekly Specials.</p>`;
    }
    return buildWeeklySpecialTrainingHtml(special);
  }

  return `<p class="detail-text">No training details available for this item.</p>`;
}

async function recordProgress(activityType, category, score, total, points, extras = {}) {
  if (!currentUser) return;
  try {
    const data = await apiFetch("/api/progress", {
      method: "POST",
      body: JSON.stringify({
        activity_type: activityType,
        category,
        score,
        total,
        points: points ?? score * (GAME_POINT_VALUES[activityType] || 10),
        max_streak: extras.maxStreak || 0
      })
    });
    myProgressData = null;
    teamData = null;
    leaderboardData = null;
    if ((data.titles || []).length) notifyClassifiedUnlock(data.titles);
    // Re-check Atomic Bartender / coverage-dependent secrets after sessions
    apiFetch("/api/achievements/check", { method: "POST", body: JSON.stringify({}) })
      .then(res => { if ((res.titles || []).length) notifyClassifiedUnlock(res.titles); })
      .catch(() => {});
  } catch (err) {
    console.warn("Could not save progress:", err.message);
  }
}

function notifyClassifiedUnlock(titles) {
  const list = (titles || []).filter(Boolean);
  if (!list.length) return;
  let toast = document.getElementById("classifiedToast");
  if (!toast) {
    toast = document.createElement("div");
    toast.id = "classifiedToast";
    toast.className = "classified-toast";
    document.body.appendChild(toast);
  }
  toast.innerHTML = `<strong>CLEARANCE UPGRADE</strong><span>${list.map(escapeHTML).join(" · ")}</span>`;
  toast.classList.add("show");
  clearTimeout(notifyClassifiedUnlock._t);
  notifyClassifiedUnlock._t = setTimeout(() => toast.classList.remove("show"), 4200);
}

async function loadBeerCheckins() {
  if (!currentUser) {
    beerCheckins = {};
    myTastingData = null;
    beerCheckinsLoaded = false;
    return;
  }

  try {
    const data = await apiFetch("/api/beer-checkins/me");
    beerCheckins = {};
    for (const row of data.checkins || []) {
      beerCheckins[row.beer_name.trim().toLowerCase()] = row;

// Tap editors live on Menu → On Tap cards (admins, managers, shift leads).
// Changing a tap writes to Nucleus and updates every app that reads the catalog.
let tapsState = { taps: [], canWrite: false, loaded: false, loading: false, error: "" };
let tapsLoadPromise = null;

function canEditTapsUi() {
  return Boolean(canManageTaps() && tapsState.canWrite);
}

async function ensureTapsState() {
  if (tapsState.loaded) return tapsState;
  if (tapsLoadPromise) return tapsLoadPromise;

  tapsState.loading = true;
  tapsLoadPromise = (async () => {
    try {
      const data = await apiFetch("/api/taps");
      tapsState = {
        taps: data.taps || [],
        canWrite: Boolean(data.canWrite),
        loaded: true,
        loading: false,
        error: ""
      };
    } catch (error) {
      tapsState = {
        taps: [],
        canWrite: false,
        loaded: true,
        loading: false,
        error: error.message || "Could not load taps."
      };
    } finally {
      tapsLoadPromise = null;
    }
    return tapsState;
  })();

  return tapsLoadPromise;
}

function renderTapEditor(tapId, productId) {
  if (!canEditTapsUi() || !tapId) return "";
  if (typeof isPageEditMode === "function" && !isPageEditMode("ontap")) return "";

let tapSaveBusy = false;

async function saveTap(tapId) {
  if (tapSaveBusy) return;
  const select = document.getElementById(`tapSelect-${tapId}`);
  const saveBtn = document.getElementById(`tapSaveBtn-${tapId}`);
  const errorEl = document.getElementById("tapSaveError");
  if (!select) return;
  if (errorEl) errorEl.style.display = "none";

  const productId = String(select.value || "").trim();
  tapSaveBusy = true;
  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving…";
  }
  try {
    // No product selected means the keg kicked — clearing is a DELETE, not a
    // write of nothing, because Nucleus keeps the fixture and empties the pour.
    await apiFetch(`/api/taps/${tapId}/product`, {
      method: productId ? "PUT" : "DELETE",
      ...(productId ? { body: JSON.stringify({ productId }) } : {})
    });
    tapsState.loaded = false;
    tapsState.loading = false;
    tapsLoadPromise = null;
    await loadData({ skipRender: true });
    await ensureTapsState();
    render();
  } catch (error) {
    if (errorEl) {
      errorEl.style.display = "";
      errorEl.textContent = error.message || "Could not change the tap.";
    } else {
      alert(error.message || "Could not change the tap.");
    }
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save";
    }
  } finally {
    tapSaveBusy = false;
  }
}

// The catalog, for any control that asks someone to name a beer. Fetched once
// per page load: it is the full product list, inactive included, because a
// favourite beer is very often one we no longer brew.
let beerOptionsCache = null;

async function loadBeerOptions() {
  if (beerOptionsCache) return beerOptionsCache;
  try {
    const data = await apiFetch("/api/beers/options");
    beerOptionsCache = data.options || [];
  } catch (error) {
    console.warn("Beer catalog could not be loaded:", error);
    beerOptionsCache = [];
  }
  return beerOptionsCache;
}

/**
 * Fill every beer picker currently on the page.
 *
 * Called from render() *and* from any panel that writes its markup
 * asynchronously. render()'s pass alone is not enough: an async panel sets its
 * innerHTML after the await, by which time render() has long since looked for
 * selects and found none — which is exactly how the Taps dropdowns shipped
 * empty.
 */
function populateBeerSelects() {
  document
    .querySelectorAll("select[data-selected]:not([data-populated])")
    .forEach((select) => populateBeerSelect(select));
}

/** Fill a <select> with the catalog, preselecting its data-selected id. */
let beerOptionsHtmlCache = "";

async function populateBeerSelect(select) {
  if (!select || select.dataset.populated === "1" || select.dataset.populated === "pending") return;
  select.dataset.populated = "pending";
  const options = await loadBeerOptions();
  if (!options.length) {
    select.dataset.populated = "";
    return;
  }
  if (!beerOptionsHtmlCache) {
    beerOptionsHtmlCache = options
      .map(
        (beer) =>
          `<option value="${escapeForAttribute(beer.id)}">` +
          `${escapeHTML(beer.name)}${beer.style ? ` — ${escapeHTML(beer.style)}` : ""}</option>`
      )
      .join("");
  }
  if (!select.isConnected) return;
  const selected = select.dataset.selected || "";
  select.insertAdjacentHTML("beforeend", beerOptionsHtmlCache);
  if (selected) select.value = selected;
  select.dataset.populated = "1";
}

};

function destroyCharts() {
  activeCharts.forEach(chart => chart.destroy());
  activeCharts = [];

function baseChartOptions(extra = {}) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: CHART_THEME.black,
        padding: 10,
        cornerRadius: 8
      }
    },
    ...extra
  };
}

function addChart(canvasId, config) {
  if (typeof Chart === "undefined") return null;
  const canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  const chart = new Chart(canvas, config);
  activeCharts.push(chart);
  return chart;
}

    </div>
  `;
}

function accuracyColor(value) {
  if (value >= 75) return CHART_THEME.green;
  if (value >= 60) return CHART_THEME.amber;
  return CHART_THEME.red;
}

function initProgressCharts(stats, prefix) {
  destroyCharts();

  if (stats.by_activity.length) {
    addChart(`${prefix}-activity`, {
      type: "bar",
      data: {
        labels: stats.by_activity.map(r => formatActivityLabel(r.activity_type, r.category)),
        datasets: [{
          data: stats.by_activity.map(r => r.accuracy),
          backgroundColor: stats.by_activity.map(r => accuracyColor(r.accuracy)),
          borderRadius: 6,
          maxBarThickness: 36
        }]
      },
      options: baseChartOptions({
        scales: {
          y: {
            min: 0,
            max: 100,
            grid: { color: CHART_THEME.grid },
            ticks: { callback: v => v + "%", font: { size: 11 } }
          },
          x: {
            grid: { display: false },
            ticks: { maxRotation: 45, minRotation: 45, font: { size: 10 } }
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ctx.parsed.y + "% accuracy" } }

    });

    const coffeeSessions = stats.by_activity.filter(r => r.category === "coffee").reduce((n, r) => n + r.attempts, 0);

    if (beerSessions + coffeeSessions > 0) {
      addChart(`${prefix}-category`, {

            borderWidth: 0
          }]

          cutout: "62%",
          plugins: {
            legend: {
              display: true,
              position: "bottom",
              labels: { boxWidth: 10, font: { size: 11 } }
            }
          }
        })
      });
    }
  }

  if (stats.recent.length) {
    const chronological = [...stats.recent].reverse();
    addChart(`${prefix}-trend`, {
      type: "line",
      data: {
        labels: chronological.map((r, i) => {
          const label = formatActivityLabel(r.activity_type, r.category);
          return label.length > 12 ? label.slice(0, 11) + "…" : label;
        }),
        datasets: [{
          label: "Score %",
          data: chronological.map(r => Math.round((r.score / r.total) * 100)),
          borderColor: CHART_THEME.black,
          backgroundColor: CHART_THEME.fill,
          fill: true,
          tension: 0.35,
          pointBackgroundColor: CHART_THEME.black,
          pointRadius: 4
        }]
      },
      options: baseChartOptions({
        scales: {
          y: {
            min: 0,
            max: 100,
            grid: { color: CHART_THEME.grid },
            ticks: { callback: v => v + "%", font: { size: 11 } }
          },
          x: { grid: { display: false }, ticks: { font: { size: 10 } } }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              afterLabel(ctx) {
                const row = chronological[ctx.dataIndex];
                return `${row.score} / ${row.total} correct`;
              }
            }
          }
        }
      })
    });
  }
}

async function fetchTeamActivityBreakdown(staff) {
  if (!staff.length || !currentUser) return [];
  try {
    const details = await Promise.all(
      staff.map(emp => apiFetch(`/api/admin/employees/${emp.id}`))
    );
    const map = {};
    details.forEach(d => {
      d.stats.by_activity.forEach(row => {
        const key = row.activity_type + "|" + row.category;
        if (!map[key]) {
          map[key] = { activity_type: row.activity_type, category: row.category, correct: 0, questions: 0 };
        }
        map[key].correct += row.correct;
        map[key].questions += row.questions;
      });
    });
    return Object.values(map)
      .map(r => ({ ...r, accuracy: r.questions ? Math.round((r.correct / r.questions) * 100) : 0 }))
      .sort((a, b) => b.questions - a.questions)
      .slice(0, 10);
  } catch {
    return [];
  }
}

function formatSurveyTimestamp(value) {

  const date = new Date(normalized);

}

async function submitShiftSurvey() {
  const errorEl = document.getElementById("shiftSurveyError");
  if (errorEl) errorEl.innerHTML = "";

  if (!shiftSurveyRating) {
    if (errorEl) {
      errorEl.innerHTML = `<div class="auth-error">Please rate your shift from 1 to 5.</div>`;
    }
    return;
  }

  const comments = document.getElementById("shiftSurveyComments")?.value || "";

  try {
    await apiFetch("/api/shift-surveys", {
      method: "POST",
      body: JSON.stringify({
        shiftDate: getLocalDateKey(),
        rating: shiftSurveyRating,
        comments
      })
    });
    sessionStorage.setItem(`shift-survey-prompt-${getLocalDateKey()}`, "done");
    render();
  } catch (err) {
    if (errorEl) {
      errorEl.innerHTML = `<div class="auth-error">${escapeHTML(err.message)}</div>`;
    }
  }
}

async function saveFloorStationAssignment(personKey, stationKey, displayName) {
  try {
    await apiFetch("/api/shifts/assignments", {
      method: "PUT",
      body: JSON.stringify({
        shiftDate: getTodayFloorDateKey(),
        personKey,
        stationKey: stationKey || null,
        displayName: displayName || ""
      })
    });
    await renderTodayFloorBoard(document.getElementById("content"));
  } catch (err) {
    alert(err.message || "Could not save station assignment.");
  }
}

function renderTodayFloorStationBoard(stationBoard, options = {}) {
  const opts = options && typeof options === "object" && !Array.isArray(options)
    ? options
    : { canAssign: Boolean(options) };
  const canAssign = Boolean(opts.canAssign);
  const stations = Array.isArray(opts.stations) ? opts.stations : [];
  const staff = Array.isArray(opts.staff) ? opts.staff : [];
  const board = Array.isArray(stationBoard) && stationBoard.length
    ? stationBoard
    : (stations.length ? stations.map(s => ({ key: s.key, label: s.label, people: [] })) : []);
  if (!board.length && !(canAssign && staff.length)) return "";

  const uniqueStaff = [];
  const seen = new Set();
  for (const row of staff) {
    const key = row.personKey || `${row.name}:${row.startAt}`;
    if (seen.has(key)) continue;
    seen.add(key);
    uniqueStaff.push(row);
  }

  const assignPanel = canAssign && uniqueStaff.length ? `
    <div class="today-floor__assign-panel">
      <h3>Assign stations</h3>
      <p>Pick Run / Bus, Coffee / Bar, Event, or Bar for each person. Saves immediately.</p>
      <ul class="today-floor__assign-list">
        ${uniqueStaff.map(row => `
          <li class="today-floor__assign-row">
            <div class="today-floor__assign-name">
              <strong>${escapeHTML(row.name)}</strong>
              ${row.roleName ? `<span>${escapeHTML(row.roleName)}</span>` : ""}
            </div>
            ${renderTodayFloorAssignControl(row, stations, true)}
          </li>
        `).join("")}
      </ul>
    </div>
  ` : "";

  return `
    <section class="today-floor__section">
      ${assignPanel}
      <h3>Floor stations</h3>
      <div class="today-floor__stations">
        ${board.map(station => `
          <div class="today-floor__station">
            <h4>${escapeHTML(station.label)}</h4>
            ${station.people?.length ? `
              <ul>
                ${station.people.map(person => `
                  <li>${escapeHTML(person.name)}${person.roleName ? ` · ${escapeHTML(person.roleName)}` : ""}</li>
                `).join("")}
              </ul>
            ` : `<div class="empty">Unassigned</div>`}
          </div>
        `).join("")}
      </div>
    </section>
  `;
}

function renderTodayFloorAssignControl(row, stations, canAssign) {
  if (!row.personKey) return "";
  if (!canAssign) {
    return row.floorStationLabel
      ? `<div class="today-floor__email">Station: ${escapeHTML(row.floorStationLabel)}</div>`
      : "";
  }
  const options = [
    `<option value="">Unassigned</option>`,
    ...(stations || []).map(station => `
      <option value="${escapeForAttribute(station.key)}"${row.floorStation === station.key ? " selected" : ""}>${escapeHTML(station.label)}</option>
    `)
  ].join("");
  return `
    <div class="today-floor__assign">
      <label>
        <span class="today-floor__assign-label">Station</span>
        <select aria-label="Floor station for ${escapeForAttribute(row.name)}" onchange="saveFloorStationAssignment('${escapeForAttribute(row.personKey)}', this.value, '${escapeForAttribute(row.name)}')">
          ${options}
        </select>
      </label>
    </div>
  `;
}

function addDaysToDateKey(dateKey, days) {
  const parts = String(dateKey || "").split("-").map(Number);
  if (parts.length !== 3 || parts.some(n => !Number.isFinite(n))) return getLocalDateKey();
  const dt = new Date(parts[0], parts[1] - 1, parts[2] + Number(days || 0));
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, "0");
  const d = String(dt.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function getTodayFloorDateKey() {
  const today = getLocalDateKey();
  return todayFloorDay === "tomorrow" ? addDaysToDateKey(today, 1) : today;
}

function setTodayFloorDay(day) {
  todayFloorDay = day === "tomorrow" ? "tomorrow" : "today";
  renderTodayFloorBoard(document.getElementById("content"));
}

function setTodayFloorRole(role) {
  todayFloorRole = role || "all";
  renderTodayFloorBoard(document.getElementById("content"));
}

async function renderTodayFloorBoard(content) {
  if (!content) return;
  content.innerHTML = `<div class="today-floor"><div class="status"><strong>Loading floor board…</strong></div></div>`;
  try {
    const dateKey = getTodayFloorDateKey();
    const data = await apiFetch(`/api/shifts/today?date=${encodeURIComponent(dateKey)}`);
    const staffAll = Array.isArray(data.staff) ? data.staff : [];
    const roles = Array.isArray(data.roles) && data.roles.length
      ? data.roles
      : [...new Set(staffAll.map(s => s.roleName).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    if (todayFloorRole !== "all" && !roles.includes(todayFloorRole)) todayFloorRole = "all";
    const staff = todayFloorRole === "all"
      ? staffAll
      : staffAll.filter(s => s.roleName === todayFloorRole);
    const dateLabel = formatShiftDateLabel(data.shiftDate || dateKey);
    const privileged = Boolean(data.privileged);
    const canSync = Boolean(data.canSync);
    const canAssign = Boolean(data.canAssignStations || data.privileged);
    const stations = Array.isArray(data.stations) ? data.stations : [];
    const isToday = data.isToday !== false && todayFloorDay === "today";
    const dayControls = `
      <div class="today-floor__controls coffee-subtabs" style="margin-bottom:12px;">
        <button type="button" class="coffee-subtab${todayFloorDay === "today" ? " active" : ""}" onclick="setTodayFloorDay('today')">Today</button>
        <button type="button" class="coffee-subtab${todayFloorDay === "tomorrow" ? " active" : ""}" onclick="setTodayFloorDay('tomorrow')">Tomorrow</button>
      </div>
    `;
    const roleControls = roles.length ? `
      <div class="today-floor__controls coffee-subtabs">
        <button type="button" class="coffee-subtab${todayFloorRole === "all" ? " active" : ""}" onclick="setTodayFloorRole('all')">All roles</button>
        ${roles.map(role => `
          <button type="button" class="coffee-subtab${todayFloorRole === role ? " active" : ""}" onclick="setTodayFloorRole('${escapeForAttribute(role)}')">${escapeHTML(role)}</button>
        `).join("")}
      </div>
    ` : "";

    if (!data.synced || data.source === "none") {
      content.innerHTML = `
        <div class="today-floor">
          <div class="today-floor__intro">
            <h2>Today’s Floor</h2>
            <p>Schedule sync is offline — check 7shifts directly for who’s working.</p>
          </div>
          ${dayControls}
          ${canSync ? `
            <div class="today-floor__admin">
              <div class="today-floor__admin-row">
                <span>7shifts is configured in env but no shifts are loaded yet.</span>
                <button type="button" class="auth-btn" id="todayFloorSyncBtn" onclick="syncSevenShiftsFromBoard()">Sync now</button>
              </div>
              <p id="todayFloorSyncNote"></p>
            </div>
          ` : ""}
        </div>
      `;
      return;
    }

    const summary = isToday
      ? `${escapeHTML(dateLabel)} · ${data.onNowCount || 0} on now · ${staffAll.length} scheduled`
      : `${escapeHTML(dateLabel)} · ${staffAll.length} scheduled`;

    if (!staffAll.length) {
      content.innerHTML = `
        <div class="today-floor">
          <div class="today-floor__intro">
            <h2>Today’s Floor</h2>
            <p>No published shifts for ${escapeHTML(dateLabel)}.</p>
          </div>
          ${dayControls}
          ${privileged ? renderTodayFloorAdminBar(data, canSync) : ""}
          ${privileged ? renderTodayFloorCoverageAlerts(data.coverageAlerts) : ""}
          ${renderTodayFloorStationBoard(data.stationBoard, { canAssign, stations, staff: staffAll })}
        </div>
      `;
      return;
    }

    let sections;
    if (isToday) {
      sections = [
        { id: "now", title: "On now", rows: staff.filter(s => s.status === "now") },
        { id: "upcoming", title: "Later today", rows: staff.filter(s => s.status === "upcoming") },
        { id: "done", title: "Already finished", rows: staff.filter(s => s.status === "done") }
      ].filter(section => section.rows.length);
    } else {
      sections = [
        { id: "scheduled", title: "Scheduled", rows: staff }
      ].filter(section => section.rows.length);
    }

    content.innerHTML = `
      <div class="today-floor">
        <div class="today-floor__intro">
          <h2>Today’s Floor</h2>
          <p>${summary}${todayFloorRole !== "all" ? ` · showing ${escapeHTML(todayFloorRole)}` : ""}</p>
        </div>
        ${dayControls}
        ${roleControls}
        ${privileged ? renderTodayFloorAdminBar(data, canSync) : ""}
        ${privileged ? renderTodayFloorCoverageAlerts(data.coverageAlerts) : ""}
        ${renderTodayFloorStationBoard(data.stationBoard, { canAssign, stations, staff: staffAll })}
        ${sections.length ? sections.map(section => `
          <section class="today-floor__section">
            <h3>${escapeHTML(section.title)}</h3>
            <ul class="today-floor__list">
              ${section.rows.map(row => {
                const roleBits = [row.roleName, row.stationName].filter(Boolean).join(" · ");
                const hours = `${formatShiftClock(row.startAt)}–${formatShiftClock(row.endAt)}`;
                const badges = [
                  row.isYou ? "You" : null,
                  row.isShiftLead ? "Lead" : null,
                  isToday && row.status === "now" ? "On now" : null,
                  row.floorStationLabel || null,
                  privileged && row.mapped === false ? "Not in portal" : null
                ].filter(Boolean);
                return `
                  <li class="today-floor__row${row.isYou ? " is-you" : ""}${row.status === "done" ? " is-done" : ""}">
                    <div>
                      <span class="today-floor__name">${escapeHTML(row.name)}</span>
                      ${badges.length ? `<span class="today-floor__badges">${badges.map(b => `<span class="today-floor__badge${b === "Not in portal" ? " is-warn" : ""}">${escapeHTML(b)}</span>`).join("")}</span>` : ""}
                      ${privileged && row.email ? `<a class="today-floor__email" href="mailto:${escapeForAttribute(row.email)}">${escapeHTML(row.email)}</a>` : ""}
                      ${renderTodayFloorAssignControl(row, stations, canAssign)}
                    </div>
                    <div class="today-floor__meta">${escapeHTML(roleBits || "Taproom")}</div>
                    <div class="today-floor__hours">${escapeHTML(hours)}</div>
                  </li>
                `;
              }).join("")}
            </ul>
          </section>
        `).join("") : `<div class="status"><strong>No one in this role for ${escapeHTML(dateLabel)}.</strong></div>`}
      </div>
    `;
  } catch (err) {
    content.innerHTML = `
      <div class="today-floor">
        <div class="today-floor__intro">
          <h2>Today’s Floor</h2>
          <p>${escapeHTML(err.message || "Could not load today’s schedule.")}</p>
        </div>
      </div>
    `;
  }
}

function shouldPromptFromSchedule(flagName, hourFallback) {
  const shift = getShiftContext();
  if (shift?.synced) return Boolean(shift[flagName]);
  return getLocalHour() >= hourFallback;
}

async function refreshShiftContext() {
  if (!currentUser) return null;
  try {
    const data = await apiFetch("/api/shifts/me");
    currentUser.shift = data.shift;
    if (data.shift?.isShiftLeadNow) {
      currentUser.on_shift_lead_duty = true;
      if (typeof StaffRoles?.buildPermissions === "function") {
        currentUser.permissions = StaffRoles.buildPermissions(currentUser, true);
      } else if (currentUser.permissions) {
        currentUser.permissions.viewShiftReports = true;
        currentUser.permissions.onShiftLeadDuty = true;
      }
    }
    renderShiftStatusUI();
    if (typeof refreshHomeIfVisible === "function") refreshHomeIfVisible();
    // Keep shift-lead-only tabs in sync when duty flips mid-session.
    document.querySelectorAll(".tab-shift-lead-only").forEach(el => {
      el.style.display = currentUser && currentUser.permissions?.viewShiftReports ? "" : "none";
    });
    syncMobileTabs();
    return data.shift;
  } catch (err) {
    console.warn("Shift context unavailable:", err.message);
    renderShiftStatusUI();
    return currentUser.shift || null;
  }
}

async function maybePromptShiftSurvey() {
  if (!canSubmitShiftSurvey()) return;
  if (isShiftPromptModalOpen()) return;

  await refreshShiftContext();
  if (!shouldPromptFromSchedule("promptEndOfShift", 15)) return;

  const dateKey = getLocalDateKey();
  if (sessionStorage.getItem(`shift-survey-prompt-${dateKey}`)) return;

  try {
    const status = await apiFetch(`/api/shift-surveys/status?date=${encodeURIComponent(dateKey)}`);
    if (status.submitted) {
      sessionStorage.setItem(`shift-survey-prompt-${dateKey}`, "done");
      return;
    }

    const mins = getShiftContext()?.minutesToEnd;
    const timingNote = mins != null
      ? (mins > 0 ? `Your shift ends in about ${mins} minutes.` : "Your scheduled shift just ended.")
      : "Before you head out, take a minute to tell the shift lead how today went.";

    sessionStorage.setItem(`shift-survey-prompt-${dateKey}`, "shown");
    document.getElementById("shiftDigestContent").innerHTML = `
      <div class="briefing-header">
        <h2 id="shiftDigestTitle">End of shift check-in</h2>
        <p>${escapeHTML(timingNote)} Your feedback is anonymous.</p>
      </div>
      <button type="button" class="game-next briefing-done" onclick="closeShiftDigestModal(); activateAppTab('shift-survey');">Fill out survey</button>
      <button type="button" class="briefing-back" style="margin-top:12px;" onclick="closeShiftDigestModal()">Remind me later</button>
    `;
    document.getElementById("shiftDigestBackdrop").classList.add("show");
    document.body.style.overflow = "hidden";
  } catch (err) {
    console.warn("Shift survey prompt unavailable:", err.message);
  }
}

async function maybePromptClosingChecklist() {
  if (!currentUser) return;
  if (isShiftPromptModalOpen()) return;

  await refreshShiftContext();
  if (!shouldPromptFromSchedule("promptClosingChecklist", 21)) return;

  const dateKey = getLocalDateKey();
  if (sessionStorage.getItem(`shift-checklist-prompt-${dateKey}`)) return;

  const hour = getLocalHour();
  const listId = hour < 18 ? "afternoon-cut" : "closing";
  const title = hour < 18 ? "Afternoon cut checklist" : "Closing checklist";
  const mins = getShiftContext()?.minutesToEnd;
  const timingNote = mins != null && mins <= 90
    ? `Your shift ends soon${mins > 0 ? ` (about ${mins} min)` : ""}.`
    : "Wrap-up time.";

  const alsoSurvey = canSubmitShiftSurvey()
    && shouldPromptFromSchedule("promptEndOfShift", 15)
    && !sessionStorage.getItem(`shift-survey-prompt-${dateKey}`);

  sessionStorage.setItem(`shift-checklist-prompt-${dateKey}`, "shown");
  if (alsoSurvey) sessionStorage.setItem(`shift-survey-prompt-${dateKey}`, "shown");

  document.getElementById("shiftDigestContent").innerHTML = `
    <div class="briefing-header">
      <h2 id="shiftDigestTitle">${escapeHTML(title)}</h2>
      <p>${escapeHTML(timingNote)} Finish your close-out list${alsoSurvey ? ", then leave anonymous shift feedback" : ""}.</p>
    </div>
    <button type="button" class="game-next briefing-done" onclick="closeShiftDigestModal(); checklistId='${listId}'; activateAppTab('checklists');">Open checklist</button>
    ${alsoSurvey ? `<button type="button" class="game-next briefing-done" style="margin-top:10px;" onclick="closeShiftDigestModal(); activateAppTab('shift-survey');">End of shift survey</button>` : ""}
    <button type="button" class="briefing-back" style="margin-top:12px;" onclick="closeShiftDigestModal()">Remind me later</button>
  `;
  document.getElementById("shiftDigestBackdrop").classList.add("show");
  document.body.style.overflow = "hidden";
}

function isShiftPromptModalOpen() {
  return document.getElementById("shiftDigestBackdrop")?.classList.contains("show");
}

async function maybeShowShiftDigest() {
  if (!isShiftLeadManager()) return;
  if (isShiftPromptModalOpen()) return;

  await refreshShiftContext();
  if (!shouldPromptFromSchedule("promptEndOfShift", 21)) return;

  const dateKey = getLocalDateKey();
  if (sessionStorage.getItem(`shift-digest-shown-${dateKey}`)) return;

  try {
    const data = await apiFetch(`/api/shift-surveys/daily?date=${encodeURIComponent(dateKey)}`);
    if (!data.count || data.digestViewed) return;

    sessionStorage.setItem(`shift-digest-shown-${dateKey}`, "1");
    renderShiftDigestModal(data);
    document.getElementById("shiftDigestBackdrop").classList.add("show");
    document.body.style.overflow = "hidden";
    await apiFetch("/api/shift-surveys/digest-viewed", {
      method: "POST",
      body: JSON.stringify({ shiftDate: dateKey })
    });
  } catch (err) {
    console.warn("Shift digest unavailable:", err.message);
  }
}

async function submitSiteFeedback() {
  const errorEl = document.getElementById("siteFeedbackError");
  if (errorEl) errorEl.innerHTML = "";

  const category = document.getElementById("siteFeedbackCategory")?.value || "";
  const pageTab = document.getElementById("siteFeedbackTab")?.value || "";
  const subject = document.getElementById("siteFeedbackSubject")?.value.trim() || "";
  const message = document.getElementById("siteFeedbackMessage")?.value.trim() || "";

  if (!category) {
    if (errorEl) errorEl.innerHTML = `<div class="auth-error">Please choose a feedback category.</div>`;
    return;
  }
  if (!subject) {
    if (errorEl) errorEl.innerHTML = `<div class="auth-error">Please add a subject line.</div>`;
    return;
  }
  if (!message) {
    if (errorEl) errorEl.innerHTML = `<div class="auth-error">Please describe the issue or idea.</div>`;
    return;
  }

  try {
    await apiFetch("/api/site-feedback", {
      method: "POST",
      body: JSON.stringify({ category, pageTab, subject, message })
    });
    render();
  } catch (err) {
    if (errorEl) errorEl.innerHTML = `<div class="auth-error">${escapeHTML(err.message)}</div>`;
  }
}

async function updateSiteFeedbackStatus(id) {
  if (!canManageSiteFeedback()) return;

  const status = document.getElementById(`feedback-status-${id}`)?.value || "open";
  const adminNotes = document.getElementById(`feedback-notes-${id}`)?.value || "";
  const pipelineStatus = document.getElementById(`feedback-pipe-${id}`)?.value || "submitted";

  try {
    await apiFetch(`/api/site-feedback/${id}`, {
      method: "PATCH",
      body: JSON.stringify({ status, adminNotes })
    });
    await apiFetch(`/api/site-feedback/${id}/pipeline`, {
      method: "PATCH",
      body: JSON.stringify({ pipelineStatus })
    });
    render();
  } catch (err) {
    alert(err.message);
  }
}

  if (item.dairy === true) tags.push(`<span class="tag dairy">Dairy</span>`);

function getLocalDateKey() {

}

function getLocalDayKey() {
  return ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"][new Date().getDay()];
}

async function ensureWeeklySpecials({ force = false } = {}) {
  if (weeklySpecialsLoaded && !force) return WEEKLY_SPECIALS;
  if (weeklySpecialsLoading && weeklySpecialsLoadPromise) return weeklySpecialsLoadPromise;

  weeklySpecialsLoading = true;
  weeklySpecialsError = "";
  weeklySpecialsLoadPromise = (async () => {
    try {
      const data = await apiFetch("/api/weekly-specials");
      WEEKLY_SPECIALS = (data.specials || []).length
        ? data.specials
        : DEFAULT_WEEKLY_SPECIALS.map((s) => ({ ...s }));
      COFFEE_SPECIALS = (data.coffeeSpecials || []).length
        ? data.coffeeSpecials
        : DEFAULT_COFFEE_SPECIALS.map((item) => ({ ...item }));
      weeklyBoard = {
        chefNotes: "",
        menuChanges: "",
        eightySixNotes: "",
        waitNotes: "",
        limitedItems: "",
        serviceNotes: "",
        allergenNotes: "",
        contentWeekStart: "",
        deadlineDow: 5,
        deadlineHour: 0,
        updatedAt: null,
        updatedByName: null,
        needsReview: false,
        expectedContentWeekStart: "",
        ...(data.board || {})
      };
      weeklySpecialsCanEdit = Boolean(data.canEdit);
      weeklySpecialsLoaded = true;
      return WEEKLY_SPECIALS;
    } catch (err) {
      weeklySpecialsError = err.message || "Could not load weekly specials.";
      if (!WEEKLY_SPECIALS.length) {
        WEEKLY_SPECIALS = DEFAULT_WEEKLY_SPECIALS.map((s) => ({ ...s }));
      }
      if (!COFFEE_SPECIALS.length) {
        COFFEE_SPECIALS = DEFAULT_COFFEE_SPECIALS.map((item) => ({ ...item }));
      }
      return WEEKLY_SPECIALS;
    } finally {
      weeklySpecialsLoading = false;
      weeklySpecialsLoadPromise = null;
    }
  })();

  return weeklySpecialsLoadPromise;
}

function formatWeeklyUpdatedLabel(iso) {
  if (!iso) return "";
  const raw = String(iso).includes("T") ? iso : `${iso.replace(" ", "T")}Z`;
  const date = new Date(raw);
  if (Number.isNaN(date.getTime())) return String(iso);
  return date.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

function getTodayWeeklySpecial() {
  const today = getLocalDayKey();
  return WEEKLY_SPECIALS.find(special => special.active && special.day === today) || null;

function renderFood(content) {

  const categoryTabs = `

      <button class="coffee-subtab${foodCategory === "all" ? " active" : ""}" onclick="foodCategory='all'; render();">All</button>
      <button class="coffee-subtab${foodCategory === "breakfast" ? " active" : ""}" onclick="foodCategory='breakfast'; render();">Breakfast</button>
      <button class="coffee-subtab${foodCategory === "brunch" ? " active" : ""}" onclick="foodCategory='brunch'; render();">Brunch</button>
      <button class="coffee-subtab${foodCategory === "lunch" ? " active" : ""}" onclick="foodCategory='lunch'; render();">Lunch</button>
      <button class="coffee-subtab${foodCategory === "dinner" ? " active" : ""}" onclick="foodCategory='dinner'; render();">Dinner</button>
      <button class="coffee-subtab${foodCategory === "weekly" ? " active" : ""}" onclick="foodCategory='weekly'; render();">Weekly Specials</button>
    </div>

  if (foodCategory === "weekly") {
    renderWeeklySpecials(content, categoryTabs, query);
    return;
  }

  const filtered = FOOD_MENU.filter(item => {
    const matchesCategory = foodCategory === "all" || item.category === foodCategory;
    const haystack = (item.name + " " + item.section + " " + item.description + " " + (item.notes || "")).toLowerCase();
    const matchesSearch = !query || haystack.includes(query);
    return matchesCategory && matchesSearch;
  });

  const sections = [];
  filtered.forEach(item => {
    if (!sections.includes(item.section)) sections.push(item.section);
  });

  const introCopy = foodCategory === "brunch"
    ? `<p>Brunch is served <strong>Sunday 10 am–3 pm</strong>. Fried food is cooked in beef tallow. Flour tortillas and buns are not gluten-free.</p>`
    : `<p>Breakfast is served Monday–Saturday until 11 am. Brunch is served Sunday 10 am–3 pm. Fried foods are cooked in beef tallow — most fried items are GF. Flour tortillas and buns are not gluten-free.</p>
      <p style="margin-top:8px;font-size:14px;">${escapeHTML(FOOD_SIDE_NOTE)}</p>`;

  content.innerHTML = categoryTabs + `
    <div class="coffee-intro">
      <h2>${foodCategory === "brunch" ? "Brunch Menu" : "Food Menu"}</h2>
      ${introCopy}
    </div>
    ${filtered.length ? sections.map(section => {
      const sectionItems = filtered.filter(item => item.section === section);
      return `
        <div class="coffee-list" style="padding-top:0;">

function formatMerchPrice(item) {
  return `$${item.price}`;
}

function formatMerchMoneyInput(cents) {
  if (cents == null || cents === "") return "";
  const n = Number(cents);
  if (!Number.isFinite(n)) return "";
  return (n / 100).toFixed(n % 100 ? 2 : 0);
}

function merchStatusLabel(status) {
  const value = String(status || "active").toLowerCase();
  if (value === "draft") return "Draft";
  if (value === "archived") return "Archived";
  return "Active";
}

function centsFromMoneyInput(id) {
  const raw = document.getElementById(id)?.value;
  if (raw == null || String(raw).trim() === "") return null;
  const num = Number(raw);
  if (!Number.isFinite(num) || num < 0) return null;
  return Math.round(num * 100);
}

function readMerchFormPayload(prefix) {
  const status = document.getElementById(`${prefix}Status`)?.value || "active";
  return {
    name: document.getElementById(`${prefix}Name`)?.value.trim() || "",
    description: document.getElementById(`${prefix}Desc`)?.value.trim() || "",
    price_cents: centsFromMoneyInput(`${prefix}Price`) ?? 0,
    compare_at_cents: centsFromMoneyInput(`${prefix}CompareAt`),
    cost_cents: centsFromMoneyInput(`${prefix}Cost`),
    sku: document.getElementById(`${prefix}Sku`)?.value.trim() || "",
    barcode: document.getElementById(`${prefix}Barcode`)?.value.trim() || "",
    category: document.getElementById(`${prefix}Category`)?.value.trim() || "",
    product_type: document.getElementById(`${prefix}ProductType`)?.value.trim() || "",
    tags: document.getElementById(`${prefix}Tags`)?.value.trim() || "",
    color: document.getElementById(`${prefix}Color`)?.value.trim() || "",
    vendor: document.getElementById(`${prefix}Vendor`)?.value.trim() || "",
    weight_oz: (() => {
      const raw = document.getElementById(`${prefix}Weight`)?.value;
      if (raw == null || String(raw).trim() === "") return null;
      const n = Number(raw);
      return Number.isFinite(n) && n >= 0 ? n : null;
    })(),
    shop_url: document.getElementById(`${prefix}ShopUrl`)?.value.trim() || "",
    image_url: document.getElementById(`${prefix}ImageUrl`)?.value.trim() || "",
    status,
    taxable: Boolean(document.getElementById(`${prefix}Taxable`)?.checked),
    requires_shipping: Boolean(document.getElementById(`${prefix}Shipping`)?.checked),
    sort_order: Math.round(Number(document.getElementById(`${prefix}Sort`)?.value) || 0)
  };
}

async function loadMerchData(force) {
  if (merchLoading) return;
  if (!force && merchItems.length && merchIdeas.length) return;

  merchLoading = true;
  try {
    const [stockRes, ideasRes] = await Promise.all([
      fetch(`${API_BASE}/api/merch`, { credentials: "include" }),
      fetch(`${API_BASE}/api/merch/ideas`, { credentials: "include" })
    ]);
    const stockData = await stockRes.json();
    const ideasData = await ideasRes.json();
    if (!stockRes.ok) throw new Error(stockData.error || "Could not load merch.");
    if (!ideasRes.ok) throw new Error(ideasData.error || "Could not load ideas.");
    merchItems = stockData.items || [];
    merchIdeas = ideasData.ideas || [];
  } finally {
    merchLoading = false;
  }
}

function readImageInput(inputId, previewId) {
  const input = document.getElementById(inputId);
  const preview = previewId ? document.getElementById(previewId) : null;
  if (!input?.files?.[0]) return Promise.resolve("");
  const file = input.files[0];
  if (file.size > 2 * 1024 * 1024) {
    alert("Image must be under 2 MB.");
    return Promise.resolve("");
  }
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => {
      if (preview) {
        preview.src = reader.result;
        preview.style.display = "block";
      }
      resolve(reader.result);
    };
    reader.readAsDataURL(file);
  });
}

function parseMerchSizesFromForm(prefix) {
  const labels = (document.getElementById(`${prefix}SizeLabels`)?.value || "")
    .split(",")
    .map(v => v.trim())
    .filter(Boolean);
  return labels.map(label => ({
    size_label: label,
    quantity: Math.max(0, Number(document.getElementById(`${prefix}Size_${label}`)?.value) || 0)
  }));
}

function collectMerchEditSizes(itemId) {
  const item = merchItems.find(entry => entry.id === itemId);
  if (!item) return [];
  const sizes = item.sizes.map(size => ({
    size_label: size.size_label,
    quantity: Math.max(0, Number(document.getElementById(`merchQty_${itemId}_${size.id}`)?.value) || 0)
  }));
  const newSizeLabel = document.getElementById(`merchAddSizeLabel_${itemId}`)?.value.trim();
  const newSizeQty = Math.max(0, Number(document.getElementById(`merchAddSizeQty_${itemId}`)?.value) || 0);
  if (newSizeLabel) sizes.push({ size_label: newSizeLabel, quantity: newSizeQty });
  return sizes;
}

async function submitMerchItem() {
  if (!isMerchManager()) return;
  const errorEl = document.getElementById("merchItemError");
  if (errorEl) errorEl.textContent = "";

  try {
    const payload = readMerchFormPayload("merchItem");
    const uploaded = await readImageInput("merchItemImage", "merchItemPreview");
    if (uploaded) payload.image_url = uploaded;
    payload.sizes = parseMerchSizesFromForm("merchItem");

    if (!payload.name) throw new Error("Item name is required.");
    if (payload.price_cents == null) throw new Error("Price is required.");

    await apiFetch("/api/merch", {
      method: "POST",
      body: JSON.stringify(payload)
    });
    merchEditId = null;
    await loadMerchData(true);
    render();
  } catch (err) {
    if (errorEl) errorEl.textContent = err.message;
  }
}

async function saveMerchItem(itemId) {
  if (!isMerchManager()) return;
  const item = merchItems.find(entry => entry.id === itemId);
  if (!item) return;
  const errorEl = document.getElementById(`merchEditError_${itemId}`);
  if (errorEl) errorEl.textContent = "";

  try {
    const payload = readMerchFormPayload(`merchEdit_${itemId}`);
    const uploaded = await readImageInput(`merchImage_${itemId}`, `merchImagePreview_${itemId}`);
    if (uploaded) payload.image_url = uploaded;
    else if (!payload.image_url) payload.image_url = item.image_url || "";
    payload.sizes = collectMerchEditSizes(itemId);
    payload.replace_sizes = true;

    if (!payload.name) throw new Error("Item name is required.");

    await apiFetch(`/api/merch/${itemId}`, {
      method: "PATCH",
      body: JSON.stringify(payload)
    });
    merchEditId = null;
    await loadMerchData(true);
    render();
  } catch (err) {
    if (errorEl) errorEl.textContent = err.message;
    else alert(err.message);
  }
}

function filteredMerchItems(query) {
  return merchItems.filter(item => {
    if (isMerchManager() && merchStatusFilter !== "all" && (item.status || "active") !== merchStatusFilter) {
      return false;
    }
    if (!isMerchManager() && (item.status || "active") !== "active") return false;
    const haystack = [
      item.name,
      item.description,
      item.sku,
      item.category,
      item.product_type,
      item.tags,
      item.color,
      item.vendor,
      item.barcode,
      ...item.sizes.map(s => s.size_label)
    ].join(" ").toLowerCase();
    return !query || haystack.includes(query);
  });
}

const INVENTORY_CATEGORIES = ["Kitchen", "Bar", "Coffee", "Beer", "Paper & Supplies", "Cleaning", "General"];

function inventoryStatusMeta(item) {
  if (item.quantity <= 0 && item.ordered) return { label: "On order", className: "on-order" };
  if (item.quantity <= 0) return { label: "Out", className: "out" };
  if (item.quantity <= 2) return { label: "Low", className: "low" };
  return { label: "In stock", className: "in-stock" };
}

function formatInventoryQuantity(item) {
  const qty = Number(item.quantity);
  const formatted = Number.isInteger(qty) ? qty : qty.toFixed(1);
  return `${formatted} ${item.unit}`;
}

async function loadInventoryData(force) {
  if (inventoryLoading) return;
  if (!force && inventoryItems.length) return;
  inventoryLoading = true;
  try {
    const response = await fetch(`${API_BASE}/api/inventory`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Could not load inventory.");
    inventoryItems = data.items || [];
  } finally {
    inventoryLoading = false;
  }
}

async function loadOpsInventory(force = false) {
  if (opsInventoryBusy) return opsInventory;
  if (!force && opsInventory) return opsInventory;
  opsInventoryBusy = true;
  try {
    const response = await fetch(`${API_BASE}/api/ops-inventory`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Could not load ops inventory.");
    opsInventory = data;
    return opsInventory;
  } finally {
    opsInventoryBusy = false;
  }
}

function applyOpsInventoryPayload(data) {
  if (data?.catalog) opsInventory = data.catalog;
  else if (data?.items) opsInventory = data;
  return opsInventory;
}

async function updateOpsStock(itemId) {
  if (!currentUser) {
    alert("Sign in to update counts.");
    return;
  }
  const el = document.getElementById("opsStock_" + itemId);
  if (!el) return;
  try {
    const data = await apiFetch(`/api/ops-inventory/items/${encodeURIComponent(itemId)}`, {
      method: "PATCH",
      body: JSON.stringify({ inStock: Number(el.value) })
    });
    applyOpsInventoryPayload(data);
    render();
  } catch (err) {
    alert(err.message);
  }
}

async function toggleOpsSectionReady(sectionId, makeReady) {
  if (!currentUser) {
    alert("Sign in to mark sections ready.");
    return;
  }
  try {
    const data = await apiFetch(
      `/api/ops-inventory/sections/${encodeURIComponent(sectionId)}/ready`,
      { method: makeReady ? "POST" : "DELETE" }
    );
    applyOpsInventoryPayload(data);
    render();
  } catch (err) {
    alert(err.message);
  }
}

async function saveOpsWeek() {
  if (!currentUser) {
    alert("Sign in to save a weekly count.");
    return;
  }
  try {
    const data = await apiFetch("/api/ops-inventory/week", {
      method: "POST",
      body: JSON.stringify({ weekLabel: new Date().toISOString().slice(0, 10) })
    });
    applyOpsInventoryPayload(data);
    alert("Weekly count saved. Usage will refine pars over time.");
    render();
  } catch (err) {
    alert(err.message);
  }
}

async function submitOpsOrder() {
  if (!isInventoryManager()) {
    alert("Shift leads and admins submit the e-order.");
    return;
  }
  try {
    const data = await apiFetch("/api/ops-inventory/orders", {
      method: "POST",
      body: JSON.stringify({})
    });
    applyOpsInventoryPayload(data);
    const text = data.order?.shareText || "";
    if (text && navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
    }
    alert(`Order submitted (${data.order?.itemCount || 0} lines, ${data.order?.formatTotalCost || ""}).${text ? " Order text copied." : ""}`);
    render();
  } catch (err) {
    alert(err.message);
  }
}

async function resetOpsInventorySeed() {
  if (!isInventoryManager()) return;
  if (!confirm("Reset ops inventory to the Manhattan catalog seed? Counts and order history will clear.")) return;
  try {
    const data = await apiFetch("/api/ops-inventory/reset-seed", { method: "POST" });
    applyOpsInventoryPayload(data);
    render();
  } catch (err) {
    alert(err.message);
  }
}

function renderOpsCountView(query) {
  const sections = (opsInventory.sections || []).filter((section) => {
    if (opsInventorySection !== "all" && section.id !== opsInventorySection) return false;
    return true;
  });

  return sections.map((section) => {
    const items = (opsInventory.items || []).filter((item) => {
      if (item.sectionId !== section.id) return false;
      if (!query) return true;
      const hay = `${item.name} ${item.vendor} ${item.unit} ${item.sectionName}`.toLowerCase();
      return hay.includes(query);
    });
    if (!items.length && query) return "";

    return `
      <div class="ops-inv-section">
        <div class="ops-inv-section-head">
          <div>
            <h3>${escapeHTML(section.name)}</h3>
            <div class="ops-inv-section-meta">${escapeHTML(section.ownerName)} · ${escapeHTML(section.distributorName)} · lead ${section.leadTimeDays}d · ${section.orderCount} to order</div>

const SOP_CATEGORIES = ["Opening", "Closing", "Bar", "Recipes", "Coffee", "Kitchen", "Floor", "Events", "Emergency", "Safety", "General"];

async function loadSopsData(force) {
  if (sopLoading) return sopDocuments;
  if (!force && sopDocuments.length) return sopDocuments;

  sopLoading = true;
  try {
    const data = await fetch(`${API_BASE}/api/sops`).then(r => r.json());
    sopDocuments = data.documents || [];
    return sopDocuments;
  } finally {
    sopLoading = false;
  }
}

function readSopTextFile(inputId) {
  return new Promise((resolve, reject) => {
    const input = document.getElementById(inputId);
    const file = input?.files?.[0];
    if (!file) return resolve("");
    if (file.size > 500000) return reject(new Error("Text file too large (500 KB max)."));
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(new Error("Could not read file."));
    reader.readAsText(file);
  });
}

function readSopAttachment(inputId) {
  return new Promise((resolve, reject) => {
    const input = document.getElementById(inputId);
    const file = input?.files?.[0];
    if (!file) return resolve(null);
    if (file.size > 4 * 1024 * 1024) return reject(new Error("Attachment too large (4 MB max)."));
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, url: reader.result });
    reader.onerror = () => reject(new Error("Could not read attachment."));
    reader.readAsDataURL(file);
  });
}

function plainTextToSopHtml(text) {
  const trimmed = String(text || "").trim();
  if (!trimmed) return "";
  if (/<[a-z][\s\S]*>/i.test(trimmed)) return trimmed;
  return trimmed
    .split(/\n{2,}/)
    .map(block => `<p>${escapeHTML(block.trim()).replace(/\n/g, "<br>")}</p>`)
    .join("");
}

  render();
  document.getElementById("sopAdminForm")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function submitSopDocument() {
  if (!isAdmin()) return;
  const errorEl = document.getElementById("sopFormError");
  if (errorEl) errorEl.textContent = "";

  const title = document.getElementById("sopTitle")?.value.trim();
  const category = document.getElementById("sopCategoryInput")?.value.trim() || "General";
  const summary = document.getElementById("sopSummary")?.value.trim();
  const body = document.getElementById("sopBody")?.value.trim();
  const sort_order = Number(document.getElementById("sopSortOrder")?.value) || 0;

  if (!title) {
    if (errorEl) errorEl.textContent = "Title is required.";
    return;
  }

  try {
    let attachment_name = "";
    let attachment_url = "";
    const attachment = await readSopAttachment("sopAttachmentUpload");
    if (attachment) {
      attachment_name = attachment.name;
      attachment_url = attachment.url;
    } else if (sopEditId) {
      const existing = sopDocuments.find(doc => doc.id === sopEditId);
      attachment_name = existing?.attachment_name || "";
      attachment_url = existing?.attachment_url || "";
    }

    const payload = {
      title,
      category,
      summary,
      body: body || plainTextToSopHtml(await readSopTextFile("sopFileUpload")),
      sort_order,
      attachment_name,
      attachment_url
    };

    if (!payload.body && !payload.attachment_url) {
      if (errorEl) errorEl.textContent = "Add procedure text or upload a file.";
      return;
    }

    if (sopEditId) {
      await apiFetch(`/api/sops/${sopEditId}`, { method: "PATCH", body: JSON.stringify(payload) });
    } else {
      await apiFetch("/api/sops", { method: "POST", body: JSON.stringify(payload) });
    }

    resetSopForm();
    await loadSopsData(true);
    render();
  } catch (err) {
    if (errorEl) errorEl.textContent = err.message;
  }
}

async function deleteSopDocument(id) {
  if (!isAdmin()) return;
  const doc = sopDocuments.find(entry => entry.id === id);
  if (!doc) return;
  if (!confirm(`Remove "${doc.title}" from the SOP library?`)) return;

  try {
    await apiFetch(`/api/sops/${id}`, { method: "DELETE" });
    if (sopEditId === id) resetSopForm();
    await loadSopsData(true);
    render();
  } catch (err) {
    alert(err.message);
  }
}

function renderReviewStars(rating) {
  const stars = Math.round(Number(rating) || 0);
  if (!stars) return "—";
  return "★".repeat(stars) + "☆".repeat(5 - stars);
}

function formatReviewDate(value) {
  if (!value) return "Recent";
  const date = new Date(String(value).includes("T") ? value : `${value}T12:00:00`);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

async function loadReviewsData(force) {
  if (reviewsLoading) return reviewsData;
  if (!force && reviewsData) return reviewsData;

  reviewsLoading = true;
  try {
    reviewsData = await fetch(`${API_BASE}/api/reviews`).then(r => r.json().then(data => {
      if (!r.ok) throw new Error(data.error || "Could not load reviews.");
      return data;
    }));
    return reviewsData;
  } finally {
    reviewsLoading = false;
  }
}

async function refreshReviewsFromServer() {
  if (!canRefreshReviews()) return;

    reviewsData = data;
    render();
  } catch (err) {
    alert(err.message);
  }
}

function renderReviewCards(reviews, sources, query) {
  const sourceMap = Object.fromEntries((sources || []).map(source => [source.id, source.name]));
  const filtered = (reviews || []).filter(review => {
    const matchesPlatform = reviewPlatform === "all" || review.sourceId === reviewPlatform;
    const haystack = (review.text + " " + review.author + " " + (sourceMap[review.sourceId] || "")).toLowerCase();
    const matchesSearch = !query || haystack.includes(query);
    return matchesPlatform && matchesSearch;
  });

  const platformTabs = ["all", ...(sources || []).map(source => source.id)].map(key => {
    const label = key === "all" ? "All platforms" : (sourceMap[key] || key);
    return `<button type="button" class="inventory-filter-btn${reviewPlatform === key ? " active" : ""}" onclick="reviewPlatform='${escapeForAttribute(key)}'; render();">${escapeHTML(label)}</button>`;
  }).join("");

  return `
    <div class="inventory-filter-row">${platformTabs}</div>
    <div class="coffee-intro" style="padding-top:0;">
      <h2>Recent reviews</h2>
      <p>Latest guest comments pulled from our public profiles — use these talking points to know what guests love and where we can improve.</p>
    </div>
    ${filtered.length ? `<div class="review-list">${filtered.map(review => `
      <div class="review-card">
        <div class="review-card-top">
          <div>
            <span class="review-source-tag">${escapeHTML(sourceMap[review.sourceId] || review.sourceId)}</span>
            <span class="review-meta"> · ${escapeHTML(review.author || "Guest")} · ${escapeHTML(formatReviewDate(review.reviewDate))}</span>
          </div>
          <span class="review-stars" aria-label="${review.rating || 0} out of 5">${renderReviewStars(review.rating)}</span>
        </div>
        <p class="review-text">${escapeHTML(review.text)}</p>
      </div>
    `).join("")}</div>` : `<div class="status"><strong>No reviews match.</strong> Try another platform or search term.</div>`}
  `;
}

function startCoffeeQuiz() {
  coffeeMode = "quiz";
  const total = Math.min(GAME_ROUNDS.coffeeQuiz, COFFEE_QUIZ.length);
  coffeeSession = {
    queue: shuffle(COFFEE_QUIZ).slice(0, total),
    index: 0,
    right: 0,
    mistakes: [],
    complete: false,
    recorded: false
  };
  coffeeQuizItem = null;
  prepareCoffeeQuizQuestion();
  render();
}

function prepareCoffeeQuizQuestion() {
  if (!coffeeSession || coffeeSession.complete) return;
  const item = coffeeSession.queue[coffeeSession.index];
  coffeeQuizItem = {
    question: item.q,
    correct: item.a,
    options: shuffle([item.a, ...item.w.slice(0, 3)]),
    answered: false
  };
}

function renderCoffeeQuizInner() {
  if (!coffeeSession) {
    return `<div class="game-card"><button class="game-next" style="margin-top:0;" onclick="startCoffeeQuiz()">Start quiz</button></div>`;
  }
  if (coffeeSession.complete) {
    const total = coffeeSession.queue.length;
    const pct = Math.round((coffeeSession.right / total) * 100);
    return `
      <div class="game-card">
        <p class="game-question" style="font-size:20px;font-weight:750;">Quiz complete!</p>
        <p style="font-size:15px;color:#555;margin:0;">You got <strong>${coffeeSession.right}</strong> out of <strong>${total}</strong> correct (${pct}%)</p>
        <button class="game-next" onclick="startCoffeeQuiz()">Play Again</button>
      </div>
      ${renderAnswerReview(coffeeSession)}
    `;
  }
  if (!coffeeQuizItem) prepareCoffeeQuizQuestion();

  return `
    <div class="game-card">
      <p class="game-question">${escapeHTML(coffeeQuizItem.question)}</p>
      <div class="game-options">
        ${coffeeQuizItem.options.map(o => {
          let cls = "game-option";
          if (coffeeQuizItem.answered) {
            cls += " disabled";
            if (o === coffeeQuizItem.correct) cls += " correct";
            else if (o === coffeeQuizItem.selected) cls += " wrong";
          }
          return `<div class="${cls}" onclick="answerCoffeeQuiz('${escapeForAttribute(o)}')">${escapeHTML(o)}</div>`;
        }).join("")}
      </div>
    </div>
    <div class="game-score">Question ${coffeeSession.index + 1} of ${coffeeSession.queue.length} · Score: ${coffeeSession.right} / ${coffeeSession.index}</div>
  `;
}

function answerCoffeeQuiz(answer) {
  if (!coffeeQuizItem || coffeeQuizItem.answered) return;
  coffeeQuizItem.answered = true;
  coffeeQuizItem.selected = answer;
  const correct = answer === coffeeQuizItem.correct;
  if (!correct) {
    recordWrongAnswer(
      coffeeSession,
      coffeeQuizItem.question,
      answer,
      coffeeQuizItem.correct
    );
  }
  setTimeout(() => {
    if (correct) coffeeSession.right++;
    coffeeSession.index++;
    if (coffeeSession.index >= coffeeSession.queue.length) {
      coffeeSession.complete = true;
      if (markSessionRecorded(coffeeSession)) {
        recordProgress("coffee_quiz", "coffee", coffeeSession.right, coffeeSession.queue.length);
      }
    } else {
      prepareCoffeeQuizQuestion();
    }
    render();
  }, 450);
  render();
}

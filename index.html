<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhattan Project | Staff Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  :root {
    --black: #09090b;
    --charcoal: #18181b;
    --cream: #f4f5f7;
    --paper: #ffffff;
    --muted: #71717a;
    --line: rgba(9, 9, 11, 0.08);
    --line-strong: rgba(9, 9, 11, 0.14);
    --green: #ecfdf3;
    --green-text: #15803d;
    --accent: #a67c52;
    --accent-light: #faf6f1;
    --accent-glow: rgba(166, 124, 82, 0.15);
    --shadow-sm: 0 1px 2px rgba(9, 9, 11, 0.04);
    --shadow-md: 0 8px 24px rgba(9, 9, 11, 0.06), 0 2px 6px rgba(9, 9, 11, 0.03);
    --shadow-lg: 0 20px 48px rgba(9, 9, 11, 0.1);
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-xl: 24px;
    --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font);
    margin: 0;
    background: var(--cream);
    background-image:
      radial-gradient(ellipse 90% 60% at 0% -20%, rgba(166, 124, 82, 0.09), transparent 55%),
      radial-gradient(ellipse 70% 50% at 100% 0%, rgba(9, 9, 11, 0.04), transparent 50%);
    color: var(--black);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.55;
  }

  /* ── Top bar ── */
  .site-header {
    background: rgba(9, 9, 11, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    position: sticky;
    top: 0;
    z-index: 30;
  }

  .header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    max-width: 1080px;
    margin: 0 auto;
    padding: 14px 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.04) 100%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-mark svg { display: block; }

  .brand-text h1 {
    font-size: 14px;
    font-weight: 700;
    margin: 0;
    color: #fff;
    letter-spacing: 0.04em;
  }

  .brand-text p {
    font-size: 10px;
    font-weight: 500;
    margin: 1px 0 0;
    color: rgba(255, 255, 255, 0.42);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  /* ── Sticky toolbar ── */
  .toolbar {
    position: sticky;
    top: 67px;
    z-index: 25;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 4px 20px rgba(9, 9, 11, 0.03);
  }

  .toolbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .tabs {
    display: flex;
    gap: 3px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px;
    background: #eef0f4;
    border-radius: var(--radius-md);
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    padding: 9px 15px;
    border-radius: 10px;
    border: none;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    color: var(--muted);
    background: transparent;
    transition: color 0.2s var(--ease), background 0.2s var(--ease), box-shadow 0.2s var(--ease), transform 0.15s var(--ease);
  }

  .tab:hover { color: var(--black); }

  .tab.active {
    background: var(--paper);
    color: var(--black);
    box-shadow: var(--shadow-sm);
  }

  .tab:active { transform: scale(0.97); }

  .search-wrap {
    position: relative;
    width: 100%;
    max-width: 280px;
    flex-shrink: 0;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.45;
    pointer-events: none;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 11px 14px 11px 42px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-md);
    font-family: var(--font);
    font-size: 14px;
    background: var(--paper);
    color: var(--black);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: var(--shadow-sm);
  }

  .auth-panel input {
    padding: 12px 14px;
    margin-bottom: 14px;
  }

  input::placeholder { color: #a1a1aa; }

  input:focus {
    border-color: rgba(9, 9, 11, 0.22);
    box-shadow: 0 0 0 4px rgba(9, 9, 11, 0.06);
  }

  .auth-panel input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }

  .filter-wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 12px;
  }

  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .filters::-webkit-scrollbar { display: none; }

  .filter-btn {
    border: 1px solid var(--line-strong);
    background: var(--paper);
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s var(--ease);
  }

  .filter-btn:hover {
    color: var(--black);
    border-color: rgba(9, 9, 11, 0.18);
    transform: translateY(-1px);
  }

  .filter-btn.active {
    background: var(--black);
    border-color: var(--black);
    color: #fff;
    box-shadow: 0 4px 12px rgba(9, 9, 11, 0.18);
  }

  /* ── Auth ── */
  .auth-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .auth-btn {
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.04);
    color: rgba(255, 255, 255, 0.9);
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }

  .auth-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.22);
  }

  .auth-btn:active { transform: scale(0.97); }

  .auth-btn.primary {
    background: #fff;
    color: var(--black);
    border-color: #fff;
  }

  .auth-btn.primary:hover { background: #f4f4f5; }

  .auth-user {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.48);
    text-align: right;
    line-height: 1.4;
  }

  .auth-user strong {
    display: block;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
  }

  /* ── Layout ── */
  .app-main {
    min-height: calc(100vh - 180px);
    padding-bottom: 40px;
  }

  #content.is-entering {
    animation: contentEnter 0.45s var(--ease) both;
  }

  @keyframes contentEnter {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .status {
    text-align: center;
    padding: 80px 24px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
  }

  .status strong {
    display: block;
    color: var(--black);
    margin-bottom: 8px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* ── Cards ── */
  .list {
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 1080px;
    margin: 0 auto;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    cursor: pointer;
    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s;
    box-shadow: var(--shadow-sm);
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--line-strong);
    box-shadow: var(--shadow-md);
  }

  .tap-layout {
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 16px;
    align-items: start;
  }

  .tap-number {
    width: 56px;
    min-height: 56px;
    border-radius: var(--radius-md);
    background: linear-gradient(145deg, #18181b 0%, #09090b 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    box-shadow: 0 4px 12px rgba(9, 9, 11, 0.2);
  }

  .tap-number small {
    font-size: 8px;
    letter-spacing: 0.14em;
    color: rgba(255, 255, 255, 0.45);
    font-weight: 600;
    margin-bottom: 3px;
    text-transform: uppercase;
  }

  .tap-number strong {
    font-size: 22px;
    font-weight: 700;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .name {
    font-weight: 700;
    font-size: 16px;
    margin: 0 0 5px;
    letter-spacing: -0.02em;
    color: var(--black);
  }

  .desc {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
    line-height: 1.6;
  }

  .abv {
    font-size: 11px;
    font-weight: 700;
    background: var(--black);
    color: #fff;
    padding: 6px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .tags {
    display: flex;
    gap: 6px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 10.5px;
    font-weight: 600;
    background: var(--accent-light);
    color: var(--accent);
    padding: 5px 10px;
    border-radius: 999px;
  }

  .tag.gf { background: var(--green); color: var(--green-text); }
  .tag.new { background: var(--black); color: #fff; }

  .details-hint {
    font-size: 11px;
    color: #a1a1aa;
    margin-top: 12px;
    font-weight: 500;
  }

  .new-banner {
    margin: 20px 24px 0;
    max-width: 1032px;
    margin-left: auto;
    margin-right: auto;
    background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
    border-radius: var(--radius-lg);
    padding: 24px;
    color: #fff;
    box-shadow: var(--shadow-md);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  .new-banner-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: rgba(255, 255, 255, 0.45);
    margin: 0 0 8px;
    text-transform: uppercase;
  }

  .new-banner-name {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }

  .new-banner-desc {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.58);
    margin: 0;
    line-height: 1.55;
  }

  .new-banner-dots {
    display: flex;
    gap: 6px;
    margin-top: 16px;
  }

  .new-banner-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    transition: background 0.2s, transform 0.2s;
    cursor: pointer;
  }

  .new-banner-dot.active {
    background: #fff;
    transform: scale(1.15);
  }

  /* ── Games ── */
  .game-card, .flash-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-xl);
    padding: 36px 28px;
    margin: 20px 24px;
    max-width: 1032px;
    margin-left: auto;
    margin-right: auto;
    text-align: center;
    box-shadow: var(--shadow-md);
  }

  .game-question {
    font-size: 16px;
    color: var(--black);
    margin-bottom: 28px;
    line-height: 1.65;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .game-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .game-option {
    padding: 15px 18px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-md);
    background: var(--paper);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }

  .game-option:hover:not(.correct):not(.wrong):not(.disabled) {
    border-color: rgba(9, 9, 11, 0.18);
    background: #fafafa;
    transform: translateX(4px);
  }

  .game-option.correct { background: var(--green); border-color: var(--green-text); color: var(--green-text); }
  .game-option.wrong { background: #fef2f2; border-color: #ef4444; color: #dc2626; }

  .game-next,
  .auth-panel .game-next {
    margin-top: 24px;
    padding: 13px 26px;
    background: var(--black);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 14px rgba(9, 9, 11, 0.2);
  }

  .game-next:hover {
    background: #27272a;
    box-shadow: 0 6px 20px rgba(9, 9, 11, 0.24);
  }

  .game-next:active { transform: scale(0.98); }

  .game-score, .flash-count {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin: 14px 24px 0;
    font-weight: 600;
  }

  .flash-card {
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: pointer;
  }

  .flash-nav {
    display: flex;
    justify-content: space-between;
    padding: 0 24px;
    margin-top: 14px;
    max-width: 1080px;
    margin-left: auto;
    margin-right: auto;
  }

  .flash-nav button,
  .game-back {
    padding: 10px 16px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--paper);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.2s var(--ease);
    box-shadow: var(--shadow-sm);
  }

  .flash-nav button:hover,
  .game-back:hover {
    color: var(--black);
    border-color: rgba(9, 9, 11, 0.18);
    transform: translateY(-1px);
  }

  .game-back {
    display: inline-flex;
    align-items: center;
    margin: 20px 24px 0;
    max-width: 1080px;
  }

  .game-hub {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 20px 24px;
    max-width: 1080px;
    margin: 0 auto;
  }

  .game-tile {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 20px 18px;
    cursor: pointer;
    text-align: left;
    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }

  .game-tile::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent-glow) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.25s;
  }

  .game-tile:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
  }

  .game-tile:hover::before { opacity: 1; }

  .game-tile-icon {
    font-size: 22px;
    margin-bottom: 12px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f4f4f5 0%, #e4e4e7 100%);
    border-radius: var(--radius-sm);
    position: relative;
    z-index: 1;
  }

  .game-tile-title {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 5px;
    color: var(--black);
    position: relative;
    z-index: 1;
    letter-spacing: -0.01em;
  }

  .game-tile-desc {
    font-size: 12px;
    color: var(--muted);
    margin: 0;
    line-height: 1.5;
    position: relative;
    z-index: 1;
  }

  .speed-header {
    margin: 20px 24px 0;
    max-width: 1032px;
    margin-left: auto;
    margin-right: auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
  }

  .speed-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .speed-bar-track {
    height: 6px;
    background: #e4e4e7;
    border-radius: 999px;
    overflow: hidden;
  }

  .speed-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #27272a, #09090b);
    border-radius: 999px;
    transition: width 0.3s linear;
  }

  .speed-bar-fill.urgent { background: linear-gradient(90deg, #ef4444, #dc2626); }

  .game-option.disabled {
    pointer-events: none;
    opacity: 0.65;
  }

  .streak-badge {
    display: inline-block;
    background: var(--green);
    color: var(--green-text);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    margin-left: 6px;
  }

  /* ── Sections ── */
  .coffee-intro {
    margin: 0 auto;
    padding: 32px 24px 24px;
    max-width: 1080px;
    border-bottom: none;
  }

  .coffee-intro h2 {
    margin: 0 0 8px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--black);
    line-height: 1.2;
  }

  .coffee-intro p {
    margin: 0;
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 540px;
  }

  .coffee-subtabs,
  .coffee-filters {
    display: flex;
    gap: 8px;
    padding: 0 24px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 1080px;
    margin: 0 auto;
  }

  .coffee-subtabs::-webkit-scrollbar,
  .coffee-filters::-webkit-scrollbar { display: none; }

  .coffee-subtab {
    padding: 8px 15px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--paper);
    font-family: var(--font);
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.2s var(--ease);
  }

  .coffee-subtab.active {
    background: var(--black);
    border-color: var(--black);
    color: #fff;
    box-shadow: 0 4px 12px rgba(9, 9, 11, 0.15);
  }

  .coffee-list {
    padding: 0 24px 20px;
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .coffee-section-num {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin: 0 0 6px;
    text-transform: uppercase;
  }

  .coffee-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--accent-light);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .manual-body {
    font-size: 15px;
    line-height: 1.75;
    color: #3f3f46;
  }

  .manual-body p { margin: 0 0 16px; }

  .manual-body ul {
    margin: 0 0 18px;
    padding-left: 22px;
  }

  .manual-body li { margin-bottom: 8px; }

  .manual-body table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    margin: 0 0 18px;
    font-size: 13px;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
  }

  .manual-body th,
  .manual-body td {
    border-bottom: 1px solid var(--line);
    padding: 12px 14px;
    text-align: left;
    vertical-align: top;
  }

    body: `<p>Coffee quality is shaped long before the barista touches the grinder. What ends up in the cup is the result of a chain of decisions: where the coffee was grown, how it was processed, how it was roasted, and how it was brewed.</p>
<div class="manual-callout"><strong>Core mindset:</strong> A barista is not just following recipes. A barista is reading the coffee, controlling variables, and chasing balance — with sweetness as the clearest sign that extraction is in a good place.</div>
<p><strong>The farm-to-cup framework:</strong></p>
<ul>
<li><strong>Origin</strong> determines raw potential: acidity, sweetness, body, and aromatics.</li>

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];

    if (inQuotes) {
      if (c === '"' && next === '"') {
        field += '"';
        i++;
      } else if (c === '"') {
        inQuotes = false;
      } else {
        field += c;
      }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") {
        row.push(field);
        field = "";
      } else if (c === "\n" || c === "\r") {
        if (field !== "" || row.length) {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        }
      } else {
        field += c;
      }
    }
  }

  if (field !== "" || row.length) {
    row.push(field);
    rows.push(row);
  }

  if (!rows.length) return [];

  const headers = rows[0].map(h => h.trim());

  return rows.slice(1).filter(r => r.length > 1).map(r => {
    const obj = {};
    headers.forEach((h, i) => {
      obj[h] = (r[i] || "").trim();
    });
    return obj;
  });
}

async function loadData() {
  const content = document.getElementById("content");

  try {
    const beerResponse = await fetch(BEER_CSV_URL, { cache: "no-store" });

    if (!beerResponse.ok) {
      throw new Error("Beer spreadsheet returned " + beerResponse.status);
    }

    const beerText = await beerResponse.text();
    beers = parseCSV(beerText).filter(b =>
      b.Name &&
      b.Name.trim() !== "" &&
      b.Name.trim() !== "?"
    );

    if (FOOD_CSV_URL !== "PASTE_YOUR_FOOD_CSV_LINK_HERE") {
      try {
        const foodResponse = await fetch(FOOD_CSV_URL, { cache: "no-store" });
        if (foodResponse.ok) {
          foods = parseCSV(await foodResponse.text());
        }
      } catch (foodError) {
        console.warn("Food data could not be loaded:", foodError);
      }
    }

    render();
    startNewTapRotation();
    updateSearchPlaceholder();
  } catch (error) {
    console.error(error);
    content.innerHTML = `
      <div class="status">
        <strong>The beer list could not be loaded.</strong>
        Make sure the Google Sheet is still published to the web, then refresh the page.
      </div>
    `;
  }

    getStyle(item),
    getFlavorProfile(item),
    getDescription(item),
    getGuestGuidance(item)
  ].join(" ").toLowerCase();
}

function matchesFilter(item) {

  return true;
}

function shuffle(arr) {
  const a = arr.slice();

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}

  const showSearch = activeType === "beer" || activeType === "food" || activeType === "ontap" || activeType === "coffee";

  filterWrap.style.display = showFilters ? "block" : "none";
  if (searchWrap) searchWrap.style.display = showSearch ? "" : "none";

  if (activeType === "beer" || activeType === "food" || activeType === "ontap") {
    destroyCharts();
    renderList(content);
  } else if (activeType === "coffee") {
    destroyCharts();
    renderCoffee(content);
  } else if (activeType === "games") {
    destroyCharts();
    renderGames(content);
  } else if (activeType === "progress") {
    renderMyProgress(content);
  } else if (activeType === "team") {
    renderTeamDashboard(content);
  }

  content.classList.remove("is-entering");
  requestAnimationFrame(() => content.classList.add("is-entering"));
}

const ACTIVITY_LABELS = {
  quiz: "Flavor Quiz",
  practice: "Guest Match",
  tap: "Tap Match",
  abv: "ABV Challenge",
  style: "Style Match",
  reverse: "Pick the Profile",
  speed: "Speed Round",
  flash: "Beer Flashcards",
  coffee_quiz: "Coffee Quiz",
  coffee_flash: "Coffee Flashcards"
};

async function apiFetch(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (authToken) headers.Authorization = `Bearer ${authToken}`;

  const response = await fetch(`${API_BASE}${path}`, { ...options, headers });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "Request failed.");
  return data;
}

function updateAuthUI() {
  const authBar = document.getElementById("authBar");
  document.querySelectorAll(".tab-auth-only").forEach(el => {
    el.style.display = currentUser ? "" : "none";
  });
  document.querySelectorAll(".tab-admin-only").forEach(el => {
    el.style.display = currentUser && currentUser.role === "admin" ? "" : "none";
  });

  if (!currentUser) {
    authBar.innerHTML = `
      <button class="auth-btn" onclick="openAuthModal('login')">Log in</button>
      <button class="auth-btn primary" onclick="openAuthModal('register')">Sign up</button>
    `;
    return;
  }

  authBar.innerHTML = `
    <div class="auth-user">
      <strong>${escapeHTML(currentUser.name)}</strong>
      ${currentUser.role === "admin" ? "Admin" : "Employee"}
    </div>
    <button class="auth-btn" onclick="logout()">Log out</button>
  `;
}

async function initAuth() {
  if (!authToken) {
    updateAuthUI();
    return;
  }
  try {
    const data = await apiFetch("/api/auth/me");
    currentUser = data.user;
    updateAuthUI();
  } catch {
    authToken = "";
    localStorage.removeItem("mp_auth_token");
    currentUser = null;
    updateAuthUI();
  }
}

function openAuthModal(mode) {
  authMode = mode;
  renderAuthModal();
  document.getElementById("authBackdrop").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeAuthModal(event) {
  if (event && event.target !== document.getElementById("authBackdrop")) return;
  document.getElementById("authBackdrop").classList.remove("show");
  document.body.style.overflow = "";
}

function renderAuthModal() {
  const isRegister = authMode === "register";
  document.getElementById("authContent").innerHTML = `
    <div class="auth-panel" style="margin:0;padding:0;border:none;background:transparent;">
      <h3>${isRegister ? "Create employee account" : "Log in"}</h3>
      <p class="hint">${isRegister
        ? "Staff sign up here to track training progress. The first account becomes admin. Managers can also register with the admin setup key."
        : "Log in to save your quiz scores and track training progress."}</p>
      <div id="authError"></div>
      <label for="authName">Full name</label>
      <input id="authName" type="text" placeholder="Your name" ${isRegister ? "" : "style='display:none'"}>
      <label for="authEmail">Email</label>
      <input id="authEmail" type="email" placeholder="you@example.com">
      <label for="authPassword">Password</label>
      <input id="authPassword" type="password" placeholder="At least 6 characters">
      ${isRegister ? `
        <label for="authAdminKey">Admin setup key (optional)</label>
        <input id="authAdminKey" type="password" placeholder="Only for manager/admin accounts">
      ` : ""}
      <button class="game-next" style="width:100%;" onclick="submitAuth()">${isRegister ? "Create account" : "Log in"}</button>
      <p class="hint" style="margin-top:14px;text-align:center;">
        ${isRegister
          ? `Already have an account? <a href="#" onclick="openAuthModal('login'); return false;">Log in</a>`
          : `Need an account? <a href="#" onclick="openAuthModal('register'); return false;">Sign up</a>`}
      </p>
    </div>
  `;
}

async function submitAuth() {
  const errorEl = document.getElementById("authError");
  errorEl.innerHTML = "";

  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;

  try {
    let data;
    if (authMode === "register") {
      const name = document.getElementById("authName").value.trim();
      const adminKey = document.getElementById("authAdminKey")?.value || "";
      data = await apiFetch("/api/auth/register", {
        method: "POST",
        body: JSON.stringify({ name, email, password, adminKey })
      });
    } else {
      data = await apiFetch("/api/auth/login", {
        method: "POST",
        body: JSON.stringify({ email, password })
      });
    }

    authToken = data.token;
    localStorage.setItem("mp_auth_token", authToken);
    currentUser = data.user;
    updateAuthUI();
    closeAuthModal();
    if (activeType === "progress" || activeType === "team") render();
  } catch (err) {
    errorEl.innerHTML = `<div class="auth-error">${escapeHTML(err.message)}</div>`;
  }
}

function logout() {
  authToken = "";
  currentUser = null;
  myProgressData = null;
  teamData = null;
  teamDetailId = null;
  localStorage.removeItem("mp_auth_token");
  updateAuthUI();
  if (activeType === "progress" || activeType === "team") {
    activeType = "ontap";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.type === "ontap"));
  }
  render();
}

async function recordProgress(activityType, category, score, total) {
  if (!currentUser) return;
  try {
    await apiFetch("/api/progress", {
      method: "POST",
      body: JSON.stringify({ activity_type: activityType, category, score, total })
    });
    myProgressData = null;
    teamData = null;
  } catch (err) {
    console.warn("Could not save progress:", err.message);
  }
}

function formatActivityLabel(type, category) {
  const label = ACTIVITY_LABELS[type] || type;
  return category === "coffee" ? label : label;
}

function formatDate(value) {
  if (!value) return "—";
  return new Date(value + "Z").toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

function renderRecommendationCard(rec, compact) {
  if (!rec) return "";
  if (compact) {
    return `<div class="rec-snippet"><strong>Next:</strong> ${escapeHTML(rec.title)} — ${escapeHTML(rec.message)}</div>`;
  }
  return `
    <div class="rec-card kind-${escapeHTML(rec.kind || "missing")}">
      <p class="rec-title">${escapeHTML(rec.title)}</p>
      <p class="rec-message">${escapeHTML(rec.message)}</p>
      ${rec.action ? `<span class="rec-action">Assign: ${escapeHTML(rec.action)}</span>` : ""}
    </div>
  `;
}

function renderRecommendationsList(recommendations) {
  if (!recommendations || !recommendations.length) {
    return `<div class="status"><strong>On track.</strong>No immediate training gaps detected.</div>`;
  }
  return `
    <div class="coffee-intro" style="margin-bottom:0;">
      <h2>Suggested next steps</h2>
      <p>Based on completed games, accuracy, and training gaps.</p>
    </div>
    <div class="rec-list">
      ${recommendations.map(rec => renderRecommendationCard(rec)).join("")}
    </div>
  `;
}

let activeCharts = [];

const CHART_THEME = {
  black: "#09090b",
  brown: "#a67c52",
  green: "#15803d",
  amber: "#f59e0b",
  red: "#ef4444",
  grid: "rgba(9,9,11,0.08)",
  fill: "rgba(9,9,11,0.05)"
};

function destroyCharts() {
  activeCharts.forEach(chart => chart.destroy());
  activeCharts = [];
}

function baseChartOptions(extra = {}) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: CHART_THEME.black,
        padding: 10,
        cornerRadius: 8
      }
    },
    ...extra
  };
}

function addChart(canvasId, config) {
  if (typeof Chart === "undefined") return null;
  const canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  const chart = new Chart(canvas, config);
  activeCharts.push(chart);
  return chart;
}

function chartCard(id, title, subtitle, wide) {
  return `
    <div class="chart-card${wide ? " wide" : ""}">
      <p class="chart-title">${escapeHTML(title)}</p>
      ${subtitle ? `<p class="chart-sub">${escapeHTML(subtitle)}</p>` : ""}
      <div class="chart-wrap" style="height:${wide ? 240 : 200}px">
        <canvas id="${id}"></canvas>
      </div>
    </div>
  `;
}

function accuracyColor(value) {
  if (value >= 75) return CHART_THEME.green;
  if (value >= 60) return CHART_THEME.amber;
  return CHART_THEME.red;
}

function renderProgressChartsHtml(prefix) {
  return `
    <div class="chart-grid">
      ${chartCard(`${prefix}-activity`, "Accuracy by activity", "Goal: 75%+ on floor-critical games")}
      ${chartCard(`${prefix}-category`, "Beer vs coffee", "Share of training sessions")}
      ${chartCard(`${prefix}-trend`, "Session scores over time", "Most recent sessions, oldest → newest", true)}
    </div>
  `;
}

function renderTeamChartsHtml() {
  return `
    <div class="chart-grid">
      ${chartCard("team-accuracy", "Team accuracy", "Overall % correct across all sessions")}
      ${chartCard("team-sessions", "Sessions completed", "Total training rounds logged")}
      ${chartCard("team-avg-activity", "Average accuracy by game", "Combined team performance per activity type", true)}
    </div>
  `;
}

function initProgressCharts(stats, prefix) {
  destroyCharts();

  if (stats.by_activity.length) {
    addChart(`${prefix}-activity`, {
      type: "bar",
      data: {
        labels: stats.by_activity.map(r => formatActivityLabel(r.activity_type, r.category)),
        datasets: [{
          data: stats.by_activity.map(r => r.accuracy),
          backgroundColor: stats.by_activity.map(r => accuracyColor(r.accuracy)),
          borderRadius: 6,
          maxBarThickness: 36
        }]
      },
      options: baseChartOptions({
        scales: {
          y: {
            min: 0,
            max: 100,
            grid: { color: CHART_THEME.grid },
            ticks: { callback: v => v + "%", font: { size: 11 } }
          },
          x: {
            grid: { display: false },
            ticks: { maxRotation: 45, minRotation: 45, font: { size: 10 } }
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ctx.parsed.y + "% accuracy" } }
        }
      })
    });

    const beerSessions = stats.by_activity.filter(r => r.category === "beer").reduce((n, r) => n + r.attempts, 0);
    const coffeeSessions = stats.by_activity.filter(r => r.category === "coffee").reduce((n, r) => n + r.attempts, 0);

    if (beerSessions + coffeeSessions > 0) {
      addChart(`${prefix}-category`, {
        type: "doughnut",
        data: {
          labels: ["Beer training", "Coffee training"],
          datasets: [{
            data: [beerSessions, coffeeSessions],
            backgroundColor: [CHART_THEME.black, CHART_THEME.brown],
            borderWidth: 0
          }]
        },
        options: baseChartOptions({
          cutout: "62%",
          plugins: {
            legend: {
              display: true,
              position: "bottom",
              labels: { boxWidth: 10, font: { size: 11 } }
            }
          }
        })
      });
    }
  }

  if (stats.recent.length) {
    const chronological = [...stats.recent].reverse();
    addChart(`${prefix}-trend`, {
      type: "line",
      data: {
        labels: chronological.map((r, i) => {
          const label = formatActivityLabel(r.activity_type, r.category);
          return label.length > 12 ? label.slice(0, 11) + "…" : label;
        }),
        datasets: [{
          label: "Score %",
          data: chronological.map(r => Math.round((r.score / r.total) * 100)),
          borderColor: CHART_THEME.black,
          backgroundColor: CHART_THEME.fill,
          fill: true,
          tension: 0.35,
          pointBackgroundColor: CHART_THEME.black,
          pointRadius: 4
        }]
      },
      options: baseChartOptions({
        scales: {
          y: {
            min: 0,
            max: 100,
            grid: { color: CHART_THEME.grid },
            ticks: { callback: v => v + "%", font: { size: 11 } }
          },
          x: { grid: { display: false }, ticks: { font: { size: 10 } } }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              afterLabel(ctx) {
                const row = chronological[ctx.dataIndex];
                return `${row.score} / ${row.total} correct`;
              }
            }
          }
        }
      })
    });
  }
}

  destroyCharts();
  const staff = employees.filter(e => e.role === "employee");
  if (!staff.length) return;

  const names = staff.map(e => e.name.split(" ")[0]);

  addChart("team-accuracy", {

      datasets: [{

    options: baseChartOptions({
      scales: {
        y: {
          min: 0,
          max: 100,
          grid: { color: CHART_THEME.grid },
          ticks: { callback: v => v + "%", font: { size: 11 } }
        },
        x: { grid: { display: false }, ticks: { font: { size: 11 } } }
      },
      plugins: {

    })

  addChart("team-sessions", {
    type: "bar",

    addChart("team-avg-activity", {

        }]
      },
      options: baseChartOptions({
        scales: {
          y: {
            min: 0,
            max: 100,
            grid: { color: CHART_THEME.grid },
            ticks: { callback: v => v + "%", font: { size: 11 } }
          },

            grid: { display: false },
            ticks: { maxRotation: 45, minRotation: 45, font: { size: 10 } }
          }
        }
      })
    });
  });
}

async function fetchTeamActivityBreakdown(staff) {
  if (!staff.length || !authToken) return [];
  try {
    const details = await Promise.all(
      staff.map(emp => apiFetch(`/api/admin/employees/${emp.id}`))
    );
    const map = {};
    details.forEach(d => {
      d.stats.by_activity.forEach(row => {
        const key = row.activity_type + "|" + row.category;
        if (!map[key]) {
          map[key] = { activity_type: row.activity_type, category: row.category, correct: 0, questions: 0 };
        }
        map[key].correct += row.correct;
        map[key].questions += row.questions;
      });
    });
    return Object.values(map)
      .map(r => ({ ...r, accuracy: r.questions ? Math.round((r.correct / r.questions) * 100) : 0 }))
      .sort((a, b) => b.questions - a.questions)
      .slice(0, 10);
  } catch {
    return [];
  }
}

function markSessionRecorded(session) {
  if (session && !session.recorded) {
    session.recorded = true;
    return true;
  }
  return false;
}

function updateSearchPlaceholder() {
  const search = document.getElementById("search");
  const placeholders = {
    ontap: "Search beer, style, or flavor",
    beer: "Search beer, style, or flavor",
    food: "Search food items",
    coffee: "Search coffee manual topics",
    games: "Search beer, style, or flavor"
  };
  search.placeholder = placeholders[activeType] || "Search";
}

function renderCoffee(content) {
  updateSearchPlaceholder();
  const query = document.getElementById("search").value.toLowerCase().trim();

  const subtabs = `
    <div class="coffee-subtabs">
      <button class="coffee-subtab${coffeeMode === "guide" ? " active" : ""}" onclick="coffeeMode='guide'; render();">Manual</button>
      <button class="coffee-subtab${coffeeMode === "quiz" ? " active" : ""}" onclick="startCoffeeQuiz();">Training Quiz</button>
      <button class="coffee-subtab${coffeeMode === "flash" ? " active" : ""}" onclick="startCoffeeFlash();">Flashcards</button>
    </div>
  `;

  if (coffeeMode === "guide") {
    renderCoffeeGuide(content, subtabs, query);
  } else if (coffeeMode === "quiz") {
    content.innerHTML = subtabs + renderCoffeeQuizInner();
  } else if (coffeeMode === "flash") {
    content.innerHTML = subtabs + renderCoffeeFlashInner();
  }
}

function renderCoffeeGuide(content, subtabs, query) {
  const categories = `
    <div class="coffee-filters">
      <button class="filter-btn${coffeeCategory === "all" ? " active" : ""}" onclick="coffeeCategory='all'; render();">All</button>
      <button class="filter-btn${coffeeCategory === "fundamentals" ? " active" : ""}" onclick="coffeeCategory='fundamentals'; render();">Fundamentals</button>
      <button class="filter-btn${coffeeCategory === "bar" ? " active" : ""}" onclick="coffeeCategory='bar'; render();">Bar Skills</button>
      <button class="filter-btn${coffeeCategory === "reference" ? " active" : ""}" onclick="coffeeCategory='reference'; render();">Reference</button>
    </div>
  `;

  const filtered = COFFEE_SECTIONS.filter(section => {
    const matchesCategory = coffeeCategory === "all" || section.category === coffeeCategory;
    const haystack = (section.title + " " + section.summary + " " + section.body).toLowerCase();
    const matchesSearch = !query || haystack.includes(query);
    return matchesCategory && matchesSearch;
  });

  content.innerHTML = subtabs + `
    <div class="coffee-intro">
      <h2>Coffee Training Manual</h2>
      <p>Farm-to-cup fundamentals, bar standards, and practical training guidance. Read Sections 1–5 first, use 6–11 for hands-on training, and 12–14 for shift standards and troubleshooting.</p>
    </div>
    ${categories}
    ${filtered.length ? `<div class="list coffee-list">${filtered.map(section => `
      <div class="card coffee-card" onclick="openCoffeeSection(${section.id})">
        <p class="coffee-section-num">Section ${section.id}</p>
        <div class="card-top">
          <div>
            <p class="name">${escapeHTML(section.title)}</p>
            <p class="desc">${escapeHTML(section.summary)}</p>
          </div>
          <span class="coffee-tag">${escapeHTML(COFFEE_CATEGORY_LABELS[section.category])}</span>
        </div>
        <div class="details-hint">Tap to read full section</div>
      </div>
    `).join("")}</div>` : `<div class="status"><strong>No sections match.</strong>Try a different search or category.</div>`}
  `;
}

function openCoffeeSection(id) {
  const section = COFFEE_SECTIONS.find(s => s.id === id);
  if (!section) return;

  document.getElementById("modalContent").innerHTML = `
    <p class="coffee-section-num">Section ${section.id} · ${escapeHTML(COFFEE_CATEGORY_LABELS[section.category])}</p>
    <h2 class="modal-title" id="modalTitle">${escapeHTML(section.title)}</h2>
    <p class="modal-style">${escapeHTML(section.summary)}</p>
    <div class="detail-section manual-body">${section.body}</div>
  `;

  document.getElementById("modalBackdrop").classList.add("show");
  document.body.style.overflow = "hidden";
}

function startCoffeeQuiz() {
  coffeeMode = "quiz";
  const total = Math.min(GAME_ROUNDS.coffeeQuiz, COFFEE_QUIZ.length);
  coffeeSession = {
    queue: shuffle(COFFEE_QUIZ).slice(0, total),
    index: 0,
    right: 0,
    complete: false,
    recorded: false
  };
  coffeeQuizItem = null;
  prepareCoffeeQuizQuestion();
  render();
}

function prepareCoffeeQuizQuestion() {
  if (!coffeeSession || coffeeSession.complete) return;
  const item = coffeeSession.queue[coffeeSession.index];
  coffeeQuizItem = {
    question: item.q,
    correct: item.a,
    options: shuffle([item.a, ...item.w.slice(0, 3)]),
    answered: false
  };
}

function renderCoffeeQuizInner() {
  if (!coffeeSession) {
    return `<div class="status" style="margin:14px;"><strong>Start the quiz</strong> using the Training Quiz tab above.</div>`;
  }
  if (coffeeSession.complete) {
    const total = coffeeSession.queue.length;
    const pct = Math.round((coffeeSession.right / total) * 100);
    return `
      <div class="game-card">
        <p class="game-question" style="font-size:20px;font-weight:750;">Quiz complete!</p>
        <p style="font-size:15px;color:#555;margin:0;">You got <strong>${coffeeSession.right}</strong> out of <strong>${total}</strong> correct (${pct}%)</p>
        <button class="game-next" onclick="startCoffeeQuiz()">Play Again</button>
      </div>
    `;
  }
  if (!coffeeQuizItem) prepareCoffeeQuizQuestion();

  return `
    <div class="game-card">
      <p class="game-question">${escapeHTML(coffeeQuizItem.question)}</p>
      <div class="game-options">
        ${coffeeQuizItem.options.map(o => {
          let cls = "game-option";
          if (coffeeQuizItem.answered) {
            cls += " disabled";
            if (o === coffeeQuizItem.correct) cls += " correct";
            else if (o === coffeeQuizItem.selected) cls += " wrong";
          }
          return `<div class="${cls}" onclick="answerCoffeeQuiz('${escapeForAttribute(o)}')">${escapeHTML(o)}</div>`;
        }).join("")}
      </div>
    </div>
    <div class="game-score">Question ${coffeeSession.index + 1} of ${coffeeSession.queue.length} · Score: ${coffeeSession.right} / ${coffeeSession.index}</div>
  `;
}

function answerCoffeeQuiz(answer) {
  if (!coffeeQuizItem || coffeeQuizItem.answered) return;
  coffeeQuizItem.answered = true;
  coffeeQuizItem.selected = answer;
  const correct = answer === coffeeQuizItem.correct;
  setTimeout(() => {
    if (correct) coffeeSession.right++;
    coffeeSession.index++;
    if (coffeeSession.index >= coffeeSession.queue.length) {
      coffeeSession.complete = true;
      if (markSessionRecorded(coffeeSession)) {
        recordProgress("coffee_quiz", "coffee", coffeeSession.right, coffeeSession.queue.length);
      }
    } else {
      prepareCoffeeQuizQuestion();
    }
    render();
  }, 450);
  render();
}

function startCoffeeFlash() {
  coffeeMode = "flash";
  coffeeFlashFlipped = false;
  coffeeSession = {
    queue: shuffle(COFFEE_FLASHCARDS).slice(0, Math.min(GAME_ROUNDS.coffeeFlash, COFFEE_FLASHCARDS.length)),
    index: 0,
    complete: false,
    recorded: false
  };
  render();
}

function renderCoffeeFlashInner() {
  if (!coffeeSession) {
    return `<div class="status" style="margin:14px;"><strong>Start flashcards</strong> using the Flashcards tab above.</div>`;
  }
  if (coffeeSession.complete) {
    return `
      <div class="game-card">
        <p class="game-question" style="font-size:20px;font-weight:750;">Deck complete!</p>
        <p style="font-size:15px;color:#555;margin:0;">You reviewed <strong>${coffeeSession.queue.length}</strong> cards from the training manual.</p>
        <button class="game-next" onclick="startCoffeeFlash()">Play Again</button>
      </div>
    `;
  }

  const card = coffeeSession.queue[coffeeSession.index];

  return `
    <div class="flash-card" onclick="coffeeFlashFlipped = !coffeeFlashFlipped; render();">
      ${!coffeeFlashFlipped ? `
        <p style="font-size:17px;font-weight:750;margin:0 0 7px;">${escapeHTML(card.front)}</p>
        <p style="font-size:12.5px;color:#999;">Tap to reveal answer</p>
      ` : `
        <p style="font-size:14px;color:#555;line-height:1.6;margin:0;">${escapeHTML(card.back)}</p>
      `}
    </div>
    <div class="flash-nav">
      <button onclick="coffeeFlashFlipped = false; if (coffeeSession.index > 0) coffeeSession.index--; render();">Previous</button>
      <button onclick="coffeeFlashFlipped = false; coffeeSession.index++; if (coffeeSession.index >= coffeeSession.queue.length) { coffeeSession.complete = true; if (markSessionRecorded(coffeeSession)) recordProgress('coffee_flash', 'coffee', coffeeSession.queue.length, coffeeSession.queue.length); } render();">${coffeeSession.index + 1 >= coffeeSession.queue.length ? "Finish" : "Next"}</button>
    </div>
    <div class="flash-count">Card ${coffeeSession.index + 1} of ${coffeeSession.queue.length}</div>
  `;
}

function startGame(id) {
  activeGame = id;
  gameSession = null;
  quizItem = practiceItem = tapItem = abvItem = styleItem = reverseItem = speedItem = null;
  flashFlipped = false;

  if (id === "flash") {
    const pool = beers.filter(onTapGameBeer(b =>
      getFlavorProfile(b) || getStyle(b) || getDescription(b)
    ));
    if (pool.length === 0) {
      render();
      return;
    }
    const total = Math.min(GAME_ROUNDS.flash, pool.length);
    gameSession = {
      id: "flash",
      queue: shuffle(pool).slice(0, total),
      index: 0,
      right: 0,
      complete: false,
      recorded: false
    };
  } else if (id === "speed") {
    if (!beginRound("speed", onTapGameBeer(b =>
      getFlavorProfile(b) ||
      getGuestGuidance(b) ||
      getTapNumber(b) ||
      getABVNumber(b) > 0 ||
      getStyle(b)
    ))) {
      render();
      return;
    }
    prepareSpeedQuestion();
  } else {
    const starters = {
      quiz: () => beginRound("quiz", onTapGameBeer(b => getFlavorProfile(b))),
      practice: () => beginRound("practice", onTapGameBeer(b => getGuestGuidance(b))),
      tap: () => beginRound("tap", onTapGameBeer(b => getTapNumber(b))),
      abv: () => beginRound("abv", onTapGameBeer(b => getABVNumber(b) > 0)),
      style: () => beginRound("style", onTapGameBeer(b => getStyle(b))),
      reverse: () => beginRound("reverse", onTapGameBeer(b => getFlavorProfile(b)))
    };
    if (!starters[id] || !starters[id]()) {
      render();
      return;
    }
    prepareRoundQuestion(id);
  }

  render();
}

function beginRound(id, filterFn) {
  const pool = beers.filter(filterFn);
  if (pool.length < 4) return false;

  const total = Math.min(GAME_ROUNDS[id], pool.length);
  gameSession = {
    id,
    pool,
    queue: shuffle(pool).slice(0, total),
    index: 0,
    right: 0,
    complete: false,
    recorded: false
  };
  return true;
}

function advanceRound(correct) {
  if (!gameSession || gameSession.complete) return;
  gameSession.right += correct ? 1 : 0;
  gameSession.index++;

  if (gameSession.index >= gameSession.queue.length) {
    gameSession.complete = true;
    if (markSessionRecorded(gameSession)) {
      const category = gameSession.id.startsWith("coffee") ? "coffee" : "beer";
      recordProgress(gameSession.id, category, gameSession.right, gameSession.queue.length);
    }
    return;
  }

  prepareRoundQuestion(gameSession.id);
  if (gameSession.id === "speed") prepareSpeedQuestion();
}

function sessionProgressLabel() {
  if (!gameSession) return "";
  if (gameSession.complete) {
    return `Round complete · ${gameSession.right} / ${gameSession.queue.length} correct`;
  }
  return `Question ${gameSession.index + 1} of ${gameSession.queue.length} · Score: ${gameSession.right} / ${gameSession.index}`;
}

function renderRoundComplete(title) {
  const total = gameSession.queue.length;
  const pct = Math.round((gameSession.right / total) * 100);
  return `
    <div class="game-card">
      <p class="game-question" style="font-size:20px;font-weight:750;">${title}</p>
      <p style="font-size:15px;color:#555;margin:0;">You got <strong>${gameSession.right}</strong> out of <strong>${total}</strong> correct (${pct}%)</p>
      <button class="game-next" onclick="startGame('${activeGame}')">Play Again</button>
    </div>
    <div class="game-score">${sessionProgressLabel()}</div>
  `;
}

function pickWrongBeers(pool, correct, count) {
  return shuffle(pool.filter(b => b.Name !== correct.Name)).slice(0, count);
}

function uniqueSheetValues(pool, getter, exclude) {
  const seen = new Set();
  const values = [];
  shuffle(pool).forEach(item => {
    const value = getter(item);
    if (!value || value === exclude || seen.has(value)) return;
    seen.add(value);
    values.push(value);
  });
  return values;
}

function prepareRoundQuestion(id) {
  const correct = gameSession.queue[gameSession.index];
  const pool = gameSession.pool;

  if (id === "quiz") {
    quizItem = {
      correct,
      options: shuffle([correct, ...pickWrongBeers(pool, correct, 3)]),
      answered: false
    };
  } else if (id === "practice") {
    practiceItem = {
      correct,
      options: shuffle([correct, ...pickWrongBeers(pool, correct, 3)]),
      answered: false
    };
  } else if (id === "tap") {
    tapItem = {
      correct,
      options: shuffle([correct, ...pickWrongBeers(pool, correct, 3)]),
      answered: false
    };
  } else if (id === "abv") {
    const correctAbv = getABVNumber(correct);
    const wrongAbvs = uniqueSheetValues(
      pool.filter(b => b.Name !== correct.Name),
      b => String(getABVNumber(b)),
      String(correctAbv)
    ).slice(0, 3).map(v => parseFloat(v));

    if (wrongAbvs.length < 3) {
      gameSession.queue = gameSession.queue.filter(b => b.Name !== correct.Name);
      if (gameSession.index >= gameSession.queue.length) {
        gameSession.complete = true;
        return;
      }
      prepareRoundQuestion("abv");
      return;
    }

    abvItem = {
      correct,
      correctAbv,
      options: shuffle([
        { label: getABVText(correct), value: correctAbv },
        ...wrongAbvs.map(v => ({
          label: v + "%",
          value: v
        }))
      ]),
      answered: false
    };
  } else if (id === "style") {
    const wrongStyles = uniqueSheetValues(
      pool.filter(b => b.Name !== correct.Name),
      getStyle,
      getStyle(correct)
    ).slice(0, 3);

    if (wrongStyles.length < 3) {
      gameSession.complete = true;
      return;
    }

    styleItem = {
      correct,
      options: shuffle([
        { label: getStyle(correct), isCorrect: true },
        ...wrongStyles.map(s => ({ label: s, isCorrect: false }))
      ]),
      answered: false
    };
  } else if (id === "reverse") {
    const wrongProfiles = uniqueSheetValues(
      pool.filter(b => b.Name !== correct.Name),
      getFlavorProfile,
      getFlavorProfile(correct)
    ).slice(0, 3);

    if (wrongProfiles.length < 3) {
      gameSession.complete = true;
      return;
    }

    reverseItem = {
      correct,
      options: shuffle([
        { text: getFlavorProfile(correct), isCorrect: true },
        ...wrongProfiles.map(t => ({ text: t, isCorrect: false }))
      ]),
      answered: false
    };
  }
}

function prepareSpeedQuestion() {
  if (!gameSession || gameSession.complete) return;

  const correct = gameSession.queue[gameSession.index];
  const pool = gameSession.pool;
  const types = [];

  if (getFlavorProfile(correct)) types.push("quiz");
  if (getGuestGuidance(correct)) types.push("practice");
  if (getTapNumber(correct)) types.push("tap");
  if (getABVNumber(correct) > 0) types.push("abv");
  if (getStyle(correct)) types.push("style");

  if (types.length === 0) {
    gameSession.index++;
    if (gameSession.index >= gameSession.queue.length) {
      gameSession.complete = true;
      return;
    }
    prepareSpeedQuestion();
    return;
  }

  const type = pickRandom(types);

  if (type === "quiz") {
    speedItem = {
      type: "quiz",
      correct,
      question: getFlavorProfile(correct),
      options: shuffle([correct, ...pickWrongBeers(pool.filter(b => getFlavorProfile(b)), correct, 3)]),
      answered: false
    };
  } else if (type === "practice") {
    speedItem = {
      type: "practice",
      correct,
      question: getGuestGuidance(correct),
      options: shuffle([correct, ...pickWrongBeers(pool.filter(b => getGuestGuidance(b)), correct, 3)]),
      answered: false
    };
  } else if (type === "tap") {
    speedItem = {
      type: "tap",
      correct,
      question: `Tap ${getTapNumber(correct)}`,
      options: shuffle([correct, ...pickWrongBeers(pool.filter(b => getTapNumber(b)), correct, 3)]),
      answered: false
    };
  } else if (type === "abv") {
    const correctAbv = getABVNumber(correct);
    const wrongAbvs = uniqueSheetValues(
      pool.filter(b => b.Name !== correct.Name && getABVNumber(b) > 0),
      b => String(getABVNumber(b)),
      String(correctAbv)
    ).slice(0, 3).map(v => parseFloat(v));

    speedItem = {
      type: "abv",
      correct,
      correctAbv,
      question: `${col(correct, "Name")} — pick ABV`,
      options: shuffle([
        { label: getABVText(correct), value: correctAbv },
        ...wrongAbvs.map(v => ({ label: v + "%", value: v }))
      ]),
      answered: false
    };
  } else if (type === "style") {
    speedItem = {
      type: "style",
      correct,
      question: col(correct, "Name"),
      options: shuffle([
        { label: getStyle(correct), isCorrect: true },
        ...uniqueSheetValues(pool.filter(b => b.Name !== correct.Name), getStyle, getStyle(correct))
          .slice(0, 3)
          .map(s => ({ label: s, isCorrect: false }))
      ]),
      answered: false
    };
  }
}

function wrapGame(html) {
  return `
    <button class="game-back" onclick="activeGame=null; gameSession=null; render();">← All Games</button>
    ${html}
  `;
}

function renderGameHub(content) {
  content.innerHTML = `
    <div class="coffee-intro">
      <h2>Training Games</h2>
      <p>Practice current tap list knowledge with quizzes, flashcards, and timed challenges. Scores are saved when you're logged in.</p>
    </div>
    <div class="game-hub">
      ${GAMES.map(g => `
        <div class="game-tile" onclick="startGame('${g.id}')">
          <div class="game-tile-icon">${g.icon}</div>
          <p class="game-tile-title">${g.title}</p>
          <p class="game-tile-desc">${g.desc}</p>
        </div>
      `).join("")}
    </div>
  `;
}

function renderGames(content) {
  if (!activeGame) {
    renderGameHub(content);
    return;
  }

  switch (activeGame) {
    case "flash": renderFlash(content); break;
    case "quiz": renderQuiz(content); break;
    case "practice": renderPractice(content); break;
    case "tap": renderTapMatch(content); break;
    case "abv": renderABVChallenge(content); break;
    case "style": renderStyleMatch(content); break;
    case "reverse": renderReverseQuiz(content); break;
    case "speed": renderSpeedRound(content); break;
    default: renderGameHub(content);
  }
}

function pickRandom(pool) {
  return pool[Math.floor(Math.random() * pool.length)];
}

function renderChoiceGame(content, item, questionHTML, getOptionHTML, onAnswer) {
  content.innerHTML = wrapGame(`
    <div class="game-card">
      <p class="game-question">${questionHTML}</p>
      <div class="game-options">
        ${item.options.map(o => {
          let cls = "game-option";
          if (item.answered) {
            cls += " disabled";
            if (o.Name === item.correct.Name) cls += " correct";
            else if (o.Name === item.selected) cls += " wrong";
          }
          return `<div class="${cls}" onclick="${onAnswer}('${escapeForAttribute(o.Name)}')">${getOptionHTML(o)}</div>`;
        }).join("")}
      </div>
    </div>
    <div class="game-score">${sessionProgressLabel()}</div>
  `);
}

function renderNewTapBanner() {
  const newBeers = beers.filter(b =>
    isYes(b["New Tap"]) &&
    isYes(b["On Tap"])
  );

  if (newBeers.length === 0) return "";

  if (newTapIndex >= newBeers.length) newTapIndex = 0;

  const b = newBeers[newTapIndex];
  const style = getStyle(b);
  const flavor = getFlavorProfile(b);

  return `
    <div class="new-banner" onclick="openBeerByName('${escapeForAttribute(b.Name)}')" style="cursor:pointer;">
      <p class="new-banner-label">NEWLY TAPPED</p>
      <p class="new-banner-name">${escapeHTML(b.Name)}</p>
      <p class="new-banner-desc">
        ${escapeHTML(style)}${flavor ? " — " + escapeHTML(flavor.slice(0, 105)) : ""}
      </p>
      <div class="new-banner-dots">
        ${newBeers.map((_, i) =>
          `<div class="new-banner-dot${i === newTapIndex ? " active" : ""}"></div>`
        ).join("")}
      </div>
    </div>
  `;
}

function startNewTapRotation() {
  if (newTapTimer) clearInterval(newTapTimer);

  newTapTimer = setInterval(() => {
    const newBeers = beers.filter(b =>
      isYes(b["New Tap"]) &&
      isYes(b["On Tap"])
    );

    if (newBeers.length === 0) return;

    newTapIndex = (newTapIndex + 1) % newBeers.length;

    if (activeType === "beer" || activeType === "ontap") {
      render();
    }
  }, 4500);
}

function renderList(content) {
  const query = document.getElementById("search").value.toLowerCase().trim();
  let source = activeType === "food" ? foods : beers;

  if (activeType === "ontap") {
    source = source
      .filter(isOnTap)
      .sort((a, b) => {
        const tapA = Number(getTapNumber(a) || 999);
        const tapB = Number(getTapNumber(b) || 999);
        return tapA - tapB;
      });
  }

  const filtered = source.filter(item => {
    const matchesSearch =
      !query ||
      getSearchText(item).includes(query);

    const matchesActiveFilter =
      activeType === "food" ||
      matchesFilter(item);

    return matchesSearch && matchesActiveFilter;
  });

  const banner =
    activeType === "ontap"
      ? renderNewTapBanner()
      : "";

  if (filtered.length === 0) {
    const message =
      activeType === "ontap" && source.length === 0
        ? "No beers are currently marked as On Tap. Check the On Tap column in your spreadsheet."
        : "Nothing matches your search or selected filter.";

    content.innerHTML = banner + `
      <div class="status">
        <strong>Nothing to show yet.</strong>
        ${message}
      </div>
    `;
    return;
  }

  content.innerHTML =
    banner +
    '<div class="list">' +
    filtered.map(item => renderBeerCard(item)).join("") +
    "</div>";
}

function renderBeerCard(item) {
  const style = getStyle(item);
  const flavor = getFlavorProfile(item);
  const description = getDescription(item);
  const abv = getABVText(item);
  const gf = isYes(item["Gluten-Reduced"]);
  const isNew = isYes(item["New Tap"]);
  const guidance = getGuestGuidance(item);
  const tapNumber = getTapNumber(item);

  const subtitle = [style, flavor || description].filter(Boolean).join(" — ");
  const cardBody = `
    <div class="card-top">
      <div>
        <p class="name">${escapeHTML(col(item, "Name"))}</p>
        ${subtitle ? `<p class="desc">${escapeHTML(subtitle.slice(0, 130))}${subtitle.length > 130 ? "…" : ""}</p>` : ""}
      </div>
      ${abv ? `<span class="abv">${escapeHTML(abv)} ABV</span>` : ""}
    </div>

    <div class="tags">
      ${isNew ? `<span class="tag new">New</span>` : ""}
      ${gf ? `<span class="tag gf">Gluten-reduced</span>` : ""}
      ${guidance ? `<span class="tag">${escapeHTML(guidance)}</span>` : ""}
    </div>

    <div class="details-hint">Tap to view sheet details</div>
  `;

  if (activeType === "ontap") {
    return `
      <div class="card" onclick="openBeerByName('${escapeForAttribute(item.Name)}')">

  return `

function escapeHTML(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeForAttribute(value) {
  return String(value || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}

function stripHtmlForChat(html) {
  return String(html || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
}

function formatBeerForChat(beer) {
  const tap = col(beer, "Tap") || col(beer, "tap") || col(beer, "Tap Number");
  const abv = getABVNumber(beer) || col(beer, "ABV") || col(beer, "abv");
  const parts = [
    col(beer, "Name"),
    tap ? `Tap ${tap}` : null,
    getStyle(beer) || null,
    abv ? `ABV ${abv}${String(abv).includes("%") ? "" : "%"}` : null,
    getFlavorProfile(beer) ? `Flavor: ${getFlavorProfile(beer)}` : null,
    getDescription(beer) ? `Description: ${getDescription(beer)}` : null,
    getGuestGuidance(beer) ? `Guest guidance: ${getGuestGuidance(beer)}` : null,
    isYes(col(beer, "Gluten-Reduced")) ? "Gluten-reduced" : null,
    isYes(col(beer, "New Tap")) ? "New tap" : null
  ].filter(Boolean);
  return parts.join(" | ");
}

function chatTerms(query) {
  return String(query || "").toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 2);
}

function chatScore(text, terms) {
  const lower = String(text || "").toLowerCase();
  let score = 0;
  for (const term of terms) {
    if (lower.includes(term)) score += term.length > 4 ? 3 : 1;
  }
  return score;
}

function localChatAnswer(message) {
  const terms = chatTerms(message);
  const q = message.toLowerCase();

  if (/^(hi|hello|hey)\b/.test(q)) {
    return "Hi! I can help with beers on the tap list, coffee bar training, and training games on this site. What would you like to know?";
  }

  if (/tap|on tap|what'?s pouring|what is pouring/.test(q) && beers.length) {
    const onTap = beers
      .filter(b => (col(b, "Tap") || col(b, "tap")) && col(b, "Name"))
      .sort((a, b) => Number(col(a, "Tap") || col(a, "tap")) - Number(col(b, "Tap") || col(b, "tap")));
    if (onTap.length) {
      return "Current tap list:\n\n" + onTap.map(b => "• " + formatBeerForChat(b)).join("\n");
    }
  }

  if (/gluten|gf\b/.test(q)) {
    const gf = beers.filter(b => isYes(col(b, "Gluten-Reduced")));
    if (gf.length) {
      return "Gluten-reduced beers:\n\n" + gf.map(b => "• " + formatBeerForChat(b)).join("\n");
    }
  }

  const beerHits = beers
    .map(beer => ({ beer, score: chatScore(formatBeerForChat(beer), terms) }))
    .filter(row => row.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);

  if (beerHits.length) {
    return "Here's what I found in the beer menu:\n\n" +
      beerHits.map(({ beer }) => "• " + formatBeerForChat(beer)).join("\n\n") +
      "\n\nCheck the On Tap or All Beers tab for full details.";
  }

  const coffeeHits = COFFEE_SECTIONS
    .map(section => ({
      section,
      score: chatScore(`${section.title} ${section.summary} ${stripHtmlForChat(section.body)}`, terms)
    }))
    .filter(row => row.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 3);

  if (coffeeHits.length) {
    return "From the coffee training manual:\n\n" +
      coffeeHits.map(({ section }) => {
        const excerpt = stripHtmlForChat(section.body).slice(0, 360);
        return `${section.title}\n${section.summary}\n${excerpt}${excerpt.length >= 360 ? "…" : ""}`;
      }).join("\n\n");
  }

  if (/game|quiz|flashcard|training/.test(q)) {
    return "Training games on this site:\n\n" +
      GAMES.map(g => `• ${g.title} — ${g.desc}`).join("\n") +
      "\n\nFor coffee: open the Coffee tab → Training Quiz or Flashcards.";
  }

  return "I couldn't find that in the training materials. Try a specific beer name, tap number, 'gluten reduced', 'espresso dial-in', or 'training games'. I only answer from content on this site.";
}

let chatOpen = false;
let chatHistory = [];
let chatBusy = false;
let chatMode = "local";
let chatApiAvailable = false;

function toggleChatPanel(force) {
  chatOpen = typeof force === "boolean" ? force : !chatOpen;
  document.getElementById("chatPanel").classList.toggle("open", chatOpen);
  document.getElementById("chatFab").classList.toggle("open", chatOpen);
  document.getElementById("chatFabIcon").innerHTML = chatOpen
    ? `<path d="M18 6L6 18"/><path d="M6 6l12 12"/>`
    : `<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>`;

  if (chatOpen) {
    if (!chatHistory.length) {
      appendChatMessage(
        "assistant",
        "Hi! I can answer questions about beers on the tap list, coffee bar training, and training games on this site. What do you need?"
      );
    }
    document.getElementById("chatInput").focus();
  }
}

function appendChatMessage(role, content, extraClass) {
  const wrap = document.getElementById("chatMessages");
  const el = document.createElement("div");
  el.className = `chat-msg ${role}${extraClass ? " " + extraClass : ""}`;
  el.textContent = content;
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
  return el;
}

function setChatBusy(busy) {
  chatBusy = busy;
  document.getElementById("chatSendBtn").disabled = busy;
  document.getElementById("chatInput").disabled = busy;
}

async function initChat() {
  try {
    const response = await fetch(`${API_BASE}/api/chat/status`);
    const contentType = response.headers.get("content-type") || "";
    if (!contentType.includes("application/json")) throw new Error("not json");
    const data = await response.json();
    if (!response.ok || !data.mode) throw new Error("unavailable");
    chatApiAvailable = true;
    chatMode = data.mode;
    document.getElementById("chatModeBadge").textContent =
      data.enabled ? "AI · site content only" : "Quick search · add API key for AI";
  } catch {
    chatApiAvailable = false;
    document.getElementById("chatModeBadge").textContent = "On-device search";
  }
}

function askChatSuggestion(button) {
  const text = button.textContent.trim();
  document.getElementById("chatInput").value = text;
  sendChatMessage(null, text);
}

async function sendChatMessage(event, presetText) {
  if (event) event.preventDefault();
  if (chatBusy) return;

  const input = document.getElementById("chatInput");
  const message = (presetText || input.value).trim();
  if (!message) return;

  if (!chatOpen) toggleChatPanel(true);

  input.value = "";
  appendChatMessage("user", message);
  chatHistory.push({ role: "user", content: message });

  const typingEl = appendChatMessage("assistant", "Thinking…", "typing");
  setChatBusy(true);

  try {
    let reply;
    let mode = chatMode;

    if (chatApiAvailable) {
      const data = await apiFetch("/api/chat", {
        method: "POST",
        body: JSON.stringify({
          message,
          history: chatHistory.slice(0, -1)
        })
      });
      reply = data.reply;
      mode = data.mode || chatMode;
    } else {
      reply = localChatAnswer(message);
    }

    typingEl.remove();
    appendChatMessage("assistant", reply);
    chatHistory.push({ role: "assistant", content: reply });
    chatMode = mode;
  } catch (err) {
    typingEl.remove();
    const reply = localChatAnswer(message);
    appendChatMessage("assistant", reply);
    chatHistory.push({ role: "assistant", content: reply });
    chatApiAvailable = false;
    document.getElementById("chatModeBadge").textContent = "On-device search";
  } finally {
    setChatBusy(false);
    input.focus();
  }
}

loadData();
initAuth();
initChat();
</script>

</html>

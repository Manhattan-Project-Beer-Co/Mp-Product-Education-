function startGame(id) {
  activeGame = id;
  gameSession = null;
  quizItem = practiceItem = tapItem = abvItem = styleItem = reverseItem = speedItem = rocketItem = null;
  flashFlipped = false;
  stopRocketLoop();

  if (id === "guestscene" || id === "recovery") {
    const pack = id === "guestscene"
      ? (window.FloorContent?.GUEST_SCENARIOS || [])
      : (window.FloorContent?.COMPLAINT_SCENARIOS || []);
    gameSession = {
      id,
      queue: shuffle([...pack]),
      index: 0,
      right: 0,
      mistakes: [],
      complete: false,
      recorded: false,
      feedback: null
    };
    render();
    return;
  }

  if (id === "favbeer") {
    if (!currentUser) {
      activeGame = null;
      showLoginGate();
      return;
    }
    gameSession = {
      id: "favbeer",
      loading: true,
      questions: [],
      index: 0,
      right: 0,
      bonusPoints: 0,
      complete: false,
      recorded: false,
      feedback: null
    };
    render();
    apiFetch("/api/games/favorite-beer-quiz")
      .then(data => {
        if (activeGame !== "favbeer" || !gameSession || gameSession.id !== "favbeer") return;
        gameSession.loading = false;
        gameSession.questions = data.questions || [];
        gameSession.unlockedCount = data.unlockedCount || 0;
        gameSession.totalWithFavorites = data.totalWithFavorites || 0;
        gameSession.message = data.message || "";
        if (!gameSession.questions.length) gameSession.complete = true;
        render();
      })
      .catch(err => {
        if (activeGame !== "favbeer" || !gameSession) return;
        gameSession.loading = false;
        gameSession.error = err.message || "Could not load quiz.";
        gameSession.complete = true;
        render();
      });
    return;
  }

  if (id === "flash") {
    const pool = beers.filter(onTapGameBeer(b =>
      getFlavorProfile(b) || getStyle(b) || getDescription(b)
    ));
    if (pool.length === 0) {
      render();
      return;
    }
    const total = Math.min(GAME_ROUNDS.flash, pool.length);
    gameSession = {
      id: "flash",
      queue: shuffle(pool).slice(0, total),
      index: 0,
      right: 0,
      complete: false,
      recorded: false
    };
  } else if (id === "speed" || id === "rocket") {
    if (!beginRound(id, onTapGameBeer(b =>
      getFlavorProfile(b) ||
      getTapNumber(b) ||
      getABVNumber(b) > 0 ||
      getStyle(b)
    ))) {
      render();
      return;
    }
    if (id === "speed") prepareSpeedQuestion();
    else prepareRocketQuestion();
  } else {
    const starters = {
      quiz: () => beginRound("quiz", onTapGameBeer(b => getFlavorProfile(b))),
      // Same field as `quiz` since Guest Guidance was retired — the two differ in
      // how they ask, not in what they read. See renderPractice.
      practice: () => beginRound("practice", onTapGameBeer(b => getFlavorProfile(b))),
      tap: () => beginRound("tap", onTapGameBeer(b => getTapNumber(b))),
      abv: () => beginRound("abv", onTapGameBeer(b => getABVNumber(b) > 0)),
      style: () => beginRound("style", onTapGameBeer(b => getStyle(b))),
      reverse: () => beginRound("reverse", onTapGameBeer(b => getFlavorProfile(b)))
    };
    if (!starters[id] || !starters[id]()) {
      render();
      return;
    }
    prepareRoundQuestion(id);
  }

  render();
}

function beginRound(id, filterFn) {
  const pool = beers.filter(filterFn);
  if (pool.length < 4) return false;

  const total = Math.min(GAME_ROUNDS[id], pool.length);
  gameSession = {
    id,
    pool,
    queue: shuffle(pool).slice(0, total),
    index: 0,
    right: 0,
    mistakes: [],
    complete: false,
    recorded: false,
    streak: 0,
    maxStreak: 0
  };
  if (id === "rocket") {
    gameSession.lives = 3;
    gameSession.streak = 0;
    gameSession.maxStreak = 0;
    gameSession.score = 0;
  }
  return true;
}

function advanceRound(correct) {
  if (!gameSession || gameSession.complete) return;
  gameSession.right += correct ? 1 : 0;
  gameSession.index++;

  // Track answer streaks for Critical Mass (Launch Pad manages streak in resolveGalagaHit)
  if (gameSession.id !== "rocket") {
    if (correct) {
      gameSession.streak = (gameSession.streak || 0) + 1;
      gameSession.maxStreak = Math.max(gameSession.maxStreak || 0, gameSession.streak);
    } else {
      gameSession.streak = 0;
    }
  }

  const rocketDead = gameSession.id === "rocket" && (gameSession.lives || 0) <= 0;
  if (gameSession.index >= gameSession.queue.length || rocketDead) {
    gameSession.complete = true;
    if (markSessionRecorded(gameSession)) {
      const category = gameSession.id.startsWith("coffee") ? "coffee" : "beer";
      const attempted = Math.max(gameSession.index, gameSession.right, 1);
      const rocketPoints = gameSession.id === "rocket"
        ? Math.max(
            gameSession.right * (GAME_POINT_VALUES.rocket || 12),
            Math.round((gameSession.score || 0) / 100)
          )
        : undefined;
      recordProgress(
        gameSession.id,
        category,
        gameSession.right,
        gameSession.id === "rocket" ? attempted : gameSession.queue.length,
        rocketPoints,
        { maxStreak: gameSession.maxStreak || 0 }
      );
      if ((gameSession.maxStreak || 0) >= 5) {
        apiFetch("/api/achievements/check", {
          method: "POST",
          body: JSON.stringify({ event: "streak5", maxStreak: gameSession.maxStreak })
        }).then(res => {
          if ((res.titles || []).length) notifyClassifiedUnlock(res.titles);
        }).catch(() => {});
      }
    }
    return;
  }

  prepareRoundQuestion(gameSession.id);
  if (gameSession.id === "speed") prepareSpeedQuestion();
  if (gameSession.id === "rocket") prepareRocketQuestion();
}

function sessionProgressLabel() {
  if (!gameSession) return "";
  if (gameSession.complete) {
    return `Round complete · ${gameSession.right} / ${gameSession.queue.length} correct`;
  }
  return `Question ${gameSession.index + 1} of ${gameSession.queue.length} · Score: ${gameSession.right} / ${gameSession.index}`;
}

function recordWrongAnswer(session, question, selected, correct, explanation = "") {
  if (!session || !question || correct == null) return;
  if (!Array.isArray(session.mistakes)) session.mistakes = [];
  session.mistakes.push({
    question: String(question),
    selected: selected == null || selected === "" ? "No answer" : String(selected),
    correct: String(correct),
    explanation: explanation ? String(explanation) : ""
  });
}

function renderAnswerReview(session) {
  const mistakes = Array.isArray(session?.mistakes) ? session.mistakes : [];
  if (!mistakes.length) {
    return `<div class="answer-review"><div class="answer-review-item" style="border-left-color:#3f6b4a;"><p class="answer-review-question" style="margin:0;">Nothing to review — you got every answer right.</p></div></div>`;
  }
  return `
    <section class="answer-review" aria-label="Answer review">
      <h3>Review these answers</h3>
      <div class="answer-review-list">
        ${mistakes.map((item) => `
          <article class="answer-review-item">
            <p class="answer-review-question">${escapeHTML(item.question)}</p>
            <p class="answer-review-row"><strong>Your answer:</strong> ${escapeHTML(item.selected)}</p>
            <p class="answer-review-row answer-review-correct"><strong>Correct answer:</strong> ${escapeHTML(item.correct)}</p>
            ${item.explanation ? `<p class="answer-review-note">${escapeHTML(item.explanation)}</p>` : ""}
          </article>
        `).join("")}
      </div>
    </section>
  `;
}

function renderRoundComplete(title) {
  const total = gameSession.queue.length;
  const attempted = Math.min(gameSession.index, total) || total;
  const pct = Math.round((gameSession.right / Math.max(attempted, 1)) * 100);
  const rocketStats = gameSession.id === "rocket"
    ? `<p style="font-size:15px;color:var(--muted);margin:8px 0 0;">Score <strong style="color:var(--gold)">${gameSession.score || 0}</strong> · Best streak <strong style="color:var(--gold)">x${gameSession.maxStreak || 0}</strong></p>`
    : "";
  return `
    <div class="game-card">
      <p class="game-question" style="font-size:20px;font-weight:750;">${title}</p>
      <p style="font-size:15px;color:var(--muted);margin:0;">You got <strong style="color:var(--gold-dim)">${gameSession.right}</strong> out of <strong style="color:var(--ink)">${attempted}</strong> correct (${pct}%)</p>
      ${rocketStats}
      <button class="game-next" onclick="startGame('${activeGame}')">Play Again</button>
    </div>
    ${renderAnswerReview(gameSession)}
    <div class="game-score">${sessionProgressLabel()}</div>
  `;
}

function pickWrongBeers(pool, correct, count) {
  return shuffle(pool.filter(b => b.Name !== correct.Name)).slice(0, count);
}

function uniqueSheetValues(pool, getter, exclude) {
  const seen = new Set();
  const values = [];
  shuffle(pool).forEach(item => {
    const value = getter(item);
    if (!value || value === exclude || seen.has(value)) return;
    seen.add(value);
    values.push(value);
  });
  return values;
}

function prepareRoundQuestion(id) {
  const correct = gameSession.queue[gameSession.index];
  const pool = gameSession.pool;

  if (id === "quiz") {
    quizItem = {
      correct,
      options: shuffle([correct, ...pickWrongBeers(pool, correct, 3)]),
      answered: false
    };
  } else if (id === "practice") {
    practiceItem = {
      correct,
      options: shuffle([correct, ...pickWrongBeers(pool, correct, 3)]),
      answered: false
    };
  } else if (id === "tap") {
    tapItem = {
      correct,
      options: shuffle([correct, ...pickWrongBeers(pool, correct, 3)]),
      answered: false
    };
  } else if (id === "abv") {
    const correctAbv = getABVNumber(correct);
    const wrongAbvs = uniqueSheetValues(
      pool.filter(b => b.Name !== correct.Name),
      b => String(getABVNumber(b)),
      String(correctAbv)
    ).slice(0, 3).map(v => parseFloat(v));

    if (wrongAbvs.length < 3) {
      gameSession.queue = gameSession.queue.filter(b => b.Name !== correct.Name);
      if (gameSession.index >= gameSession.queue.length) {
        gameSession.complete = true;
        return;
      }
      prepareRoundQuestion("abv");
      return;
    }

    abvItem = {
      correct,
      correctAbv,
      options: shuffle([
        { label: getABVText(correct), value: correctAbv },
        ...wrongAbvs.map(v => ({
          label: v + "%",
          value: v
        }))
      ]),
      answered: false
    };
  } else if (id === "style") {
    const wrongStyles = uniqueSheetValues(
      pool.filter(b => b.Name !== correct.Name),
      getStyle,
      getStyle(correct)
    ).slice(0, 3);

    if (wrongStyles.length < 3) {
      gameSession.complete = true;
      return;
    }

    styleItem = {
      correct,
      options: shuffle([
        { label: getStyle(correct), isCorrect: true },
        ...wrongStyles.map(s => ({ label: s, isCorrect: false }))
      ]),
      answered: false
    };
  } else if (id === "reverse") {
    const wrongProfiles = uniqueSheetValues(
      pool.filter(b => b.Name !== correct.Name),
      getFlavorProfile,
      getFlavorProfile(correct)
    ).slice(0, 3);

    if (wrongProfiles.length < 3) {
      gameSession.complete = true;
      return;
    }

    reverseItem = {
      correct,
      options: shuffle([
        { text: getFlavorProfile(correct), isCorrect: true },
        ...wrongProfiles.map(t => ({ text: t, isCorrect: false }))
      ]),
      answered: false
    };
  }
}

function shortGalagaLabel(text, max = 12) {
  const clean = String(text || "").trim().replace(/\s+/g, " ");
  if (clean.length <= max) return clean;
  return `${clean.slice(0, max - 1)}…`;
}

function buildGalagaQuestion(pool) {
  const builders = [];

  const withTap = pool.filter(b => getTapNumber(b));
  const withStyle = pool.filter(b => getStyle(b));
  const withAbv = pool.filter(b => getABVNumber(b) > 0);
  const withFlavor = pool.filter(b => getFlavorProfile(b));

  if (withTap.length >= 4) {
    builders.push(() => {
      const correct = pickRandom(withTap);
      const options = shuffle([correct, ...pickWrongBeers(withTap, correct, 3)]).slice(0, 4).map((beer) => ({
        id: beer.Name,
        label: shortGalagaLabel(col(beer, "Name")),
        isCorrect: beer.Name === correct.Name
      }));
      return {
        prompt: `WHICH BEER IS ON TAP ${getTapNumber(correct)}?`,
        options
      };
    });

    builders.push(() => {
      const correct = pickRandom(withTap);
      const wrongTaps = uniqueSheetValues(
        withTap.filter(b => b.Name !== correct.Name),
        b => String(getTapNumber(b)),
        String(getTapNumber(correct))
      ).slice(0, 3);
      if (wrongTaps.length < 3) return null;
      return {
        prompt: `WHAT TAP IS ${shortGalagaLabel(col(correct, "Name"), 16).toUpperCase()} ON?`,
        options: shuffle([
          { id: `tap-${getTapNumber(correct)}`, label: `TAP ${getTapNumber(correct)}`, isCorrect: true },
          ...wrongTaps.map((t) => ({ id: `tap-${t}`, label: `TAP ${t}`, isCorrect: false }))
        ])
      };
    });
  }

  if (withStyle.length >= 4) {
    builders.push(() => {
      const correct = pickRandom(withStyle);
      const wrongStyles = uniqueSheetValues(
        withStyle.filter(b => b.Name !== correct.Name),
        getStyle,
        getStyle(correct)
      ).slice(0, 3);
      if (wrongStyles.length < 3) return null;
      return {
        prompt: `WHAT STYLE IS ${shortGalagaLabel(col(correct, "Name"), 14).toUpperCase()}?`,
        options: shuffle([
          { id: getStyle(correct), label: shortGalagaLabel(getStyle(correct), 11), isCorrect: true },
          ...wrongStyles.map((s) => ({ id: s, label: shortGalagaLabel(s, 11), isCorrect: false }))
        ])
      };
    });

    builders.push(() => {
      const correct = pickRandom(withStyle);
      const style = getStyle(correct);
      const options = shuffle([correct, ...pickWrongBeers(withStyle.filter(b => getStyle(b) !== style), correct, 3)]).slice(0, 4);
      if (options.length < 4) return null;
      return {
        prompt: `WHICH BEER IS A ${shortGalagaLabel(style, 14).toUpperCase()}?`,
        options: options.map((beer) => ({
          id: beer.Name,
          label: shortGalagaLabel(col(beer, "Name")),
          isCorrect: beer.Name === correct.Name
        }))
      };
    });
  }

  if (withAbv.length >= 4) {
    builders.push(() => {
      const correct = pickRandom(withAbv);
      const wrongAbvs = uniqueSheetValues(
        withAbv.filter(b => b.Name !== correct.Name),
        b => String(getABVNumber(b)),
        String(getABVNumber(correct))
      ).slice(0, 3);
      if (wrongAbvs.length < 3) return null;
      return {
        prompt: `ABV OF ${shortGalagaLabel(col(correct, "Name"), 14).toUpperCase()}?`,
        options: shuffle([
          { id: String(getABVNumber(correct)), label: getABVText(correct), isCorrect: true },
          ...wrongAbvs.map((v) => ({ id: String(v), label: `${v}%`, isCorrect: false }))
        ])
      };
    });

    builders.push(() => {
      const picks = shuffle(withAbv).slice(0, 4);
      if (picks.length < 4) return null;
      const maxAbv = Math.max(...picks.map(getABVNumber));
      const winners = picks.filter(b => getABVNumber(b) === maxAbv);
      if (winners.length !== 1) return null;
      const correct = winners[0];
      return {
        prompt: "WHICH HAS THE HIGHEST ABV?",
        options: picks.map((beer) => ({
          id: beer.Name,
          label: shortGalagaLabel(col(beer, "Name")),
          isCorrect: beer.Name === correct.Name
        }))
      };
    });

    builders.push(() => {
      const picks = shuffle(withAbv).slice(0, 4);
      if (picks.length < 4) return null;
      const minAbv = Math.min(...picks.map(getABVNumber));
      const winners = picks.filter(b => getABVNumber(b) === minAbv);
      if (winners.length !== 1) return null;
      const correct = winners[0];
      return {
        prompt: "WHICH HAS THE LOWEST ABV?",
        options: picks.map((beer) => ({
          id: beer.Name,
          label: shortGalagaLabel(col(beer, "Name")),
          isCorrect: beer.Name === correct.Name
        }))
      };
    });
  }

  if (withFlavor.length >= 4) {
    builders.push(() => {
      const correct = pickRandom(withFlavor);
      const flavor = getFlavorProfile(correct);
      // Keep only punchy flavor cues, not paragraphs
      const cue = shortGalagaLabel(flavor, 28).toUpperCase();
      if (cue.length < 8) return null;
      return {
        prompt: `MATCH FLAVOR: ${cue}`,
        options: shuffle([correct, ...pickWrongBeers(withFlavor, correct, 3)]).slice(0, 4).map((beer) => ({
          id: beer.Name,
          label: shortGalagaLabel(col(beer, "Name")),
          isCorrect: beer.Name === correct.Name
        }))
      };
    });
  }

  // New tap / flag questions when available
  const newTaps = pool.filter(b => isYes(b["New Tap"]));
  if (newTaps.length >= 1 && pool.length >= 4) {
    builders.push(() => {
      const correct = pickRandom(newTaps);
      return {
        prompt: "WHICH BEER IS NEWLY TAPPED?",
        options: shuffle([correct, ...pickWrongBeers(pool.filter(b => !isYes(b["New Tap"])), correct, 3)]).slice(0, 4).map((beer) => ({
          id: beer.Name,
          label: shortGalagaLabel(col(beer, "Name")),
          isCorrect: beer.Name === correct.Name
        }))
      };
    });
  }

  if (!builders.length) return null;

  for (let attempt = 0; attempt < 10; attempt++) {
    const built = pickRandom(builders)();
    if (built && built.options && built.options.length === 4 && built.options.filter(o => o.isCorrect).length === 1) {
      return built;
    }
  }
  return null;
}

function prepareRocketQuestion() {
  if (!gameSession || gameSession.complete) return;
  if (rocketRaf) {
    cancelAnimationFrame(rocketRaf);
    rocketRaf = null;
  }
  rocketKeys.left = false;
  rocketKeys.right = false;

  const pool = gameSession.pool;
  const built = buildGalagaQuestion(pool);

  if (!built) {
    gameSession.index++;
    if (gameSession.index >= gameSession.queue.length) {
      gameSession.complete = true;
      return;
    }
    prepareRocketQuestion();
    return;
  }

  // Keep queue progressing even though questions are generated from the full pool
  const count = 4;
  const spacing = 100 / (count + 1);
  const enemies = built.options.map((option, index) => ({
    index,
    option,
    baseX: spacing * (index + 1),
    baseY: 18 + (index % 2) * 14,
    x: spacing * (index + 1),
    y: 18 + (index % 2) * 14,
    alive: true,
    hitClass: "",
    kind: index % 4,
    phase: Math.random() * Math.PI * 2,
    diving: false,
    diveT: 0,
    nextDiveAt: 1.8 + Math.random() * 2.4
  }));

  const junk = Array.from({ length: 7 }, (_, i) => makeRocketJunk(i));

  rocketItem = {
    prompt: built.prompt,
    options: built.options,
    enemies,
    junk,
    junkId: junk.length,
    nextJunkAt: 2.2,
    bullets: [],
    shipX: 50,
    formationT: 0,
    answered: false,
    selected: null,
    locked: false,
    burstX: 50,
    burstY: 30,
    showBurst: false,
    lastShotAt: 0,
    resultText: "",
    debrief: "",
    pointerAim: false
  };
}

function makeRocketJunk(seed = 0) {
  const kinds = ["hop", "scrap", "ore", "spark"];
  const kind = kinds[seed % kinds.length];
  return {
    id: seed,
    kind,
    x: 8 + Math.random() * 84,
    y: -6 - Math.random() * 30,
    vx: (Math.random() - 0.5) * 0.55,
    vy: 0.35 + Math.random() * 0.45,
    spin: Math.random() * Math.PI * 2,
    alive: true,
    hitClass: ""
  };
}

function renderRocketRound(content) {
  if (!gameSession) {
    content.innerHTML = wrapGame('<div class="status"><strong>Not enough on-tap data for Launch Pad.</strong> Add flavor, guidance, tap, ABV, or style info for at least four on-tap beers.</div>');
    return;
  }

  if (gameSession.complete) {
    stopRocketLoop();
    const endedEarly = (gameSession.lives || 0) <= 0 && gameSession.index < gameSession.queue.length;
    content.innerHTML = wrapGame(renderRoundComplete(endedEarly ? "Shields depleted" : "Launch Pad complete"));
    return;
  }

  if (!rocketItem) prepareRocketQuestion();
  if (!rocketItem || gameSession.complete) {
    stopRocketLoop();
    content.innerHTML = wrapGame(renderRoundComplete("Launch Pad complete"));
    return;
  }

  const stage = gameSession.index + 1;
  const score = gameSession.score || 0;
  const streak = gameSession.streak || 0;
  const lives = gameSession.lives == null ? 3 : gameSession.lives;
  const livesHtml = Array.from({ length: 3 }, (_, i) =>
    `<span class="galaga-life ${i < lives ? "" : "empty"}"></span>`
  ).join("");
  const stars = Array.from({ length: 36 }, (_, i) => {
    const left = ((i * 37) % 100);
    const top = ((i * 53) % 88);
    const delay = ((i * 0.13) % 2).toFixed(2);
    return `<span class="rocket-star" style="left:${left}%;top:${top}%;animation-delay:${delay}s;width:${i % 5 === 0 ? 3 : 2}px;height:${i % 5 === 0 ? 3 : 2}px;"></span>`;
  }).join("");

  const enemies = rocketItem.enemies.map((enemy) => {
    let cls = `rocket-enemy kind-${enemy.kind}`;
    if (enemy.diving) cls += " diving";
    if (rocketItem.answered) {
      if (enemy.option.isCorrect) cls += " correct";
      else if (rocketItem.selected === enemy.index) cls += " wrong";
    }
    if (enemy.hitClass) cls += ` ${enemy.hitClass}`;
    const hidden = !enemy.alive && !enemy.hitClass ? "display:none;" : "";
    return `
      <div class="${cls}" id="rocket-enemy-${enemy.index}" style="left:${enemy.x}%;top:${enemy.y}%;${hidden}" onclick="galagaAimAndFire(${enemy.index})">
        <div class="galaga-sprite">${launchPadAtomSvg(enemy.kind)}</div>
        <span class="rocket-enemy-label">${escapeHTML(enemy.option.label)}</span>
      </div>
    `;
  }).join("");

  const junkHtml = (rocketItem.junk || []).map((piece) => {
    let cls = `rocket-junk kind-${piece.kind}`;
    if (piece.hitClass) cls += ` ${piece.hitClass}`;
    const hidden = !piece.alive && !piece.hitClass ? "display:none;" : "";
    return `
      <div class="${cls}" id="rocket-junk-${piece.id}" style="left:${piece.x}%;top:${piece.y}%;${hidden}" onclick="galagaShootJunk(${piece.id})">
        ${launchPadJunkSvg(piece.kind)}
      </div>
    `;
  }).join("");

  const missClass = /CONTAMINATED|MISS|DEPLETED/.test(rocketItem.resultText || "") ? "miss" : "";
  const debrief = rocketItem.debrief
    ? `<div class="galaga-debrief">DEBRIEF · correct was <strong>${escapeHTML(rocketItem.debrief)}</strong></div>`
    : "";

  content.innerHTML = wrapGame(`
    <div class="rocket-shell">
      <div class="galaga-cabinet" id="galagaCabinet">
        <div class="galaga-bezel">
          <div class="galaga-hud">
            <div>SCORE <span id="galagaScore">${score}</span></div>
            <div class="${streak >= 2 ? "combo-hot" : ""}">STREAK <span id="galagaStreak">x${streak}</span></div>
            <div>WAVE <span>${stage}/${gameSession.queue.length}</span></div>
            <div>SHIELDS <span class="galaga-lives" id="galagaLives">${livesHtml}</span></div>
          </div>
          <div class="galaga-mission" id="galagaMission">${escapeHTML(rocketItem.prompt)}</div>
        </div>
        <div class="rocket-arena" id="rocketArena">
          ${stars}
          <div id="rocketJunkLayer">${junkHtml}</div>
          <div id="rocketEnemyLayer">${enemies}</div>
          <div id="rocketBulletLayer"></div>
          <div class="rocket-burst ${rocketItem.showBurst ? "show" : ""}" id="rocketBurst" style="left:${rocketItem.burstX}%;top:${rocketItem.burstY}%;"></div>
          ${rocketItem.resultText ? `<div class="galaga-result ${missClass}">${escapeHTML(rocketItem.resultText)}</div>` : ""}
          ${debrief}
          <div class="rocket-ship" id="rocketShip" style="left:${rocketItem.shipX}%;">
            <div class="rocket-ship-body">${launchPadShipSvg()}</div>
            <div class="rocket-ship-flame"></div>
          </div>
        </div>
      </div>
      <div class="rocket-controls">
        <button type="button" onpointerdown="setRocketKey('left', true)" onpointerup="setRocketKey('left', false)" onpointerleave="setRocketKey('left', false)" ontouchstart="event.preventDefault(); setRocketKey('left', true)" ontouchend="setRocketKey('left', false)">LEFT</button>
        <button type="button" class="rocket-fire-btn" onclick="galagaFire()">FIRE</button>
        <button type="button" onpointerdown="setRocketKey('right', true)" onpointerup="setRocketKey('right', false)" onpointerleave="setRocketKey('right', false)" ontouchstart="event.preventDefault(); setRocketKey('right', true)" ontouchend="setRocketKey('right', false)">RIGHT</button>
      </div>
      <p class="rocket-hint">Clear hops & scrap · Tap or shoot the correct atom to lock</p>
    </div>
  `);

  bindRocketPointer();
  if (!rocketItem.answered && !rocketItem.locked) {
    startRocketLoop();
  }
}

function setRocketKey(dir, pressed) {
  if (dir === "left") rocketKeys.left = pressed;
  if (dir === "right") rocketKeys.right = pressed;
}

function galagaFire() {
  if (!rocketItem || rocketItem.answered || rocketItem.locked || activeGame !== "rocket") return;
  const now = performance.now();
  if (now - rocketItem.lastShotAt < 180) return;
  if (rocketItem.bullets.length >= 4) return;
  rocketItem.lastShotAt = now;
  rocketItem.bullets.push({
    id: ++rocketBulletId,
    x: rocketItem.shipX,
    y: 88
  });
}

function galagaAimAndFire(enemyIndex) {
  if (!rocketItem || rocketItem.answered || rocketItem.locked || activeGame !== "rocket") return;
  const enemy = rocketItem.enemies.find((entry) => entry.index === enemyIndex && entry.alive);
  if (!enemy) return;
  rocketItem.shipX = Math.max(8, Math.min(92, enemy.x));
  const ship = document.getElementById("rocketShip");
  if (ship) ship.style.left = `${rocketItem.shipX}%`;
  resolveGalagaHit(enemy);
}

function galagaShootJunk(junkId) {
  if (!rocketItem || rocketItem.answered || rocketItem.locked || activeGame !== "rocket") return;
  const piece = (rocketItem.junk || []).find((entry) => entry.id === junkId && entry.alive);
  if (!piece) return;
  rocketItem.shipX = Math.max(8, Math.min(92, piece.x));
  const ship = document.getElementById("rocketShip");
  if (ship) ship.style.left = `${rocketItem.shipX}%`;
  destroyRocketJunk(piece);
}

function startRocketLoop() {
  if (rocketRaf) {
    cancelAnimationFrame(rocketRaf);
    rocketRaf = null;
  }
  const tick = () => {
    if (activeGame !== "rocket" || !rocketItem || !gameSession || gameSession.complete) {
      rocketRaf = null;
      return;
    }
    if (!rocketItem.answered && !rocketItem.locked) {
      updateGalagaFrame();
    }
    rocketRaf = requestAnimationFrame(tick);
  };
  rocketRaf = requestAnimationFrame(tick);
}

function bindRocketPointer() {
  const arena = document.getElementById("rocketArena");
  if (!arena) return;

  const aimFromEvent = (event) => {
    if (!rocketItem || rocketItem.answered || rocketItem.locked) return;
    const rect = arena.getBoundingClientRect();
    if (!rect.width) return;
    const pct = ((event.clientX - rect.left) / rect.width) * 100;
    rocketItem.shipX = Math.max(8, Math.min(92, pct));
    const ship = document.getElementById("rocketShip");
    if (ship) ship.style.left = `${rocketItem.shipX}%`;
  };

  arena.onpointerdown = (event) => {
    if (event.target.closest("button") || event.target.closest(".rocket-enemy") || event.target.closest(".rocket-junk")) return;
    rocketItem.pointerAim = true;
    try { arena.setPointerCapture(event.pointerId); } catch (_) {}
    aimFromEvent(event);
  };
  arena.onpointermove = (event) => {
    if (!rocketItem?.pointerAim) return;
    aimFromEvent(event);
  };
  arena.onpointerup = () => {
    if (rocketItem) rocketItem.pointerAim = false;
  };
  arena.onpointercancel = () => {
    if (rocketItem) rocketItem.pointerAim = false;
  };
}

function destroyRocketJunk(piece) {
  if (!piece || !piece.alive || !rocketItem) return;
  piece.alive = false;
  piece.hitClass = "destroyed";
  gameSession.score = (gameSession.score || 0) + 75;
  rocketItem.burstX = piece.x;
  rocketItem.burstY = piece.y;
  rocketItem.showBurst = true;
  const burst = document.getElementById("rocketBurst");
  if (burst) {
    burst.style.left = `${piece.x}%`;
    burst.style.top = `${piece.y}%`;
    burst.classList.remove("show");
    void burst.offsetWidth;
    burst.classList.add("show");
  }
  const scoreEl = document.getElementById("galagaScore");
  if (scoreEl) scoreEl.textContent = String(gameSession.score || 0);
  const el = document.getElementById(`rocket-junk-${piece.id}`);
  if (el) el.classList.add("destroyed");
  rocketTimers.push(setTimeout(() => {
    if (!rocketItem || !piece) return;
    piece.hitClass = "";
    const node = document.getElementById(`rocket-junk-${piece.id}`);
    if (node) node.style.display = "none";
  }, 280));
}

function updateGalagaFrame() {
  rocketItem.formationT += 0.022;
  const t = rocketItem.formationT;
  if (!rocketItem.junk) rocketItem.junk = [];

  if (!rocketItem.pointerAim) {
    if (rocketKeys.left) rocketItem.shipX -= 1.7;
    if (rocketKeys.right) rocketItem.shipX += 1.7;
  }
  rocketItem.shipX = Math.max(8, Math.min(92, rocketItem.shipX));

  // Spawn fresh debris over the wave
  if (t > (rocketItem.nextJunkAt || 0)) {
    const living = rocketItem.junk.filter((p) => p.alive).length;
    if (living < 8) {
      const piece = makeRocketJunk(++rocketItem.junkId);
      rocketItem.junk.push(piece);
      const layer = document.getElementById("rocketJunkLayer");
      if (layer) {
        const node = document.createElement("div");
        node.className = `rocket-junk kind-${piece.kind}`;
        node.id = `rocket-junk-${piece.id}`;
        node.style.left = `${piece.x}%`;
        node.style.top = `${piece.y}%`;
        node.onclick = () => galagaShootJunk(piece.id);
        node.innerHTML = launchPadJunkSvg(piece.kind);
        layer.appendChild(node);
      }
    }
    rocketItem.nextJunkAt = t + 1.1 + Math.random() * 1.4;
  }

  rocketItem.enemies.forEach((enemy, i) => {
    if (!enemy.alive) return;
    const isCorrect = enemy.option.isCorrect;
    const drift = isCorrect ? 10 : 8;
    const bob = 2;

    if (!enemy.diving && isCorrect && t > enemy.nextDiveAt) {
      enemy.diving = true;
      enemy.diveT = 0;
    }

    if (enemy.diving) {
      enemy.diveT += 0.03;
      const dive = Math.sin(enemy.diveT);
      enemy.x = enemy.baseX + Math.sin(t * 0.4 + enemy.phase) * drift;
      enemy.y = enemy.baseY + dive * 12;
      if (enemy.diveT >= Math.PI) {
        enemy.diving = false;
        enemy.nextDiveAt = t + 5 + Math.random() * 4;
        enemy.y = enemy.baseY;
      }
    } else {
      enemy.x = enemy.baseX + Math.sin(t * 0.4 + enemy.phase) * drift;
      enemy.y = enemy.baseY + Math.sin(t * 0.7 + i + enemy.phase) * bob;
    }
  });

  rocketItem.junk.forEach((piece) => {
    if (!piece.alive) return;
    piece.spin += 0.08;
    piece.x += piece.vx + Math.sin(piece.spin) * 0.15;
    piece.y += piece.vy;
    if (piece.x < 3 || piece.x > 97) piece.vx *= -1;
    // Reached the ship line — scrap gets through, small score sting
    if (piece.y >= 90) {
      piece.alive = false;
      piece.hitClass = "";
      gameSession.score = Math.max(0, (gameSession.score || 0) - 40);
      const scoreEl = document.getElementById("galagaScore");
      if (scoreEl) scoreEl.textContent = String(gameSession.score || 0);
      const node = document.getElementById(`rocket-junk-${piece.id}`);
      if (node) node.style.display = "none";
    }
  });

  rocketItem.bullets = rocketItem.bullets
    .map((bullet) => {
      // Prefer clearing nearby junk in the shot lane, else drift toward answer atoms
      let target = null;
      let best = 14;
      rocketItem.junk.forEach((piece) => {
        if (!piece.alive) return;
        const dx = Math.abs(piece.x - bullet.x);
        if (dx < best && piece.y < bullet.y && piece.y > 20) {
          best = dx;
          target = piece;
        }
      });
      if (!target) {
        best = 16;
        rocketItem.enemies.forEach((enemy) => {
          if (!enemy.alive) return;
          const dx = Math.abs(enemy.x - bullet.x);
          if (dx < best && enemy.y < bullet.y) {
            best = dx;
            target = enemy;
          }
        });
      }
      let x = bullet.x;
      if (target) {
        const pull = Math.sign(target.x - bullet.x) * Math.min(0.85, Math.abs(target.x - bullet.x) * 0.14);
        x = bullet.x + pull;
      }
      return { ...bullet, x, y: bullet.y - 3.4 };
    })
    .filter((bullet) => bullet.y > -4);

  outer: for (const bullet of [...rocketItem.bullets]) {
    // Debris first — clear the lane before answer lock
    for (const piece of rocketItem.junk) {
      if (!piece.alive) continue;
      const hit =
        Math.abs(bullet.x - piece.x) < 9 &&
        Math.abs(bullet.y - piece.y) < 9;
      if (!hit) continue;
      rocketItem.bullets = rocketItem.bullets.filter((b) => b.id !== bullet.id);
      destroyRocketJunk(piece);
      break outer;
    }
    for (const enemy of rocketItem.enemies) {
      if (!enemy.alive) continue;
      const hit =
        Math.abs(bullet.x - enemy.x) < 16 &&
        Math.abs(bullet.y - enemy.y) < 14;
      if (!hit) continue;

      rocketItem.bullets = rocketItem.bullets.filter((b) => b.id !== bullet.id);
      resolveGalagaHit(enemy);
      break outer;
    }
  }

  syncGalagaDom();
}

function syncGalagaDom() {
  const ship = document.getElementById("rocketShip");
  if (ship) ship.style.left = `${rocketItem.shipX}%`;

  rocketItem.enemies.forEach((enemy) => {
    const el = document.getElementById(`rocket-enemy-${enemy.index}`);
    if (!el) return;
    el.style.left = `${enemy.x}%`;
    el.style.top = `${enemy.y}%`;
    el.classList.toggle("diving", Boolean(enemy.diving && enemy.alive));
  });

  (rocketItem.junk || []).forEach((piece) => {
    const el = document.getElementById(`rocket-junk-${piece.id}`);
    if (!el) return;
    el.style.left = `${piece.x}%`;
    el.style.top = `${piece.y}%`;
  });

  const layer = document.getElementById("rocketBulletLayer");
  if (layer) {
    layer.innerHTML = rocketItem.bullets.map((bullet) =>
      `<div class="rocket-bullet" style="left:${bullet.x}%;top:${bullet.y}%;"></div>`
    ).join("");
  }
}

function resolveGalagaHit(enemy) {
  if (!rocketItem || rocketItem.locked || rocketItem.answered) return;

  rocketItem.locked = true;
  const shell = document.querySelector(".rocket-shell");
  if (shell) shell.classList.add("is-locked");
  rocketItem.selected = enemy.index;
  rocketItem.burstX = enemy.x;
  rocketItem.burstY = enemy.y;
  rocketItem.showBurst = true;
  enemy.alive = false;
  enemy.diving = false;
  enemy.hitClass = "destroyed";

  const correct = Boolean(enemy.option.isCorrect);
  rocketItem.enemies.forEach((other) => {
    const el = document.getElementById(`rocket-enemy-${other.index}`);
    if (!el) return;
    if (other.option.isCorrect) el.classList.add("correct");
    if (other.index === enemy.index && !correct) el.classList.add("wrong");
  });

  if (correct) {
    gameSession.streak = (gameSession.streak || 0) + 1;
    gameSession.maxStreak = Math.max(gameSession.maxStreak || 0, gameSession.streak);
    const mult = Math.min(gameSession.streak, 5);
    gameSession.score = (gameSession.score || 0) + 1000 * mult;
    rocketItem.resultText = mult > 1 ? `LOCKED x${mult}` : "LOCKED";
    rocketItem.debrief = "";
  } else {
    gameSession.streak = 0;
    gameSession.lives = Math.max(0, (gameSession.lives == null ? 3 : gameSession.lives) - 1);
    const correctOpt = rocketItem.options.find((o) => o.isCorrect);
    rocketItem.resultText = gameSession.lives <= 0 ? "DEPLETED" : "CONTAMINATED";
    rocketItem.debrief = correctOpt ? correctOpt.label : "";
    recordWrongAnswer(
      gameSession,
      rocketItem.prompt,
      enemy.option.label,
      rocketItem.debrief || "Correct target"
    );
    const cabinet = document.getElementById("galagaCabinet");
    if (cabinet) {
      cabinet.classList.remove("shake");
      void cabinet.offsetWidth;
      cabinet.classList.add("shake");
    }
  }

  const burst = document.getElementById("rocketBurst");
  if (burst) {
    burst.style.left = `${enemy.x}%`;
    burst.style.top = `${enemy.y}%`;
    burst.classList.remove("show");
    void burst.offsetWidth;
    burst.classList.add("show");
  }

  const scoreEl = document.getElementById("galagaScore");
  if (scoreEl) scoreEl.textContent = String(gameSession.score || 0);
  const streakEl = document.getElementById("galagaStreak");
  if (streakEl) streakEl.textContent = `x${gameSession.streak || 0}`;
  const livesEl = document.getElementById("galagaLives");
  if (livesEl) {
    const lives = gameSession.lives == null ? 3 : gameSession.lives;
    livesEl.innerHTML = Array.from({ length: 3 }, (_, i) =>
      `<span class="galaga-life ${i < lives ? "" : "empty"}"></span>`
    ).join("");
  }

  rocketTimers.push(setTimeout(() => {
    if (!rocketItem) return;
    rocketItem.answered = true;
    rocketItem.bullets = [];
    syncGalagaDom();

    const arena = document.getElementById("rocketArena");
    if (arena && !arena.querySelector(".galaga-result")) {
      const banner = document.createElement("div");
      banner.className = `galaga-result ${correct ? "" : "miss"}`;
      banner.textContent = rocketItem.resultText;
      arena.appendChild(banner);
    }
    if (arena && rocketItem.debrief && !arena.querySelector(".galaga-debrief")) {
      const tip = document.createElement("div");
      tip.className = "galaga-debrief";
      tip.innerHTML = `DEBRIEF · correct was <strong>${escapeHTML(rocketItem.debrief)}</strong>`;
      arena.appendChild(tip);
    }

    rocketTimers.push(setTimeout(() => {
      advanceRound(correct);
      render();
    }, correct ? 650 : 1100));
  }, 280));
}

function prepareSpeedQuestion() {
  if (!gameSession || gameSession.complete) return;

  const correct = gameSession.queue[gameSession.index];
  const pool = gameSession.pool;
  const types = [];

  if (getFlavorProfile(correct)) types.push("quiz");
  // No "practice" here, deliberately. It used to ask from Guest Guidance, a field
  // of its own; since that was retired it reads Flavor Profile, which makes it the
  // same question as "quiz" with different wording — two of them in a mixed round
  // is one beer asked twice, not two questions. Guest Match survives as its own
  // game, where the hospitality framing is the point.
  if (getTapNumber(correct)) types.push("tap");
  if (getABVNumber(correct) > 0) types.push("abv");
  if (getStyle(correct)) types.push("style");

  if (types.length === 0) {
    gameSession.index++;
    if (gameSession.index >= gameSession.queue.length) {
      gameSession.complete = true;
      return;
    }
    prepareSpeedQuestion();
    return;
  }

  const type = pickRandom(types);

  if (type === "quiz") {
    speedItem = {
      type: "quiz",
      correct,
      question: getFlavorProfile(correct),
      options: shuffle([correct, ...pickWrongBeers(pool.filter(b => getFlavorProfile(b)), correct, 3)]),
      answered: false
    };
  } else if (type === "tap") {
    speedItem = {
      type: "tap",
      correct,
      question: `Tap ${getTapNumber(correct)}`,
      options: shuffle([correct, ...pickWrongBeers(pool.filter(b => getTapNumber(b)), correct, 3)]),
      answered: false
    };
  } else if (type === "abv") {
    const correctAbv = getABVNumber(correct);
    const wrongAbvs = uniqueSheetValues(
      pool.filter(b => b.Name !== correct.Name && getABVNumber(b) > 0),
      b => String(getABVNumber(b)),
      String(correctAbv)
    ).slice(0, 3).map(v => parseFloat(v));

    speedItem = {
      type: "abv",
      correct,
      correctAbv,
      question: `${col(correct, "Name")} — pick ABV`,
      options: shuffle([
        { label: getABVText(correct), value: correctAbv },
        ...wrongAbvs.map(v => ({ label: v + "%", value: v }))
      ]),
      answered: false
    };
  } else if (type === "style") {
    speedItem = {
      type: "style",
      correct,
      question: col(correct, "Name"),
      options: shuffle([
        { label: getStyle(correct), isCorrect: true },
        ...uniqueSheetValues(pool.filter(b => b.Name !== correct.Name), getStyle, getStyle(correct))
          .slice(0, 3)
          .map(s => ({ label: s, isCorrect: false }))
      ]),
      answered: false
    };
  }
}

function wrapGame(html) {

    ${html}

function renderGames(content) {
  if (!activeGame) {
    renderGameHub(content);
    return;
  }

  switch (activeGame) {
    case "flash": renderFlash(content); break;
    case "quiz": renderQuiz(content); break;
    case "practice": renderPractice(content); break;
    case "tap": renderTapMatch(content); break;
    case "abv": renderABVChallenge(content); break;
    case "style": renderStyleMatch(content); break;
    case "reverse": renderReverseQuiz(content); break;
    case "speed": renderSpeedRound(content); break;
    case "rocket": renderRocketRound(content); break;
    case "favbeer": renderFavoriteBeerGame(content); break;
    case "guestscene":
    case "recovery": renderScenarioGame(content); break;
    default: renderGameHub(content);
  }
}

function renderScenarioGame(content) {
  if (!gameSession || (gameSession.id !== "guestscene" && gameSession.id !== "recovery")) {
    content.innerHTML = wrapGame(`<div class="status"><strong>No scenario loaded.</strong></div>`);
    return;
  }
  if (gameSession.complete) {
    if (!gameSession.recorded && currentUser) {
      gameSession.recorded = true;
      recordProgress(gameSession.id === "recovery" ? "recovery" : "guestscene", "beer", gameSession.right, gameSession.queue.length);
    }
    content.innerHTML = wrapGame(renderRoundComplete(gameSession.id === "recovery" ? "Recovery training complete" : "Guest scenarios complete"));
    return;
  }
  const item = gameSession.queue[gameSession.index];
  const fb = gameSession.feedback;
  content.innerHTML = wrapGame(`
    <div class="game-card scenario-card">
      <p style="margin:0 0 8px;font-size:13px;color:var(--muted);">Scenario ${gameSession.index + 1} of ${gameSession.queue.length}${item.level ? ` · Level ${item.level}` : ""}</p>
      <p class="scenario-eyebrow">What would you do?</p>
      <p class="game-question">${escapeHTML(item.prompt)}</p>
      <div class="game-options">
        ${item.options.map((opt, idx) => {
          let cls = "game-option";
          if (fb) {
            cls += " disabled";
            if (opt.good) cls += " correct";
            else if (fb.idx === idx) cls += " wrong";
          }
          return `<button class="${cls}" ${fb ? "disabled" : `onclick="answerScenario(${idx})"`}>${escapeHTML(opt.text)}</button>`;
        }).join("")}
      </div>
      ${fb ? `<p class="scenario-feedback">${escapeHTML(fb.tip)}</p>
        <button class="game-next" style="margin-top:12px;" onclick="nextScenario()">Next</button>` : ""}
    </div>
  `);
}

function answerScenario(idx) {
  if (!gameSession || gameSession.feedback) return;
  const item = gameSession.queue[gameSession.index];
  const opt = item.options[idx];
  if (opt.good) gameSession.right += 1;
  const tip = opt.tip || (opt.good ? "Solid." : "Not the MP preferred path.");
  if (!opt.good) {
    const preferred = item.options.find((entry) => entry.good);
    recordWrongAnswer(gameSession, item.prompt, opt.text, preferred?.text || "Use the preferred MP response.", tip);
  }
  gameSession.feedback = { idx, tip };
  render();
}

function nextScenario() {
  if (!gameSession) return;
  gameSession.feedback = null;
  gameSession.index += 1;
  if (gameSession.index >= gameSession.queue.length) gameSession.complete = true;
  render();
}

async function answerFavoriteBeerGuess(guess) {
  if (!gameSession || gameSession.id !== "favbeer" || gameSession.busy) return;
  const q = gameSession.questions[gameSession.index];
  if (!q || gameSession.feedback) return;

  gameSession.busy = true;
  try {
    const result = await apiFetch("/api/games/favorite-beer-guess", {
      method: "POST",
      body: JSON.stringify({ targetUserId: q.targetUserId, guess })
    });
    gameSession.feedback = { ...result, guess };
    if (result.correct) {
      gameSession.right += 1;
      gameSession.bonusPoints += result.pointsAwarded || 0;
      q.unlocked = true;
    }
    leaderboardData = null;
    myProgressData = null;
  } catch (err) {
    gameSession.feedback = { correct: false, error: err.message, guess };
  } finally {
    gameSession.busy = false;
    render();
  }
}

function nextFavoriteBeerQuestion() {
  if (!gameSession || gameSession.id !== "favbeer") return;
  gameSession.feedback = null;
  gameSession.index += 1;
  if (gameSession.index >= gameSession.questions.length) {
    gameSession.complete = true;
  }
  render();
}

function renderFavoriteBeerGame(content) {
  if (!currentUser) {

      <div class="auth-panel">
        <h3>Log in to play Staff Favorites</h3>
        <p class="hint">Guess teammates’ favorite beers for bonus points and unlock them on the leaderboard.</p>
        <button class="game-next" onclick="showLoginGate()">Log in</button>
      </div>
    `);
    return;
  }

  if (!gameSession || gameSession.loading) {
    content.innerHTML = wrapGame(`<div class="status"><strong>Loading Staff Favorites…</strong></div>`);
    return;
  }

  if (gameSession.error) {
    content.innerHTML = wrapGame(`<div class="status"><strong>Could not start.</strong>${escapeHTML(gameSession.error)}</div>`);
    return;
  }

  if (gameSession.complete) {
    const bonus = gameSession.bonusPoints || 0;
    content.innerHTML = wrapGame(`
      <div class="game-card">
        <p class="game-question">${gameSession.questions.length
          ? "Staff Favorites round complete!"
          : escapeHTML(gameSession.message || "No favorites to guess yet.")}</p>
        ${gameSession.questions.length ? `
          <p style="margin:12px 0;color:var(--muted);font-size:14px;">
            ${gameSession.right} / ${gameSession.questions.length} correct
            ${bonus ? ` · <span class="game-points-badge">+${bonus} bonus pts</span>` : " · no new unlocks this round"}
          </p>
          <p style="margin:0 0 16px;font-size:13px;color:var(--muted);">Correct first-time unlocks reveal that person’s favorite on the leaderboard.</p>
        ` : `<p style="margin:12px 0 16px;font-size:13px;color:var(--muted);">Have teammates set theirs on War Games, then come back.</p>`}
        <button class="game-next" onclick="stopRocketLoop(); activeGame=null; gameSession=null; render();">Back to War Games</button>
        ${gameSession.questions.length ? `<button class="briefing-back" style="margin-top:10px;" onclick="startGame('favbeer')">Play again</button>` : ""}
      </div>
    `);

  }

  const q = gameSession.questions[gameSession.index];

  content.innerHTML = wrapGame(`
    <div class="game-card">

        Question ${gameSession.index + 1} of ${gameSession.questions.length}
        · ${gameSession.bonusPoints || 0} bonus pts this round
        ${q.unlocked ? " · already unlocked" : " · +25 pts if you unlock"}
      </p>
      <p class="game-question">What’s <strong>${escapeHTML(q.name)}</strong>’s favorite beer?</p>
      <div class="game-options">
        ${q.choices.map(choice => {
          let cls = "game-option";
          if (feedback) {
            cls += " disabled";
            if (feedback.correct && choice === feedback.guess) cls += " correct";
            else if (!feedback.correct && choice === feedback.guess) cls += " wrong";
            else if (feedback.correct && feedback.favoriteBeer && choice === feedback.favoriteBeer) cls += " correct";
          }
          const payload = JSON.stringify(choice).replace(/</g, "\\u003c");
          return `<button class="${cls}" ${feedback || gameSession.busy ? "disabled" : `onclick='answerFavoriteBeerGuess(${payload})'`}>${escapeHTML(choice)}</button>`;
        }).join("")}
      </div>
      ${feedback ? `
        <p style="margin:16px 0 0;font-size:14px;">
          ${feedback.error
            ? escapeHTML(feedback.error)

              ? (feedback.pointsAwarded

                  : `Correct — you already had <strong>${escapeHTML(feedback.favoriteBeer || q.name)}</strong> unlocked.`)
              : "Not quite — try another teammate. Favorites stay hidden until you unlock them."}
        </p>
        <button class="game-next" style="margin-top:14px;" onclick="nextFavoriteBeerQuestion()">Next</button>
      ` : ""}
    </div>
  `);

function pickRandom(pool) {
  return pool[Math.floor(Math.random() * pool.length)];
}

            cls += " disabled";
            if (o.Name === item.correct.Name) cls += " correct";

  `);
}

function startNewTapRotation() {
  if (newTapTimer) clearInterval(newTapTimer);

  newTapTimer = setInterval(() => {
    const newBeers = newTapBeers();

    if (newBeers.length < 2) return;

    newTapIndex = (newTapIndex + 1) % newBeers.length;

    // Swap the banner only. This used to call render(), redrawing the entire
    // beer list every 4.5 seconds — every card, every filter — which read as the
    // page flickering. It went unnoticed for as long as it existed because the
    // `New Tap` column it depends on was never populated, so the rotation never
    // actually ran; making that column work is what surfaced it.
    if (contentType() !== "beer" && contentType() !== "ontap") return;
    const banner = document.getElementById("newTapBanner");
    if (banner) banner.outerHTML = renderNewTapBanner();
  }, 4500);
}

function csvEscapeCell(value) {
  const text = String(value ?? "");
  if (/[",\n\r]/.test(text)) return `"${text.replace(/"/g, '""')}"`;
  return text;
}

/** Yeast + hop types from Nucleus key_ingredients — skips malt/grain and marketing copy. */
function getYeastAndHops(item) {
  const raw = col(item, "Key Ingredients");
  if (!raw) return "";

  const parts = raw.split(/[,;|/]+/).map((part) => part.trim()).filter(Boolean);
  if (!parts.length) return "";

  const isYeast = (part) => /\byeasts?\b/i.test(part);
  const isHop = (part) => /\bhops?\b/i.test(part);
  const isGrainOrOther = (part) =>
    /\b(malts?|oats?|wheat|barley|rye|rice|corn|maize|honey|lactose|sugar|fruit|coffee|vanilla|cocoa|chocolate|salt|spice|pepper|chili|water)\b/i.test(
      part
    );

  const yeastParts = parts.filter(isYeast);

  // Trailing hop run: "Wheat, Oats, Citra Azacca, Zythos hops" → Citra… + Zythos hops
  let hopParts = [];
  if (parts.some(isHop) || /\bhops?\b/i.test(raw)) {
    for (let i = parts.length - 1; i >= 0; i--) {
      if (isYeast(parts[i]) || isGrainOrOther(parts[i])) break;
      hopParts.unshift(parts[i]);
    }
    if (!hopParts.some(isHop)) hopParts = [];
  }

  const combined = [...hopParts, ...yeastParts];
  return [...new Set(combined)].join(", ");
}

function getOnTapBeersSorted() {
  return beers
    .filter(isOnTap)
    .sort((a, b) => Number(getTapNumber(a) || 999) - Number(getTapNumber(b) || 999));

const PRINT_CATEGORY_ORDER = ["CORE", "LIMITED", "HOPPY", "BOLDER", "OTHER / NITRO"];
let tapDisplayMeta = {};
let tapDisplayMetaLoaded = false;
let tapDisplayMetaLoading = false;
let ontapPrintMode = "draft";

function inferPrintCategory(beer) {
  const hay = `${getStyle(beer)} ${col(beer, "Name")}`.toLowerCase();
  if (/nitro|\bn2\b/.test(hay)) return "OTHER / NITRO";
  if (/imperial|double ipa|triple|barleywine|barrel|old ale|strong ale/.test(hay)) return "BOLDER";
  if (/hazy|ipa|pale ale|pils|pilsner|\bhop/.test(hay)) return "HOPPY";
  if (/sour|fruit|saison|farmhouse|gose|berliner|limited|seasonal|collab/.test(hay)) return "LIMITED";
  if (/stout|porter|schwarzbier/.test(hay)) return "OTHER / NITRO";
  return "CORE";
}

function beerProductId(beer) {
  return String(beer?.nucleus_product_id || "").trim();
}

async function ensureTapDisplayMeta({ force = false } = {}) {
  if (tapDisplayMetaLoaded && !force) return tapDisplayMeta;
  if (tapDisplayMetaLoading) return tapDisplayMeta;
  tapDisplayMetaLoading = true;
  try {
    const data = await apiFetch("/api/tap-display-meta");
    tapDisplayMeta = data.meta || {};
    tapDisplayMetaLoaded = true;
  } catch (err) {
    console.warn("Tap display meta unavailable:", err.message);
    if (!tapDisplayMetaLoaded) tapDisplayMeta = {};
  } finally {
    tapDisplayMetaLoading = false;
  }
  return tapDisplayMeta;
}

function getPourSize(beer) {
  const id = beerProductId(beer);
  const saved = id && tapDisplayMeta[id]?.pourSize;
  return saved || "12/16 oz";
}

function getPrintCategory(beer) {
  const id = beerProductId(beer);
  const saved = id && tapDisplayMeta[id]?.printCategory;
  return saved || inferPrintCategory(beer);
}

function shortFlavor(beer) {
  const flavor = getFlavorProfile(beer) || getDescription(beer);
  if (!flavor) return "";
  return flavor.length > 110 ? `${flavor.slice(0, 107)}…` : flavor;
}

  const id = beerProductId(beer);

  return `
    <div class="ontap-meta-edit" onclick="event.stopPropagation()">
      <div>

        <input id="pour-${escapeForAttribute(id)}" type="text" value="${pour}" placeholder="12/16 oz">
      </div>

        <label for="cat-${escapeForAttribute(id)}">Print category</label>
        <select id="cat-${escapeForAttribute(id)}">

          `).join("")}

async function saveTapDisplayMeta(productId) {
  if (!canEditTapsUi() || !productId) return;
  const pourSize = document.getElementById(`pour-${productId}`)?.value.trim() || "12/16 oz";
  const printCategory = document.getElementById(`cat-${productId}`)?.value || "CORE";
  try {
    const data = await apiFetch(`/api/tap-display-meta/${encodeURIComponent(productId)}`, {
      method: "PUT",
      body: JSON.stringify({ pourSize, printCategory })
    });
    if (data.item) tapDisplayMeta[productId] = data.item;
    else await ensureTapDisplayMeta({ force: true });
    render();
  } catch (err) {
    alert(err.message || "Could not save pour size / category.");
  }
}

    groups.get(cat).push(beer);

  const sections = PRINT_CATEGORY_ORDER.map((cat) => {
    const items = groups.get(cat) || [];
    if (!items.length) return "";
    return `

function printOnTapSheets(mode) {
  syncOntapPrintRoot();
  document.body.classList.add("printing-ontap");
  document.body.classList.toggle("printing-draft", mode === "draft" || mode === "both");
  document.body.classList.toggle("printing-bar", mode === "bar" || mode === "both");
  if (mode === "both") {
    document.body.classList.add("printing-draft", "printing-bar");
  }
  const cleanup = () => {
    document.body.classList.remove("printing-ontap", "printing-draft", "printing-bar");
    window.removeEventListener("afterprint", cleanup);
  };
  window.addEventListener("afterprint", cleanup);
  window.print();
  // Safari sometimes skips afterprint
  setTimeout(cleanup, 1000);
}

function downloadOnTapCsv(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  try {
    const rows = getOnTapBeersSorted();
    if (!rows.length) {
      alert("No beers are currently on tap to export.");
      return;
    }

    const headers = [
      "Tap",
      "Name",
      "Style",
      "ABV",
      "Gluten-Reduced",
      "New Tap",
      "Tasting Notes",
      "Description"
    ];

    const lines = [
      headers.join(","),
      ...rows.map((beer) =>
        [
          getTapNumber(beer) || "",
          col(beer, "Name"),
          getStyle(beer),
          getABVText(beer).replace(/%/g, ""),
          isYes(beer["Gluten-Reduced"]) ? "Yes" : "No",
          isYes(beer["New Tap"]) ? "Yes" : "No",
          getFlavorProfile(beer),
          getYeastAndHops(beer)
        ]
          .map(csvEscapeCell)
          .join(",")
      )
    ];

    // BOM helps Excel open UTF-8 correctly on Windows.
    const blob = new Blob(["\uFEFF" + lines.join("\r\n")], {
      type: "text/csv;charset=utf-8;"
    });
    const url = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0, 10);
    const link = document.createElement("a");
    link.href = url;
    link.download = `mp-on-tap-${stamp}.csv`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (error) {
    console.error(error);
    alert(error.message || "Could not download the tap list.");
  }
}

function renderList(content) {
  const view = contentType();
  const query = document.getElementById("search").value.toLowerCase().trim();
  let source = view === "food" ? foods : beers;

  if (view === "ontap" && canManageTaps() && !tapsState.loaded) {
    if (!tapsState.loading) {
      content.innerHTML = `<div class="status"><strong>Loading taps…</strong></div>`;
      ensureTapsState().then(() => render());
    }
    return;
  }

  if (view === "ontap" && !tapDisplayMetaLoaded && !tapDisplayMetaLoading) {
    content.innerHTML = `<div class="status"><strong>Loading On Tap…</strong></div>`;
    ensureTapDisplayMeta().then(() => render());
    return;
  }

  if (view === "ontap") {
    source = source
      .filter(isOnTap)
      .sort((a, b) => {
        const tapA = Number(getTapNumber(a) || 999);
        const tapB = Number(getTapNumber(b) || 999);
        return tapA - tapB;
      });
  }

  const filtered = source.filter(item => {
    const matchesSearch =
      !query ||
      getSearchText(item).includes(query);

    const matchesActiveFilter =
      view === "food" ||
      matchesFilter(item);

    return matchesSearch && matchesActiveFilter;
  });

  const banner =
    view === "ontap"
      ? renderNewTapBanner()
      : "";

  const adminNote = view === "ontap" && canManageTaps()
    ? (tapsState.error
      ? `<div class="status" style="margin-bottom:12px;"><strong>Tap editors unavailable.</strong> ${escapeHTML(tapsState.error)}</div>`
      : canEditTapsUi() && typeof isPageEditMode === "function" && isPageEditMode("ontap")
        ? `${typeof renderPageEditBanner === "function" ? renderPageEditBanner("Edit mode — change what’s pouring, pour size, and print category.") : ""}
           <div id="tapSaveError" class="auth-error" style="display:none;margin:0 0 12px;"></div>`
        : canEditTapsUi()
          ? ""
          : `<div class="status" style="margin-bottom:12px;"><strong>Read-only taps.</strong> Set <code>NUCLEUS_API_KEY_PATRON_WRITE</code> to edit what’s pouring.</div>`)
    : "";

  const pageHeader = view === "ontap" && typeof renderEditablePageHeader === "function"
    ? renderEditablePageHeader({
        title: "On Tap",
        canEdit: canEditTapsUi(),
        view: "ontap",
        extraActionsHtml: getOnTapBeersSorted().length
          ? `<button type="button" class="btn btn-print" onclick="openOnTapPrintChooser()">Print</button>`
          : ""
      })
    : "";

  let emptyTapCards = "";
  if (view === "ontap" && canEditTapsUi() && !query && typeof isPageEditMode === "function" && isPageEditMode("ontap")) {
    const emptyTaps = [...(tapsState.taps || [])]
      .filter((tap) => !tap.current_product_id)
      .sort((a, b) => (a.sort_order - b.sort_order) || (a.tap_number - b.tap_number));
    emptyTapCards = emptyTaps.map(renderEmptyTapCard).join("");
  }

  if (view === "ontap") {
    if (filtered.length === 0 && !emptyTapCards) {
      const message = source.length === 0
        ? "No beers are currently marked as On Tap. Confirm beers are marked on tap in Nucleus."
        : "Nothing matches your search or selected filter.";
      content.innerHTML = pageHeader + banner + adminNote + `
        <div class="status"><strong>Nothing to show yet.</strong>${message}</div>
      `;
      return;
    }
    content.innerHTML =
      pageHeader +
      banner +
      adminNote +
      renderOnTapTable(filtered) +
      renderOnTapMobileCards(filtered) +
      emptyTapCards;
    if (canEditTapsUi() && typeof isPageEditMode === "function" && isPageEditMode("ontap")) {
      queueMicrotask(populateBeerSelects);
    }
    return;
  }

  if (filtered.length === 0 && !emptyTapCards) {
    const message = "Nothing matches your search or selected filter.";

    content.innerHTML = pageHeader + banner + adminNote + `
      <div class="status">
        <strong>Nothing to show yet.</strong>
        ${message}
      </div>
    `;
    return;
  }

  content.innerHTML =
    pageHeader +
    banner +
    adminNote +
    '<div class="list">' +
    filtered.map(item => renderBeerCard(item)).join("") +
    emptyTapCards +
    "</div>";
}

function escapeHTML(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeForAttribute(value) {
  return String(value || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}

function updateStageTitle() {
  const el = document.getElementById("stageTitle");
  if (!el) return;
  const view = contentType();
  const menuLabel = MENU_SUBVIEWS.find((v) => v.id === view)?.label;
  const floorLabel = FLOOR_HUB_VIEWS.find((v) => v.id === floorHubView)?.label;
  const leafLabels = {
    home: "Home",
    askmp: "Ask MP",
    features: "App guide",
    feedback: "Feedback",
    progress: "My Progress",
    "shift-survey": "End of Shift",
    training: "Training",
    inventory: "Inventory",
    reviews: "Reviews",
    games: "War Games",
    team: "Team",
    "shift-reports": "Shift Reports",
    sops: "SOPs",
    checklists: "Checklists",
    floor: "Floor Tools",
    "today-floor": "Today's Floor"
  };
  if (view === "home") {
    el.textContent = "Home";
    return;
  }
  if (activeType === "menu" && menuLabel) {
    el.textContent = menuLabel;
    return;
  }
  if (activeType === "floor" && floorLabel) {
    el.textContent = floorLabel;
    return;
  }

    return;
  }
  const active = document.querySelector("#mainTabs .tab.active");
  el.textContent = active ? active.textContent.trim() : "Manhattan Project";
}

function syncMobileTabs() {
  const main = document.getElementById("mainTabs");
  const mobile = document.getElementById("mobileTabs");
  if (!main || !mobile) return;
  const sources = [...main.querySelectorAll(".tab[data-type]")];
  mobile.innerHTML = "";
  sources.forEach((src) => {
    const dst = document.createElement("button");
    dst.type = "button";
    dst.className = "tab";
    dst.dataset.type = src.dataset.type;
    dst.textContent = src.textContent.trim();
    dst.classList.toggle("active", src.classList.contains("active"));
    dst.style.display = src.style.display;
    ["tab-auth-only", "tab-team-only", "tab-shift-lead-only"].forEach((c) => {
      if (src.classList.contains(c)) dst.classList.add(c);
    });
    mobile.appendChild(dst);
  });
  mobile.dataset.ready = "1";
}

function activateAppTab(type) {
  if (!type) return;
  closeMobileNav();

  let nextActive = type;
  if (MENU_SUBVIEW_IDS.has(type)) {
    menuSubView = type;
    nextActive = "menu";
  } else if (type === "menu") {
    nextActive = "menu";
  } else if (type === "sops") {
    floorHubView = "sops";
    nextActive = "floor";
  } else if (type === "checklists") {
    floorHubView = "checklists";
    nextActive = "floor";
  } else if (type === "today-floor" || type === "today") {
    floorHubView = "today";
    nextActive = "today-floor";
  } else if (type === "floor") {
    floorHubView = "tools";
    nextActive = "floor";
  }

  persistHubViews();

  activeType = nextActive;
  const view = contentType();
  highlightNavLeaf(view);
  if (typeof clearOtherPageEditModes === "function") clearOtherPageEditModes(view);

  if (view !== "games") {
    activeGame = null;
    gameSession = null;
    rocketItem = null;
    stopRocketLoop();
  }
  if (view !== "coffee") {
    coffeeSection = "menu";
    coffeeMode = "guide";
    if (view !== "progress" && activeType !== "team") coffeeSession = null;
  }
  if (view !== "food") foodCategory = "all";
  if (view !== "merch") merchSection = "stock";
  if (view !== "sops") {
    sopCategory = "all";
    if (sopEditId) resetSopForm();
  }
  if (view !== "checklists") {
    checklistId = null;
    checklistDetail = null;
  }
  if (view !== "bar") barSection = "all";
  if (activeType === "team") teamDetailId = null;
  if (activeType !== "shift-reports") shiftReportDate = getLocalDateKey();
  updateSearchPlaceholder();
  updateStageTitle();
  syncAccountLinkActive();
  render();
}

document.addEventListener("click", (event) => {
  const toggle = event.target.closest("#mainTabs .nav-group-toggle");
  if (toggle) {
    event.preventDefault();
    const group = toggle.closest(".nav-group");
    if (!group) return;
    const open = !group.classList.contains("is-open");
    document.querySelectorAll("#mainTabs .nav-group").forEach((other) => {
      if (other === group) return;
      other.classList.remove("is-open");
      other.querySelector(".nav-group-toggle")?.setAttribute("aria-expanded", "false");
    });
    group.classList.toggle("is-open", open);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    return;
  }
  const tab = event.target.closest("#mainTabs .tab[data-type], #mobileTabs .tab[data-type]");
  if (!tab) return;
  activateAppTab(tab.dataset.type);
});

});

function stripHtmlForChat(html) {
  return String(html || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
}

async function bootstrap() {
  // Auth first. Everything below either calls a gated endpoint or renders the
  // app, and neither is any use to someone who is not signed in.
  await initAuth();
  if (!currentUser) return;

  await loadData({ skipRender: true });
  await loadBeerCheckins();
  loadSopsData(true).catch(() => {});
  await refreshShiftContext();
  updateAuthUI();

  // Trainees land on Training; others keep their current view.
  if (typeof isTraineeUser === "function" && isTraineeUser(currentUser)) {
    activateAppTab("training");
  } else {
    render();
  }

  await maybeShowDailyBriefing();
  await maybePromptClosingChecklist();
  await maybePromptShiftSurvey();
  await maybeShowShiftDigest();

  // Keep on-shift / lead status fresh without a full reload.
  setInterval(() => {
    if (!currentUser) return;
    refreshShiftContext().catch(() => {});
  }, 5 * 60 * 1000);
}

bootstrap();
</script>
